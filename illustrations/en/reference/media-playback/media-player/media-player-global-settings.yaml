    caption: Global Volume Control
    show: "Global Volume Control. Use the adjacent instructions as the content brief: To adjust the volume of the Media Player audio output, click the Volume button at the bottom right of the Media Player widget, and drag the slider to set the volume level. It is possible to adjust the audio volume for the individual media items, and those changes will be combined with the Media Player audio output."
