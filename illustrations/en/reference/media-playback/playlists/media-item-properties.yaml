    title: Multiply By Alpha
    caption: Multiply By Alpha
    show: "Multiply By Alpha. Use the adjacent instructions as the content brief: To set Multiply by Alpha for a media item, right-click on a media item, select Settings from the dropdown menu, and check the Multiply by Alpha box. When a media item contains the alpha channel, it is indicated by the alpha channel icon on a media item thumbnail in the playlist."
    status: draft-needs-review
