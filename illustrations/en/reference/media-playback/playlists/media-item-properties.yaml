  - id: en-400612a347-009
    title: Media Item Color Correction
    caption: Media Item Color Correction
    show: "Media Item Color Correction. Use the adjacent instructions as the content brief: To access the color correction controls for a media item, right-click on a media item, select Settings from the dropdown menu, and click the Color Correction button in the Image Adjustment options section. Note: Color corrections can be also applied globally to the Media Player output, and those are cumulative with the ones applied to the individual media items. See Media Player Color Correction."
    status: draft-needs-review
    basis: Existing alt text, heading and adjacent prose only; no visual inspection or new behavioral claim.
