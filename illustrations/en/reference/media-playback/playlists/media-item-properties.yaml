figures:
  - id: en-400612a347-001
    title: Renaming Media Items
    caption: Renaming Media Items
    show: "Renaming Media Items. Use the adjacent instructions as the content brief: There are two ways to rename a media item. Renaming a media item in the Media Library will change its name globally, i.e. in all existing playlists. A media item’s name in a particular playlist can also be changed by assigning it a title – right-click on the media item, select Settings from the dropdown menu, and enter a new name in the Title field. Note: Media items cannot be renamed if they are currently playing in"
    status: draft-needs-review
    basis: Existing alt text, heading and adjacent prose only; no visual inspection or new behavioral claim.
    placement:
      before_block: 5
      section: Renaming Media Items
    source_url: https://help.screenberry.com/images/media-playback/animation/Renaming-Media-Items.gif
    source_alt: Renaming Media Items
    text_coverage: not-independently-verified
  - id: en-400612a347-002
    title: Crossfading Media Items
    caption: Crossfading Media Items
    show: "Crossfading Media Items. Use the adjacent instructions as the content brief: To fade a media item in (to crossfade it with a previous one), right-click on it, select Settings from the dropdown menu, and enter a time or number of frames in the Fade In field in the opened window. Note: When fade in is set for a media item, its content overlays the previous media item for the duration of the crossfade transition."
    status: draft-needs-review
    basis: Existing alt text, heading and adjacent prose only; no visual inspection or new behavioral claim.
    placement:
      before_block: 8
      section: Crossfading Media Items
    source_url: https://help.screenberry.com/images/media-playback/animation/Crossfading-Media-Items.gif
    source_alt: Crossfading Media Items
    text_coverage: not-independently-verified
