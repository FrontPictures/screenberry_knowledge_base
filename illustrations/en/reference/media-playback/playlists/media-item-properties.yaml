    caption: Disabling Video Output Of A Media Item
    show: "Disabling Video Output Of A Media Item. Use the adjacent instructions as the content brief: To disable the video track of a media item, right-click on a media item, choose Settings from the dropdown menu, and select the Disable Video checkbox. Note: When the video output of a media item is disabled, the audio track of the media item is still being played during playback."
