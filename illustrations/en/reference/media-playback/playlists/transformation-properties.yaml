  - id: en-889ea5a2c2-002
    title: Anchor Point Reposition
    caption: Anchor Point Reposition
    show: "Anchor Point Reposition. Use the adjacent instructions as the content brief: Selecting Custom Transformation gives you full control over the media item’s anchor point, position, scale, and rotation. This method is essential when precise layout or animated transformations are required. The anchor point is the internal reference within the media item used for scaling, rotation, and positioning. The Anchor Point Reposition control lets you quickly align the anchor point to standard locations wit"
    status: draft-needs-review
    basis: Existing alt text, heading and adjacent prose only; no visual inspection or new behavioral claim.
    placement:
      before_block: 11
      section: Anchor Point Reposition
    source_url: https://help.screenberry.com/images/media-playback/animation/Anchor-Point-Reposition.gif
    source_alt: Anchor Point Reposition
    text_coverage: not-independently-verified
  - id: en-889ea5a2c2-003
    title: Manual Anchor Point Adjustment
    caption: Manual Anchor Point Adjustment
    show: "Manual Anchor Point Adjustment. Use the adjacent instructions as the content brief: When you click one of the Anchor Point Reposition preset buttons, only the anchor point moves inside the media item. The media item itself remains in the same position on the Media Player canvas. While the Anchor Point Reposition presets snap the anchor to predefined locations, the Anchor Point fields let you set its position anywhere relative to the center of the media item by entering exact X and Y values."
    status: draft-needs-review
    basis: Existing alt text, heading and adjacent prose only; no visual inspection or new behavioral claim.
    placement:
      before_block: 15
      section: Manual Anchor Point Adjustment
    source_url: https://help.screenberry.com/images/media-playback/animation/Manual-Anchor-Point-Adjustment.gif
    source_alt: Manual Anchor Point Adjustment
    text_coverage: not-independently-verified
  - id: en-889ea5a2c2-004
    title: Position Adjustment
    caption: Position Adjustment
    show: "Position Adjustment. Use the adjacent instructions as the content brief: When you adjust the anchor point manually, the media item shifts to keep the anchor fixed in the same location on the Media Player canvas. This lets you place the pivot exactly where you want transformations (like scaling or rotation) to originate. The Position parameter sets the entire media item, along with its anchor point, relative to the Media Player canvas."
    status: draft-needs-review
    basis: Existing alt text, heading and adjacent prose only; no visual inspection or new behavioral claim.
    placement:
      before_block: 19
      section: Position Adjustment
    source_url: https://help.screenberry.com/images/media-playback/animation/Position-Adjustment.gif
    source_alt: Position Adjustment
    text_coverage: not-independently-verified
  - id: en-889ea5a2c2-005
    title: Using Position Alignment Buttons
    caption: Using Position Alignment Buttons
    show: "Using Position Alignment Buttons. Use the adjacent instructions as the content brief: When you adjust the Position, the media item shifts as a whole, preserving the relationship between its content and anchor point. You can also use the Position Alignment Buttons to snap the anchor point to standard positions on the Media Player canvas, such as top-center, middle-right, or bottom-left."
    status: draft-needs-review
    basis: Existing alt text, heading and adjacent prose only; no visual inspection or new behavioral claim.
