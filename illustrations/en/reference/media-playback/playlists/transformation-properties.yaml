    title: Position Method Presets
    caption: Position Method Presets
    show: "Position Method Presets. Use the adjacent instructions as the content brief: Adjusting these properties allows you to precisely control the media item’s placement, size, and orientation. When using transformation presets other than Custom Transformation, Screenberry automatically adjusts how a media item fits within the Media Player canvas based on the selected mode:"
