    title: Transformation Scale
    caption: Transformation Scale
    show: "Transformation Scale. Use the adjacent instructions as the content brief: Note: These buttons are especially useful during layout setup for quickly aligning media items. The Scale parameter changes the size of the media item as a percentage of its original dimensions."
