  - id: en-965e9f2788-004
    title: Restore Node Settings
    caption: Restore Node Settings
    show: "Restore Node Settings. Use the adjacent instructions as the content brief: The change of the node parameter value in the Settings panel is indicated by the button next to the parameter value field. Clicking on this button restores the default parameter value."
