  - id: en-965e9f2788-006
    title: Hiding and Showing Individual Node Parameters
    caption: Hiding and Showing Individual Node Parameters
    show: "Hiding and Showing Individual Node Parameters. Use the adjacent instructions as the content brief: To hide a parameter, right-click on the parameter name and select Hide from the dropdown menu. To display hidden parameters, click Show in the Hidden parameters field. The parameters with a hidden status are displayed in italics. To unhide a parameter, right-click on the parameter name and select Show from the dropdown menu. To stop displaying hidden parameters, click Hide in the Hidden parameters field. Note: Less f"
    status: draft-needs-review
