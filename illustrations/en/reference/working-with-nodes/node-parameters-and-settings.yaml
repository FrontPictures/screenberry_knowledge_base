  - id: en-965e9f2788-001
    title: Node Parameters Pins
    caption: Node Parameters Pins
    show: "Node Parameters Pins. Use the adjacent instructions as the content brief: In Screenberry, every node has a set of parameters. These parameters are represented by pins on the nodes. The flow of data, actions, or messages between nodes is established by creating links between the pins of corresponding parameters. Data (gray pin ) parameter contains simple data (number, string, timecode) or a pointer to Screenberry internal resources (i.e. image)."
    status: draft-needs-review
    basis: Existing alt text, heading and adjacent prose only; no visual inspection or new behavioral claim.
    placement:
      before_block: 3
      section: Node Parameters (Pins)
    source_url: https://help.screenberry.com/images/working-with-nodes/animation/Node-Parameters-Pins.gif
    source_alt: Node Parameters Pins
    text_coverage: not-independently-verified
  - id: en-965e9f2788-002
    title: Node Parameters Example
    caption: Node Parameters Example
    show: "Node Parameters Example. Use the adjacent instructions as the content brief: Action (orange pin ) supports the creation of multiple links to one input. The value of each resulting frame will be determined using logical OR for all input values. Messages (pink pin ) also enables the creation of multiple links to one input. All incoming messages will be queued on the input."
    status: draft-needs-review
    basis: Existing alt text, heading and adjacent prose only; no visual inspection or new behavioral claim.
    placement:
