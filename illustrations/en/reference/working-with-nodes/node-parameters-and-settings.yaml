    text_coverage: not-independently-verified
  - id: en-965e9f2788-007
    title: Hiding Showing Node Pins
    caption: Hiding Showing Node Pins
    show: "Hiding Showing Node Pins. Use the adjacent instructions as the content brief: In the Settings panel, left-clicking on the dot to the left of the parameter name toggles between displaying and hiding the corresponding parameter pin on the node. A blue dot indicates that the parameter pin is displayed, and a gray dot indicates that it is hidden. When a parameter pin with an established link becomes hidden, this link will remain active and be displayed as a dimmed straight line."
