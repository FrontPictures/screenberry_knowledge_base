  - id: en-965e9f2788-003
    title: Node Settings
    caption: Node Settings
    show: "Node Settings. Use the adjacent instructions as the content brief: Selecting the node will open its Settings panel where node parameters can be edited. The change of the node parameter value in the Settings panel is indicated by the button next to the parameter value field. Clicking on this button restores the default parameter value."
    status: draft-needs-review
    basis: Existing alt text, heading and adjacent prose only; no visual inspection or new behavioral claim.
    placement:
