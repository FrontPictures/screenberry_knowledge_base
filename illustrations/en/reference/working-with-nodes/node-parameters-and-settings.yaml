  - id: en-965e9f2788-005
    title: Selecting Nodes by Type
    caption: Selecting Nodes by Type
    show: "Selecting Nodes by Type. Use the adjacent instructions as the content brief: When more than one node is selected, only the parameters common to all selected nodes are displayed in the Settings panel and can be edited. Additionally, information regarding the number of nodes of each type within the selection will be displayed on the buttons at the top of the Settings panel. Click a button with a number to have only the nodes of that type remain in the current selection."
    status: draft-needs-review
    basis: Existing alt text, heading and adjacent prose only; no visual inspection or new behavioral claim.
