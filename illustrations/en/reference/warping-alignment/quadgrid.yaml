    title: Quad Grid Node Tree
    caption: Quad Grid Node Tree
    show: "Quad Grid Node Tree. Use the adjacent instructions as the content brief: The Quad Grid node is a patch that applies perspective to the individual planes of the user-defined mesh grid. This patch is developed to map projection onto surfaces of stair-like objects. In a typical setup, the Quad Grid node receives a source image as the input and outputs the modified image to the Display or Canvas node. Example of the node graph with the Quad Grid node"
