    caption: LedStripesMapper
    show: "LedStripesMapper. Use the adjacent instructions as the content brief: The LED Stripes Mapper node is a patch that allows the remapping of media content into lines. Typically, it is used to output the signal to a LED stripes controller. It can also be used to control lighting devices that can receive video as input. Typically, the LED Stripes Mapper node receives the media content from the Media Player node and sends output to the Canvas node. Example of the node graph with the LED Stri"
