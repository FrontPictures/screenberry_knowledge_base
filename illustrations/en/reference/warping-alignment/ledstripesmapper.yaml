    title: LedStripesMapper Playback
    caption: LedStripesMapper Playback
    show: "LedStripesMapper Playback. Use the adjacent instructions as the content brief: To remap the content, do the following: In the Node Graph widget, create a node tree by adding the Media Player, LED Stripes Mapper, and Canvas nodes, and connect them by Ctrl-clicking them one by one.Switch to the Media Player widget, add the media content you want to remap into the lines to the Media Player playlist and start playback to have a visual reference while working with the patch. Switch to the Patch Edit"
