    title: LedStripesMapper Selection
    caption: LedStripesMapper Selection
    show: "LedStripesMapper Selection. Use the adjacent instructions as the content brief: Switch to the Patch Editor, and select the LED Stripes Mapper in the patches list. In the Settings panel of the LED Stripes Mapper:In the Source Line Width parameter, set the width in pixels of the source media to be remapped as lines.Enter values for the Target Image Size, Offset X and Y, output Line Width, and Spacing parameters (consult your LED stripes or lighting controller documentation for the format details)."
