    title: Bezier Warp2
    caption: Bezier Warp2
    show: "Bezier Warp2. Use the adjacent instructions as the content brief: Typically, warping with the Bezier Warp starts from setting up the corner control points of the mesh according to the projection surface geometry, while the mesh density is set to the minimum. It’s followed by a gradual subdivision of the mesh grid while refining the curves of the mesh at each subdivision step until the desired image warping is achieved. Another approach to editing the Bezier Warp mesh is by selectin"
