    title: Bezier Warp Node Tree
    caption: Bezier Warp Node Tree
    show: "Bezier Warp Node Tree. Use the adjacent instructions as the content brief: The Bezier Warp node is a patch that allows image warping based on Bezier curves. It is mostly used for mapping a projection onto curved or partially curved surfaces and other regular or free-form objects. In a typical setup, the Bezier Warp node receives a source image as the input and outputs the modified image to the Display or Canvas node. Example of the node graph with the Bezier Warp node"
