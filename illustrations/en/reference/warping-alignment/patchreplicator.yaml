    show: "Patch Replicator Node Tree. Use the adjacent instructions as the content brief: The Patch Replicator is a patch that duplicates and distributes the instances of the target patch according to user-defined rules. Note: The Patch Replicator node can receive image input from the patch nodes only. Example of the node graph with the Patch Replicator node"
