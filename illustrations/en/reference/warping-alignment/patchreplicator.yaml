    title: Patch Replicator
    caption: Patch Replicator
    show: "Patch Replicator. Use the adjacent instructions as the content brief: Example of the node graph with the Patch Replicator node The Patch Replicator patch offers three replication types: Rectangular Array, Radial Array, and Mirror, which are selectable as a Mode parameter in the Settings panel. Each type is provided with its own set of settings."
