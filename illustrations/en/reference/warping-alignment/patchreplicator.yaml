  - id: en-a8b989c9e5-003
    title: Patch Replicator Rect
    caption: Patch Replicator Rect
    show: "Patch Replicator Rect. Use the adjacent instructions as the content brief: When the Rectangular Array type is chosen the following replication parameters become available in the Settings panel: X Count and Y Count values that determine the number of instances to be created along the X and Y axes.X Offset and Y Offset values that determine the offset between instances relative to the entire width and height of the output area."
    status: draft-needs-review
