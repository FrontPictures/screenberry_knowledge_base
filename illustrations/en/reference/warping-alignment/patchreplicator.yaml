  - id: en-a8b989c9e5-004
    title: Patch Replicator Radial
    caption: Patch Replicator Radial
    show: "Patch Replicator Radial. Use the adjacent instructions as the content brief: When the Radial Array type is chosen the following replication parameters become available in the Settings panel: A Count parameter value determines the number of instances to be created.An Angle parameter sets the angle of rotation.The Method options determine how the instances are distributed. If Between mode is selected, the angle between each of the created instances is equal to the value of the Angle parameter. "
