  - id: en-a8b989c9e5-005
    title: Patch Replicator Mirr
    caption: Patch Replicator Mirr
    show: "Patch Replicator Mirr. Use the adjacent instructions as the content brief: Using mirroring, you can create a mirror copy of the image along the X or Y axes. When the Mirror type is chosen, select the Horizontal or Vertical option for the Direction parameter to set the mirroring direction. In addition, working with the Patch Replicator patch follows the general principles for working with patches outlined in the Editing Patches section of the documentation."
