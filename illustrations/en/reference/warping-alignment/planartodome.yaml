    title: Planar To Dome Node Tree
    caption: Planar To Dome Node Tree
    show: "Planar To Dome Node Tree. Use the adjacent instructions as the content brief: The Planar to Dome node is a patch that allows the mapping of a planar image onto a dome surface. It is mostly used to achieve a picture-in-picture effect by combining planar and dome media content on a dome screen. In a typical setup, the Planar to Dome node receives a source image as the input and outputs the modified image to the Display or Context node. Example of the node graph with the Planar to Dome node"
