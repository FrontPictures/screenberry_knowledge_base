    show: "QuadWarp. Use the adjacent instructions as the content brief: The Quad Warp node is a patch primarily used for image geometry correction to compensate for the distortion caused by an off-axis image projection onto a planar surface (also known as keystone distortion). In a typical setup, the Quad Warp node receives a source image as the input and outputs the modified image to the Display or Canvas node. Example of the node graph with the QuadWarp node"
