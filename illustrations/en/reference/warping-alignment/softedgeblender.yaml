    title: SoftEdgeBlender
    caption: SoftEdgeBlender
    show: "SoftEdgeBlender. Use the adjacent instructions as the content brief: Build Blend Maps Pressing the Build Blend Maps button generates new blend maps. Disable Blending Resets the blend maps. Note: Regenerate blend maps by pressing the Build Blend Maps button every time the settings of the Soft Edge Blender node are changed or when the geometry is modified in patch nodes connected to the Soft Edge Blender node."
