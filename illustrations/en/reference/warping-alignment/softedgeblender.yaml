    title: Soft Edge Blender Node Tree
    caption: Soft Edge Blender Node Tree
    show: "Soft Edge Blender Node Tree. Use the adjacent instructions as the content brief: The Soft Edge Blender node offers control over soft-edge blending for combining two or more overlapping projected images into a single seamless image. The Soft Edge Blender node generates blending maps to allow seamless overlapping for the images modified by patches and should be connected to the Soft Edge Blender input parameter of these patch nodes. Example of the node graph with the Soft Edge Blender node"
