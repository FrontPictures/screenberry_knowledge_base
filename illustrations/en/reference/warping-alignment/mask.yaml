    title: Mask Node Tree
    caption: Mask Node Tree
    show: "Mask Node Tree. Use the adjacent instructions as the content brief: The Mask node is a patch generally used to create and customize free-form solid color shapes that can be applied as a mask over other images. In a typical setup, the Mask node receives a solid color image from the Solid Color node and outputs the resulting shape mask to the Display or Canvas node, where it overlays the image received from another image source node. Example of the node graph with the Mask node"
