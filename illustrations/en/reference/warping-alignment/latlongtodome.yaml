    show: "LatLong To Dome Node Tree. Use the adjacent instructions as the content brief: The LatLong to Dome node is a patch that allows the mapping of VR 360-degree media onto a virtual sphere and provides controls for displaying it on a dome surface. In a typical setup, the LatLong to Dome node receives a source image as the input and outputs the modified image to the Display or Canvas node. Example of the node graph with the LatLong to Dome node"
