    show: "Transform2D Transformations2. Use the adjacent instructions as the content brief: Scaling Speed Sets the speed of continuous scaling relative to Anchor Point. Rotation Speed Sets the speed of continuous rotation around Anchor Point. In addition, working with the Transform 2D patch follows the general principles for working with patches outlined in the Editing Patches section of the documentation."
