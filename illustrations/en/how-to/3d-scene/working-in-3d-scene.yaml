  - id: en-b88d8f005d-005
    title: Selecting Objects
    caption: Selecting Objects
    show: "Selecting Objects. Use the adjacent instructions as the content brief: Once activated, click on any object in the viewport to select it. Selected objects are highlighted, making them easily distinguishable. To select multiple objects, hold down the Shift key while clicking on each object. Another way to select an object is by clicking its name in the Object List pane. Alternatively, you can cycle through the objects in this list by holding Alt and pressing the Up and Down arrow keys."
    status: draft-needs-review
    basis: Existing alt text, heading and adjacent prose only; no visual inspection or new behavioral claim.
