  - id: en-b88d8f005d-007
    title: Rotating Objects
    caption: Rotating Objects
    show: "Rotating Objects. Use the adjacent instructions as the content brief: While an object is selected, dragging anywhere within the viewport rotates it on the plane parallel to the viewing plane. Additionally, you can rotate an object by changing the Rotation parameters' angles for X, Y, and Z coordinates in the object's Settings panel."
