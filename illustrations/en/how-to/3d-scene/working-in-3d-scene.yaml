    title: Scaling Objects
    caption: Scaling Objects
    show: "Scaling Objects. Use the adjacent instructions as the content brief: While an object is selected, dragging anywhere within the viewport changes its size while maintaining its proportions. Additionally, you can scale an object by changing the Scale parameters' values for X, Y, and Z coordinates in the object's Settings panel."
