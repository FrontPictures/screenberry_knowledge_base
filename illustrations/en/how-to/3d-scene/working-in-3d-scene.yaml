  - id: en-b88d8f005d-006
    title: Moving Objects
    caption: Moving Objects
    show: "Moving Objects. Use the adjacent instructions as the content brief: While an object is selected, dragging anywhere within the viewport moves it parallel to the viewing plane. Additionally, you can move an object by changing the Position parameters' X, Y, and Z coordinates in the object's Settings panel."
    status: draft-needs-review
    basis: Existing alt text, heading and adjacent prose only; no visual inspection or new behavioral claim.
