    title: Navigating Pan Mode
    caption: Navigating Pan Mode
    show: "Navigating Pan Mode. Use the adjacent instructions as the content brief: Pan Mode: To shift your viewpoint horizontally or vertically parallel to the viewing plane without changing the viewing angle, activate Pan mode by selecting the pan icon in the navigation toolbar, pressing Shift + P, or holding Shift (or the mouse wheel) while moving the mouse. Zoom Mode: To move closer to or further away from objects in the scene, activate Zoom mode by selecting the zoom icon in the navigation tool"
