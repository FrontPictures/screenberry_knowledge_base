  - id: en-b88d8f005d-001
    title: Navigating Fly Mode
    caption: Navigating Fly Mode
    show: "Navigating Fly Mode. Use the adjacent instructions as the content brief: The Navigation Toolbar provides the following options: Fly Mode: To navigate through the scene with a first-person perspective, activate Fly mode by selecting the fly icon in the navigation toolbar. Use the W, A, S, and D keys to move the camera forward, left, backward, and right, respectively. Q and E keys move the camera up and down. To adjust the camera's orientation, hold the left mouse button and move the mouse."
