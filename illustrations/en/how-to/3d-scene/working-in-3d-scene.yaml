  - id: en-b88d8f005d-004
    title: Navigating the Viewport
    caption: Navigating the Viewport
    show: "Navigating the Viewport. Use the adjacent instructions as the content brief: Zoom Mode: To move closer to or further away from objects in the scene, activate Zoom mode by selecting the zoom icon in the navigation toolbar, pressing Shift + Z, or holding Ctrl while moving the mouse. Holding Shift in any of these modes slows the movement speed to 1/10 of the default."
