    caption: Searching Media Items 1
    show: "Searching Media Items 1. Use the adjacent instructions as the content brief: To search for specific media items, type any part of the name in the Media Library search box. As a result, only the media items with names or user-defined labels matching the search criteria will be displayed in the contents area. If the Media folder is selected, the search will be performed in all folders."
