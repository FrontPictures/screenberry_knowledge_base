    caption: Selecting Node1
    show: "Selecting Node1. Use the adjacent instructions as the content brief: To select a node, left-click on it in the Node Graph. Multiple nodes can be selected by Shift-clicking on nodes in the Node Graph, or by left-clicking and dragging a marquee around them."
