  - id: en-e9f26c9166-012
    title: Grouping Nodes
    caption: Grouping Nodes
    show: "Grouping Nodes. Use the adjacent instructions as the content brief: To visually simplify and better organize the layout of a node tree, parts of it can be collapsed into groups. To do this, right-click on a group of selected nodes, choose Group Nodes from the dropdown menu (or press the G key), and enter a name for the created group in the opened dialog box. The selected nodes will be combined into a specialized Group node with input and output parameter pins that match the currently"
