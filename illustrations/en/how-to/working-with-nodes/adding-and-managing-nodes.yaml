  - id: en-e9f26c9166-013
    title: Groups
    caption: Groups
    show: "Groups. Use the adjacent instructions as the content brief: Switching between the contents of different Group nodes and the main node tree is accomplished by clicking on the buttons with the group names that are located on the navigation bar at the top of the Node Graph window (where Root indicates the main node tree). To ungroup nodes contained in a Group node, right-click on the Group node and select Ungroup from the dropdown menu (or press the U key)."
