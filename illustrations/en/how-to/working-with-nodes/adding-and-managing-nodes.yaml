    title: Adding Nodes
    caption: Adding Nodes
    show: "Adding Nodes. Use the adjacent instructions as the content brief: Begin typing the node name in the Search box at the top of the menu to see the list of nodes that match your search criteria, then select the desired node from the list, or press Enter to add the first node from the list.Select a node by browsing the Category or Tag submenus.Select a node from the Recently Added Nodes list. The selected node will be placed at the cursor location where the Add Node menu was activated."
