  - id: en-e9f26c9166-008
    title: Copy Paste Nodes
    caption: Copy Paste Nodes
    show: "Copy Paste Nodes. Use the adjacent instructions as the content brief: To copy and paste nodes in the Node Graph, select one or more nodes and do one of the following: Right-click on a node (or a selected group of nodes) and choose either Copy or Cut and then choose Paste from the dropdown menu.Use the following keyboard shortcuts: Ctrl + C to copy or Ctrl + X to cut, and Ctrl + V to paste. Note: The nodes from one Screenberry project can be copied and pasted into another."
    status: draft-needs-review
    basis: Existing alt text, heading and adjacent prose only; no visual inspection or new behavioral claim.
