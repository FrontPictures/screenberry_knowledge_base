  - id: en-e9f26c9166-003
    title: Node Classification
    caption: Node Classification
    show: "Node Classification. Use the adjacent instructions as the content brief: Node Classification All nodes are conveniently organized into categories and also labeled with one or more tags for easy identification and selection. The node selection can be carried out by either Category or Tag interchangeably. Note: Display and Patch type nodes are automatically added to the node graph when new displays or patches are created within the Display Editor or the Patch Editor."
    status: draft-needs-review
    basis: Existing alt text, heading and adjacent prose only; no visual inspection or new behavioral claim.
