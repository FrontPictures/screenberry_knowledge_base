  - id: en-e9f26c9166-002
    title: Adding Nodes Side Panel
    caption: Adding Nodes Side Panel
    show: "Adding Nodes Side Panel. Use the adjacent instructions as the content brief: Side Panel: Open the side panel in the Node Graph to access a list of nodes sorted by category. To add a node from this list, click and drag it into the node graph. This panel also contains a Search field that allows you to filter nodes. As you begin typing the node name, only the nodes that match your filter criteria will be left in the side panel. Node Classification"
