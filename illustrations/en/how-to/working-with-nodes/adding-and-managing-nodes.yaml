  - id: en-e9f26c9166-006
    title: Selecting Nodes Left To Right
    caption: Selecting Nodes Left To Right
    show: "Selecting Nodes Left To Right. Use the adjacent instructions as the content brief: If dragging is done from left to right, only the nodes inside the rectangular marquee will be selected. This function is useful when selecting the nodes that are part of a complex node tree. See Settings of Multiple Selected Nodes for information about selecting multiple nodes of the same type."
