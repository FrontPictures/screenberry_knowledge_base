    caption: Deleting Nodes
    show: "Deleting Nodes. Use the adjacent instructions as the content brief: To delete a node or a group of selected nodes, right-click on a node (or a group) and select Delete from the dropdown menu, or press the Del button. Deleting a node removes any links attached to it."
