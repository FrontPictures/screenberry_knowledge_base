  - id: en-e9f26c9166-005
    title: Selecting Nodes Right To Left
    caption: Selecting Nodes Right To Left
    show: "Selecting Nodes Right To Left. Use the adjacent instructions as the content brief: Multiple nodes can be selected by Shift-clicking on nodes in the Node Graph, or by left-clicking and dragging a marquee around them. If dragging is done from right to left, all the nodes touched by the rectangular marquee will be selected. If dragging is done from left to right, only the nodes inside the rectangular marquee will be selected. This function is useful when selecting the nodes that are part of a complex "
