  - id: en-bd92836216-006
    title: Reestablishing Links Automatically
    caption: Reestablishing Links Automatically
    show: "Reestablishing Links Automatically. Use the adjacent instructions as the content brief: Left-click an empty area of the Node Graph Editor to deselect all the nodes. Holding Ctrl, select the nodes you want to connect, one by one, in the order in which they should be executed. The appropriate links between the selected nodes will be created automatically and any existing links that conflict with the new ones will be removed."
    status: draft-needs-review
    basis: Existing alt text, heading and adjacent prose only; no visual inspection or new behavioral claim.
    placement:
      before_block: 15
      section: Reestablishing Links Between Nodes Automatically
    source_url: https://help.screenberry.com/images/working-with-nodes/animation/Reestablishing-Links-Automatically.gif
    source_alt: Reestablishing Links Automatically
    text_coverage: not-independently-verified
  - id: en-bd92836216-007
    title: Reordering Node Links
    caption: Reordering Node Links
    show: "Reordering Node Links. Use the adjacent instructions as the content brief: When several links are connected to the same input pin of a node, they are processed in the same order the links had been created. To change the processing order of inputs, right-click on the input parameter pin or name, and select Reorder Links for [Parameter Name]. Reorder the inputs in the opened dialog box by dragging the link names or selecting names and using the arrow buttons ."
    status: draft-needs-review
    basis: Existing alt text, heading and adjacent prose only; no visual inspection or new behavioral claim.
    placement:
