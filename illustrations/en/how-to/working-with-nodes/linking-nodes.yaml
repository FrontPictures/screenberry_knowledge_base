    title: Links Nodes Automatically
    caption: Links Nodes Automatically
    show: "Links Nodes Automatically. Use the adjacent instructions as the content brief: To create a link between nodes automatically, select one or more nodes and, while holding Ctrl, left-click on the target node — the system identifies parameters of the same type to establish the links. This is the fastest method of connecting nodes."
    status: draft-needs-review
    basis: Existing alt text, heading and adjacent prose only; no visual inspection or new behavioral claim.
