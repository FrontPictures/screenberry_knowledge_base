  - id: en-bd92836216-002
    title: Links Nodes With Ctrl
    caption: Links Nodes With Ctrl
    show: "Links Nodes With Ctrl. Use the adjacent instructions as the content brief: Note: The link is possible only between pins of the same type. Note: More than one pin may be available for a given link. Drag the link along the side of the target node to view all valid connections. Note: When creating several links to a single pin, depending on the type of parameter, a new link will either replace an existing link or be added to an existing one."
    status: draft-needs-review
    basis: Existing alt text, heading and adjacent prose only; no visual inspection or new behavioral claim.
