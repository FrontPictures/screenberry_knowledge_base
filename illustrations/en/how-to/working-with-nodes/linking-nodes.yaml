    title: Rearranging Links Between Nodes
    caption: Rearranging Links Between Nodes
    show: "Rearranging Links Between Nodes. Use the adjacent instructions as the content brief: To move a link (or group of links) from one pin to another, Shift-click on the pin and drag the link(s) to a new pin or node."
