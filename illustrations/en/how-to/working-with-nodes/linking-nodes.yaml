  - id: en-bd92836216-003
    title: Removing Node Links1
    caption: Removing Node Links1
    show: "Removing Node Links1. Use the adjacent instructions as the content brief: Right-clicking on the link or node pin (or its parameter name) and selecting Unlink [Parameter Name] will remove the link. Alternatively, Shift-clicking on the pin and dragging the link to an empty area of the Node Graph will also remove the link."
