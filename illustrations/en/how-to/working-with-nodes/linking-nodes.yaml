      section: Reordering Node Links
    source_url: https://help.screenberry.com/images/working-with-nodes/animation/Reordering-Node-Links.gif
    source_alt: Reordering Node Links
    text_coverage: not-independently-verified
  - id: en-bd92836216-008
    title: Route Pin
    caption: Route Pin
    show: "Route Pin. Use the adjacent instructions as the content brief: To add a Reroute Pin, right-click on the link between nodes and select Reroute Pin from the dropdown menu. To delete a Reroute Pin, right-click on it and select Delete from the dropdown menu (or press the Del key)."
