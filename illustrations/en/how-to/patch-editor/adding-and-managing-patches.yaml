    title: Deleting Patches
    caption: Deleting Patches
    show: "Deleting Patches. Use the adjacent instructions as the content brief: Right-click on any of the patch control points in the Input or Output panels and select Delete Patches from the dropdown menu.Click the patch in the navigation tree and choose Delete Patch from the dropdown menu. Alternatively, you can delete the related patch node in the Node Graph."
