    caption: Node Tree Example
    show: "Node Tree Example. Use the adjacent instructions as the content brief: Patch nodes are added in the Node Graph (see Adding Nodes). In a typical setup, an input of the patch node is connected to the source image node and its output to the Display or Canvas node. The Bezier Warp receives input from the Media Player and sends output to the Canvas"
