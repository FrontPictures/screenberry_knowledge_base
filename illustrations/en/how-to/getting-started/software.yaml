    title: Windows Security Alert for Screenberry Server network access
    caption: Windows Security Alert for Screenberry Server network access
    show: "Windows Security Alert for Screenberry Server network access. Use the adjacent instructions as the content brief: The first time Screenberry Server starts after installation, Windows Security Alert may ask whether to allow network communication through Windows Firewall. Allow Screenberry Server on the trusted network used by the Media Server and Operator Workstation. Do not enable access for an untrusted public network unless it is intentionally part of the Screenberry system and has been reviewed by the system administrator."
