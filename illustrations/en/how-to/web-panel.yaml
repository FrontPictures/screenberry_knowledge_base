    title: Playlist Selection
    caption: Playlist Selection
    show: "Playlist Selection. Use the adjacent instructions as the content brief: To access the desired playlist, do the following: Click on the Screenberry Web Panel menu button located at the top left corner and select Media Player.Click on the Settings button located at the bottom right corner to open the right sidebar.Select the Media Player in the dropdown menu.Select the playlist in the dropdown menu."
