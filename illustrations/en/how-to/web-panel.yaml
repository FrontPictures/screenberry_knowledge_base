  - id: en-7b16510cba-003
    title: Web Panel Controls280
    caption: Web Panel Controls280
    show: "Web Panel Controls280. Use the adjacent instructions as the content brief: Play Selected Item starts playback of a selected media item. Play starts playback from the current playhead position. Pause freezes playback at the current playhead position. Stop ends playback. Previous Item jumps to the previous media item in the playlist. Next Item jumps to the next media item in the playlist. Volume Control adjusts the overall audio volume for the Media Player output."
    status: draft-needs-review
    basis: Existing alt text, heading and adjacent prose only; no visual inspection or new behavioral claim.
