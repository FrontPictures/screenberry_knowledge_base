  - id: en-1bcf017428-011
    title: Copying And Pasting Displays
    caption: Copying And Pasting Displays
    show: "Copying And Pasting Displays. Use the adjacent instructions as the content brief: To copy and paste displays in the Display Editor, select one or more displays and do one of the following: Right-click on a display (or a group of selected displays) and choose either Copy or Cut and then Paste from the dropdown menu.Use the following keyboard shortcuts: Ctrl + C to copy or Ctrl + X to cut and Ctrl + V to paste."
    status: draft-needs-review
