    caption: Selecting Displays 2
    show: "Selecting Displays 2. Use the adjacent instructions as the content brief: Multiple displays can be selected by Shift-clicking on displays in the Display Editor, or display names in the navigation tree. Multiple displays can also be selected at once by left-clicking an empty area in the Display Editor and dragging the mouse to create a marquee."
