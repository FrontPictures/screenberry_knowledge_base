  - id: en-1bcf017428-002
    title: Accessing Display Editor
    caption: Accessing Display Editor
    show: "Accessing Display Editor. Use the adjacent instructions as the content brief: The Media Player node (1) sends an image to the Display node (2) that has a resolution of 1240 x 768 pixels and is positioned at (0,0) coordinates of Canvas node (3), which defines the server output area with a resolution of 1960 x 1280 pixels. To access the Display Editor, add the Canvas (or Render Target) widget to your workspace, then click the Displays tab on the top left of the widget to switch to the Displays v"
    status: draft-needs-review
    basis: Existing alt text, heading and adjacent prose only; no visual inspection or new behavioral claim.
