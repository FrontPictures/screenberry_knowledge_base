    title: Selecting Displays 1
    caption: Selecting Displays 1
    show: "Selecting Displays 1. Use the adjacent instructions as the content brief: To select a display, left-click the display in the Display Editor, or the display name in the navigation tree. Multiple displays can be selected by Shift-clicking on displays in the Display Editor, or display names in the navigation tree."
