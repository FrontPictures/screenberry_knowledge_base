    caption: Renaming A Display
    show: "Renaming A Display. Use the adjacent instructions as the content brief: To rename a display, do one of the following: Right-click on the display, select Rename from the dropdown menu, enter a new display name in the opened dialog box, and press OK.Select display and change the display name in the header of the display’s Settings panel."
