  - id: en-1bcf017428-008
    title: Selecting Displays 3
    caption: Selecting Displays 3
    show: "Selecting Displays 3. Use the adjacent instructions as the content brief: Multiple displays can also be selected at once by left-clicking an empty area in the Display Editor and dragging the mouse to create a marquee. If dragging is done from right to left, all the displays touched by the rectangular marquee will be selected. If dragging is done from left to right only the displays inside the rectangular marquee will be selected."
