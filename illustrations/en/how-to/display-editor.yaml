  - id: en-1bcf017428-003
    title: Adding A Display
    caption: Adding A Display
    show: "Adding A Display. Use the adjacent instructions as the content brief: By default, the added display will have the same dimensions as the Canvas. The corresponding Display node will be created in the Node Graph and linked to the related Canvas (or RenderTarget) node automatically. Reversely, a new display can be added by adding a new Display node in the Node Graph and linking it to the Canvas (or RenderTarget) node of the relevant canvas."
    status: draft-needs-review
    basis: Existing alt text, heading and adjacent prose only; no visual inspection or new behavioral claim.
    placement:
      before_block: 12
      section: Adding Displays
