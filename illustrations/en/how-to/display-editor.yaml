  - id: en-1bcf017428-015
    title: Changing Stack Order Of Displays
    caption: Changing Stack Order Of Displays
    show: "Changing Stack Order Of Displays. Use the adjacent instructions as the content brief: Alternatively, the stack order of displays can be modified by reordering the links connecting Display nodes to the Canvas node in the Node Graph (see Reordering Node Links). The displays are stacked top-down in relation to the order in which Display nodes are linked to the Canvas node, which means that the display with the succeeding node link will overlay the one with the preceding link."
    status: draft-needs-review
    basis: Existing alt text, heading and adjacent prose only; no visual inspection or new behavioral claim.
