    title: Display Position And Dimensions
    caption: Display Position And Dimensions
    show: "Display Position And Dimensions. Use the adjacent instructions as the content brief: Another way to change the position of a display is to select a display in the Display Editor or the display name in the navigation tree and modify the X and Y values for the Position parameter in the Settings panel. You can also adjust the display dimensions in the Settings panel by changing the W and H values for the Size parameter."
    status: draft-needs-review
