    title: Animation And Keyframing
    caption: Animation And Keyframing
    show: "Animation And Keyframing. Use the adjacent instructions as the content brief: Select the media item on the timeline track containing the parameter you want to animate.Move the playhead to the point in time where you wish to add a keyframe.In the Settings panel, specify the parameter you want to animate by clicking on the rhombus icon next to its name.Enter the desired value(s) into the parameter value field(s). When you set keyframes for a media item on the timeline, a rhombus icon will appear"
