  - id: en-6d81ba6e63-002
    title: Animation And Keyframing 2
    caption: Animation And Keyframing 2
    show: "Animation And Keyframing 2. Use the adjacent instructions as the content brief: If the keyframes are positioned beyond the duration of the media item, the marks on the corresponding side of the parameter bar will indicate their existence and location. You can also set keyframes in real-time while the playhead is in motion during playback. In this case, whenever a value of the selected parameter is altered, a keyframe is automatically created at the current position of the playhead."
