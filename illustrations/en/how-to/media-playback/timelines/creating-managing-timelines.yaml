  - id: en-db499388d8-005
    title: Arranging Timelines
    caption: Arranging Timelines
    show: "Arranging Timelines. Use the adjacent instructions as the content brief: You can navigate the Playlist and Timeline List using the Up and Down arrow keys or by selecting timelines directly with a mouse click. To expand or collapse the contents of a folder, click on the arrow icon located next to the folder name. To change the order of playlists, timelines, or folders, either right-click on one of their names and select Move Up (Ctrl + Up) or Move Down (Ctrl + Down) from the dropdown menu,"
