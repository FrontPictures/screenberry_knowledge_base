    title: Adding Timelines
    caption: Adding Timelines
    show: "Adding Timelines. Use the adjacent instructions as the content brief: To create a new timeline, you can either right-click an empty area of the Playlist and Timeline List panel or click the Add button in the bottom toolbar, then select Add Timeline from the dropdown menu. You can create a timeline within an existing folder by either right-clicking the folder or selecting it and clicking the Add button in the bottom toolbar, then choosing Add Timeline from the dropdown menu."
