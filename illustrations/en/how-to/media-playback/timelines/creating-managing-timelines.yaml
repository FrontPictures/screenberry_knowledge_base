    title: Indication Timelines Playback
    caption: Indication Timelines Playback
    show: "Indication Timelines Playback. Use the adjacent instructions as the content brief: Locking. To prevent unintentional changes from being made to a timeline, it can be locked. When locked, a timeline cannot be modified further, whereas an unlocked timeline can be edited.Sending the Timecode. Enabling or disabling this toggle controls whether the timeline sends out a timecode or not.Event Mapping. Media items within a timeline can be mapped to different events, such as MIDI/Keyboard events, to trigger"
