  - id: en-db499388d8-003
    title: Renaming Timelines
    caption: Renaming Timelines
    show: "Renaming Timelines. Use the adjacent instructions as the content brief: When you create timelines, it’s beneficial to name them descriptively so that they can be easily identified. To rename a timeline, right-click on its name, choose Rename from the dropdown menu, and enter a new name in the opened dialog box."
