  - id: en-783b8e9f86-002
    title: Adding And Managing Markers 2 1
    caption: Adding And Managing Markers 2 1
    show: "Adding And Managing Markers 2 1. Use the adjacent instructions as the content brief: To rename a marker, right-click on it and select Edit from the dropdown menu. In the dialog window that appears, enter the desired value in the Name field. To move a marker, drag it on the time ruler or, for more precise positioning, right-click on the marker and select Edit from the dropdown menu. In the dialog window that appears, enter the desired value in the Position field."
