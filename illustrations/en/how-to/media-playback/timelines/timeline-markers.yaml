    title: Adding And Managing Markers 1
    caption: Adding And Managing Markers 1
    show: "Adding And Managing Markers 1. Use the adjacent instructions as the content brief: To add a marker, do one of the following: Right-click on the time ruler, and select the desired type of marker from the dropdown menu.Place the playhead at the desired position, then click on the respective marker icon located on the top toolbar. To rename a marker, right-click on it and select Edit from the dropdown menu. In the dialog window that appears, enter the desired value in the Name field."
