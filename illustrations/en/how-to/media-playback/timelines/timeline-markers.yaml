  - id: en-783b8e9f86-003
    title: Adding And Managing Markers 3 1
    caption: Adding And Managing Markers 3 1
    show: "Adding And Managing Markers 3 1. Use the adjacent instructions as the content brief: To move a marker, drag it on the time ruler or, for more precise positioning, right-click on the marker and select Edit from the dropdown menu. In the dialog window that appears, enter the desired value in the Position field. Markers can be enabled or disabled. To disable a marker, right-click on the marker and deselect the Enabled checkbox in the dropdown menu."
