    caption: Playback Of Individual Media Items Matrix
    show: "Playback Of Individual Media Items Matrix. Use the adjacent instructions as the content brief: To pause the playback, click the Pause button . This action will freeze the playback at the last played frames of the media items currently in play, and these frames will continue to be output. To halt the playback completely, click the Stop button ."
