  - id: en-efbcb907ff-006
    title: Indication Playback
    caption: Indication Playback
    show: "Indication Playback. Use the adjacent instructions as the content brief: When a matrix-based playlist is being played, paused, or stopped, the corresponding indicators adjacent to the playlist's name in the Navigation Pane reveal its current state. If the currently active playlist is located within a collapsed folder, these state indicators will replace the folder icon."
