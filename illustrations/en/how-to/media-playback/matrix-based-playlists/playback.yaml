  - id: en-efbcb907ff-007
    title: Playback Prioritization Matrix
    caption: Playback Prioritization Matrix
    show: "Playback Prioritization Matrix. Use the adjacent instructions as the content brief: In a matrix-based playlist, every new user interaction related to playback supersedes the previous one. For instance, when column playback is initiated and a single row is subsequently paused, this more recent interaction prevails, pausing the playback exclusively for that row."
