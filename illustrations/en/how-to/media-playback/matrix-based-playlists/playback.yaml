  - id: en-efbcb907ff-002
    title: Row-Specific Playback
    caption: Row-Specific Playback
    show: "Row-Specific Playback. Use the adjacent instructions as the content brief: The Play Previous and Play Next buttons in the row header allow users to navigate sequentially through the media items within a specific row of a matrix-based playlist: Play Previous: Reverts playback to the previous media item in the sequence.Play Next: Advances playback to the next media item in the sequence."
