    title: Reveal Active Item Matrix
    caption: Reveal Active Item Matrix
    show: "Reveal Active Item Matrix. Use the adjacent instructions as the content brief: Reveal Active Item button : Allows you to quickly locate a currently playing media item. Clicking this button shifts the view to the active playlist, automatically scrolls to the currently playing media items, and highlights them."
