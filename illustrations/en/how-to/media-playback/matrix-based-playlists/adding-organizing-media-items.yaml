  - id: en-937cf12dfa-006
    title: Adding Data Items Matrix
    caption: Adding Data Items Matrix
    show: "Adding Data Items Matrix. Use the adjacent instructions as the content brief: To add a data item to the matrix grid, follow these steps: Right-click on the grid cell where you want to place the data item.Choose Add Data Item from the dropdown menu.In the window that appears, enter the Node Path and Parameter Name of the parameter you intend to modify.In the settings of the data item, define the value that the parameter will adopt during the playback of this data item in the playlist."
