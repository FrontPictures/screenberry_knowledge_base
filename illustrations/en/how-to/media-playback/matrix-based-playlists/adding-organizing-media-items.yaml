    title: Adding AUX Items Matrix 2
    caption: Adding AUX Items Matrix 2
    show: "Adding AUX Items Matrix 2. Use the adjacent instructions as the content brief: AUX items within the matrix can be customized using the settings panel which appears when the item is selected. One setting you might want to adjust right away is the Duration parameter, which determines the playback length of the inserted image within the playlist."
