    title: Selecting Media Items Matrix
    caption: Selecting Media Items Matrix
    show: "Selecting Media Items Matrix. Use the adjacent instructions as the content brief: Items in the matrix grid can be selected using any of the following methods: Click on a media item to select it.Hold Ctrl and click on multiple items for multiple selections.Select one item, hold Shift, and click on another to select all items within the rectangular grid area between these items.Click a column header to select every item in that column.Click a row header to select every item in that row."
