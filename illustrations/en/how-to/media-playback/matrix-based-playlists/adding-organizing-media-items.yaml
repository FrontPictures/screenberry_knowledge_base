  - id: en-937cf12dfa-004
    title: Adding AUX Items Matrix
    caption: Adding AUX Items Matrix
    show: "Adding AUX Items Matrix. Use the adjacent instructions as the content brief: If you require the Media Player to receive multiple image inputs, specify the required count in the Number of AUX Inputs parameter in the Media Player node’s settings. After setting up the Media Player node to receive these images, navigate back to your matrix-based playlist. Right-click in the grid cell where you wish to add the AUX item and choose Add AUX from the dropdown menu. This will open the Select AUX dialog"
