  - id: en-937cf12dfa-007
    title: Renaming Media Items Matrix
    caption: Renaming Media Items Matrix
    show: "Renaming Media Items Matrix. Use the adjacent instructions as the content brief: To rename a media item within a playlist, you have the following options: Right-click on the media item and select Rename from the dropdown menu (or use the F2 shortcut), then type a new name in the Title field of the opened Set Item Title window.Alternatively, select the media item to open its settings, and enter a new title in the Title field."
