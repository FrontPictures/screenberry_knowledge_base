    title: Adding Rows And Columns
    caption: Adding Rows And Columns
    show: "Adding Rows And Columns. Use the adjacent instructions as the content brief: In the event your matrix layout requires more rows and columns than what’s currently available, you can expand the grid by scrolling to its current edge. As you reach its visible limits, additional rows or columns are appended automatically. Please note that any rows and columns not populated with media items will automatically retract upon scrolling back, preserving an orderly and manageable grid."
