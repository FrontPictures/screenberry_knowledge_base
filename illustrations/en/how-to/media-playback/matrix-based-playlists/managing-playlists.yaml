    title: Arranging Playlists
    caption: Arranging Playlists
    show: "Arranging Playlists. Use the adjacent instructions as the content brief: In the Navigation Pane, click to select and use the Up and Down arrow keys to move through the list of playlists, timelines, and folders. Expand or collapse folders by clicking the arrow icon next to the folder name. To reorder playlists or timelines within the Navigation Pane, right-click the name of the playlist or timeline you want to move and select Move Up (Ctrl + Up) or Move Down (Ctrl + Down) from the dropdown"
