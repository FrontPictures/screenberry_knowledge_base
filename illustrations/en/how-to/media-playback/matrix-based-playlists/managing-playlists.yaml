    title: Creating Playlists Matrix
    caption: Creating Playlists Matrix
    show: "Creating Playlists Matrix. Use the adjacent instructions as the content brief: For creating a playlist within an existing folder, right-click the folder or select and click Add, then select Add Matrix Playlist. To toggle the visibility of a folder’s contents, click the arrow icon next to that folder. Matrix-based playlists when created are named sequentially as Matrix1, Matrix2, and so on."
