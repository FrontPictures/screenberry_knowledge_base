    caption: Arranging Media Items
    show: "Arranging Media Items. Use the adjacent instructions as the content brief: Media items can be organized by dragging and dropping them or by using the Copy (Ctrl + C), Cut (Ctrl + X), and Paste (Ctrl + V) commands Within a single playlist to change the order of the media items playback.Between different playlists of the same Media Player widget.Between playlists of different Media Player widgets. When media items are copied or moved between playlists, they retain their playback settings."
