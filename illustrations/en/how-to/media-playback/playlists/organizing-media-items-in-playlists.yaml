  - id: en-a4eea233e3-004
    title: Renaming Media Items
    caption: Renaming Media Items
    show: "Renaming Media Items. Use the adjacent instructions as the content brief: There are two ways to rename a media item. Renaming a media item in the Media Library will change its name globally, i.e. in all existing playlists. A media item’s name in a particular playlist can also be changed by assigning it a title – right-click on the media item, select Settings from the dropdown menu, and enter a new name in the Title field. Note: Media items cannot be renamed if they are currently playing in"
