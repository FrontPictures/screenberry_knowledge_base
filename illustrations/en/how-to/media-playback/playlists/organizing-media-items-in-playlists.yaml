  - id: en-a4eea233e3-005
    title: Deleting Media Items
    caption: Deleting Media Items
    show: "Deleting Media Items. Use the adjacent instructions as the content brief: To delete a media item or a selection of media items from a playlist, right-click them and choose Delete from the dropdown menu, or press the Del button. You can also delete media items globally in all existing playlists by removing them from the Media Library – right-click a media item or a selection of media items in a playlist and select Remove Item from Media Library from the dropdown menu, or press Shift + Del."
