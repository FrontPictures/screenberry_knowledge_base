    title: Loop Group
    caption: Loop Group
    show: "Loop Group. Use the adjacent instructions as the content brief: To play a group of media items in the loop, right-click a selection of media items in the playlist and select Loop Through Selected Items from the dropdown menu, or press Shift + L. When a loop group is created, special Loop Start and Loop End items are added to the playlist before and after the media items in the group to indicate the beginning and end of the loop. It is possible to move these items in the playlist "
