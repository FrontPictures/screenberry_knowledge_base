    title: Mediaplayercontrols280 1
    caption: Mediaplayercontrols280 1
    show: "Mediaplayercontrols280 1. Use the adjacent instructions as the content brief: Note: Playback controls displayed along the bottom of the Media Player widget are associated with the currently active media item. At the same time, while the active playlist is playing, other playlists can be opened and edited. If you need to switch to the active playlist, right-click on the playlists tree or playlist area and select Reveal Active Item, or press the A key. The Seek Bar displays the playback progress"
