  - id: en-d13bbbb15a-005
    title: Arranging Playlists
    caption: Arranging Playlists
    show: "Arranging Playlists. Use the adjacent instructions as the content brief: To navigate the playlists and timelines list, use the Up and Down arrow keys. To expand or collapse the contents of a folder, click on the arrow icon next to the folder icon. To change the order of playlists, timelines, and folders, either right-click on the name and select Move Up (Ctrl + Up) or Move Down (Ctrl + Down) from the dropdown menu, or drag and drop them into the list. A playlist can be moved into a folder"
