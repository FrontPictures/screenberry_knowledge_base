    title: Indication Playback
    caption: Indication Playback
    show: "Indication Playback. Use the adjacent instructions as the content brief: When a playlist is currently being played, paused, or stopped, the corresponding indicators appear next to the playlist name. Whenever the currently active playlist is part of a folder, and the contents of the folder have been collapsed, these indicators replace the folder icon."
