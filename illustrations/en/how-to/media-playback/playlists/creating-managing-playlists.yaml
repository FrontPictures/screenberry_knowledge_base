    title: Renaming Playlists
    caption: Renaming Playlists
    show: "Renaming Playlists. Use the adjacent instructions as the content brief: When you create playlists, it’s helpful to name them descriptively so they can be identified easily. To rename it, right-click on a playlist, select Rename from the dropdown menu, and enter a new name in the opened dialog box."
