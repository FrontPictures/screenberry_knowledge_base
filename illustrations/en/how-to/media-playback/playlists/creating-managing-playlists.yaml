    title: Adding Playlists
    caption: Adding Playlists
    show: "Adding Playlists. Use the adjacent instructions as the content brief: To create a new playlist, either right-click an empty area of the Navigation Pane or click the Add button on the bottom toolbar and select Add Playlist from the dropdown menu. To add a new playlist to an existing folder, select the folder and click the Add button on the bottom toolbar, or right-click the folder name and select Add Playlist from the dropdown menu."
