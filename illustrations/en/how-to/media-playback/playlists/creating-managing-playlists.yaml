  - id: en-d13bbbb15a-006
    title: Indication Playlists
    caption: Indication Playlists
    show: "Indication Playlists. Use the adjacent instructions as the content brief: Locking and Unlocking a playlist to prevent accidental modifications. A locked playlist cannot be further modified, while an unlocked one can be edited.Playback Control with Presentation Clicker. The playback of playlists may be controlled by a presentation clicker. This toggle enables and disables this function. For more information, see Playlist Playback Control with Presentation Clicker.MIDI/Keyboard Events Mappin"
