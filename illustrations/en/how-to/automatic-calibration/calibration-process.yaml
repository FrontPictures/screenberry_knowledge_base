    title: Calibration Area Selection
    caption: Calibration Area Selection
    show: "Calibration Area Selection. Use the adjacent instructions as the content brief: The objects outside the projection area (light sources, trusses, etc) can reflect or emit light and, thus affect the calibration results — distorting calibration geometry or influencing black level compensation and brightness balance. Therefore, it is important to precisely define the projection area — anything inside the specified area is calibrated while everything outside is ignored. Open the Calibration Area drop"
