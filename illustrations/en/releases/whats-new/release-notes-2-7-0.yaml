    caption: Search
    show: "Search. Use the adjacent instructions as the content brief: Improved search in the Add Node dialog The search engine in the Add Node dialog has been improved. Now, when a user enters a string in the search box, a list of suggestions is generated based on the intelligent sorting algorithm that contains matches by the node name and/or node tag. Parameter types renamed"
