    caption: Scene
    show: "Scene. Use the adjacent instructions as the content brief: 3D nodes list and Settings have been integrated into the Scene Editor widget The list of 3D nodes and the Settings panel are now integrated into the Scene Editor widget allowing easy access and editing of all the elements comprising the 3D scene in one place. Channel/background selection for video output in the VideoPreview and SceneEditor widgets"
