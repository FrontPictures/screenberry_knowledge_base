    title: Patchesdisplays
    caption: Patchesdisplays
    show: "Patchesdisplays. Use the adjacent instructions as the content brief: The Display and Patch Editors have merged together The Display Editor and the Patch Editor have been merged into a single widget, allowing users the convenience of editing both displays and patches in one place. Now, a dedicated (stand-alone) editor is available for any created instance of the RenderTarget in addition to the Canvas."
