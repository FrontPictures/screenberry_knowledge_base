    title: Panels
    caption: Panels
    show: "Panels. Use the adjacent instructions as the content brief: Project workflow and workspace organization reimagined Screenberry’s conceptual approach to workflow has been changed to provide a better user experience. Now, you can fully customize your workflow by arranging workspaces and widgets into a layout that best suits your current tasks and work style. The improvements include:"
