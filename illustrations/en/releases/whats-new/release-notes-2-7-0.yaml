    title: Graphit2
    caption: Graphit2
    show: "Graphit2. Use the adjacent instructions as the content brief: New look and feel The look and feel of the Screenberry Panel graphical user interface has been redesigned and a new Dark Graphite theme has been implemented. These design changes, combined with numerous UX improvements, have simplified the user interface and increased its contrast, clarity, and legibility, allowing users to focus more on their tasks."
