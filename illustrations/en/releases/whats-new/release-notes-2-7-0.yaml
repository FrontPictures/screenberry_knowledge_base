    title: Displays
    caption: Displays
    show: "Displays. Use the adjacent instructions as the content brief: Editing displays has become easier Now, users can drag displays to change their position, duplicate displays by copy-pasting, and arrange their stack order directly in the visual part of the editor. 3D nodes list and Settings have been integrated into the Scene Editor widget"
