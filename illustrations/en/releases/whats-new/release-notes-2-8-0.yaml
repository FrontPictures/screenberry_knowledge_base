  - id: en-04c312e0bc-002
    title: Touch Video
    caption: Touch Video
    show: "Touch Video. Use the adjacent instructions as the content brief: Video streams obtained from TouchEngine can be displayed as a texture, or as a composition layer. Incoming data streams can be used to provide Screenberry with information like tracking coordinates, object properties, DMX values, touch events, or any other real-time data. It is also easy to send a video stream or numeric values from Screenberry nodes to TouchEngine for processing and receive the resulting output back"
