  - id: en-04c312e0bc-003
    title: Virtual Production Studio 1
    caption: Virtual Production Studio 1
    show: "Virtual Production Studio 1. Use the adjacent instructions as the content brief: Support has been added for the Mo-Sys (F4 protocol) precision camera tracking that has become an industry standard for use with XR stages, LED volumes, and green/blue screens in virtual production and content creation for live broadcasts, film, and game cinematics. The new Mo-Sys F4 node, which allows you, for example, to synchronize camera movement in the Screenberry 3D Scene using Mo-Sys camera tracking data."
    status: draft-needs-review
    basis: Existing alt text, heading and adjacent prose only; no visual inspection or new behavioral claim.
