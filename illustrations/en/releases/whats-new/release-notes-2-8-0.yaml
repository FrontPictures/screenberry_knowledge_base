  - id: en-04c312e0bc-004
    title: Web Panel
    caption: Web Panel
    show: "Web Panel. Use the adjacent instructions as the content brief: The web-based control panel has been developed to control Screenberry playlist playback and work of user-defined widgets remotely, from any computer, tablet or smartphone. A custom platform-independent web interface with HTML 5 support makes it possible for multiple users to operate the server via the web browser."
