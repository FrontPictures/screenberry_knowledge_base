  - id: en-04c312e0bc-006
    title: Media Player Redesign
    caption: Media Player Redesign
    show: "Media Player Redesign. Use the adjacent instructions as the content brief: The Media Player widget has been completely redesigned to provide users with better playback control through a more convenient interface, and allow the easier organization of workflow. The option to lock transport controls has been added to the Media Player widget to prevent users from performing accidental actions."
