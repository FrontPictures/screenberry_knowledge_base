    title: Media Library Controls
    caption: Media Library Controls
    show: "Media Library Controls. Use the adjacent instructions as the content brief: The Media folder is the default root folder and cannot be deleted. All new folders are created within the Media folder. The Interrupt button stops the uploading/converting process.The Uploading progress bar displays the percentage of media items uploaded to the server and the number of files already uploaded / total number of files being uploaded.The Converting progress bar displays the conversion percentage for each"
