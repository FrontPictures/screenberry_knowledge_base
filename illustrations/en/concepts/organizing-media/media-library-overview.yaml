    caption: Media Library View
    show: "Media Library View. Use the adjacent instructions as the content brief: The Media Library widget allows users to upload, view, and manage the media content stored on the server. It can be added by selecting Window > Media Library from the main menu. The Media Library view: 1 – the folders tree, 2 – the content area, 3 – Media Library information and controls bar."
