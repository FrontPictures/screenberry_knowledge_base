    caption: Adding Widget
    show: "Adding Widget. Use the adjacent instructions as the content brief: * The term “image” refers to any static or dynamic media (i.e. video). ** To access the Patch Editor, add the Canvas (or Render Target) widget to your workspace, then click the Patches tab on the top left of the widget to switch to the Patches view."
