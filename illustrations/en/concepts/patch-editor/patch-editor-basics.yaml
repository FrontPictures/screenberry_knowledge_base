    title: Zoom And Pan
    caption: Zoom And Pan
    show: "Zoom And Pan. Use the adjacent instructions as the content brief: Тo zoom in and out of a specific area in the Input or Output panels of the Patch Editor, place the mouse cursor over the area, and use the mouse scroll wheel. Alternatively, click the button in the top right corner of the panel and move the mouse to change the magnification. To pan a view, drag with the middle or right mouse button held down, or click the button in the top right corner of the panel and move the mouse"
