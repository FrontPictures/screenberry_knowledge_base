  - id: ja-f240bc49a0-003
    title: Patch Replicator Rect
    caption: Patch Replicator Rect
    show: "Patch Replicator Rect. Use the adjacent instructions as the content brief: SettingsパネルのModeにRectangular Arrayを選択すると、次の複製パラメータが利用可能になります： X Count および Y Count には、X軸およびY軸に沿って作成するインスタンスの数を設定します。X Offset および Y Offset には、出力領域全体に対するインスタンス間のオフセットを設定します。"
    status: draft-needs-review
    basis: Existing alt text, heading and adjacent prose only; no visual inspection or new behavioral claim.
