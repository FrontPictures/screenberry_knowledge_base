  - id: ja-f240bc49a0-002
    title: Patch Replicator
    caption: Patch Replicator
    show: "Patch Replicator. Use the adjacent instructions as the content brief: Patch Replicator ノードを使用したノードグラフの例 Patch Replicator ノードには、長方形配置（Rectangular Array）、放射状配置（Radial Array）、および 鏡像配置（Mirror） の3つの複製タイプがあります。これらはSettingsパネルの Mode から選択できます。各タイプにはそれぞれ固有の設定が用意されています。"
    status: draft-needs-review
    basis: Existing alt text, heading and adjacent prose only; no visual inspection or new behavioral claim.
