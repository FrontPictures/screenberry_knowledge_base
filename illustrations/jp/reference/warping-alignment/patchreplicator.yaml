  - id: ja-f240bc49a0-005
    title: Patch Replicator Mirr
    caption: Patch Replicator Mirr
    show: "Patch Replicator Mirr. Use the adjacent instructions as the content brief: この複製を使用すると、映像のX軸またはY軸に沿った鏡像のインスタンスを作成することができます。 Settingsパネルの Mode に Mirror を選択し、Direction に Horizontal または Vertical を選択して、鏡像のできる方向を設定します。 Patch Replicator ノードを使用する場合は、Patchの共通操作についてPatchの編集の章も参照してください。"
    status: draft-needs-review
