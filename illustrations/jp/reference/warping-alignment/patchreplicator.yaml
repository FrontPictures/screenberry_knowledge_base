  - id: ja-f240bc49a0-004
    title: Patch Replicator Radial
    caption: Patch Replicator Radial
    show: "Patch Replicator Radial. Use the adjacent instructions as the content brief: Settingsパネルの Mode に Radial Array を選択すると、次の複製パラメータが利用可能になります： Count には、作成するインスタンスの数を設定します。Angle には、は回転角度を設定します。Method には、インスタンスの分布方法を決定します。Between が選択された場合、作成される各インスタンス間の角度はAngleの値と等しくなります。Total の選択肢は、Angle で指定された範囲内で均等な角度でインスタンスが配置されます。Keep Aspect Ratio には、アスペクト比を維持してインスタンスを作成するかどうかを設定します。"
    status: draft-needs-review
    basis: Existing alt text, heading and adjacent prose only; no visual inspection or new behavioral claim.
    placement:
      before_block: 13
      section: 放射状配置（Radial Array）の複製
    source_url: https://help.screenberry.com/images/warping-alignment/animation/Patch-Replicator-Radial.gif
