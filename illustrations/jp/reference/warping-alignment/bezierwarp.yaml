  - id: ja-8e2add2309-002
    title: Bezier Warp
    caption: Bezier Warp
    show: "Bezier Warp. Use the adjacent instructions as the content brief: 映像のジオメトリとマッピングを変更するために、Bezier Warpノードを使用して、以下の手順をPatch Editorで実行してください： Inputパネルで、メッシュの制御点のハンドルをドラッグして、ソース映像のマッピングを調整します。Outputパネルで、メッシュの制御点のハンドルをドラッグして、映像をオブジェクトの形状に合わせます。 通常、Bezier Warpノードを使用して歪み補正をする場合、メッシュの角の制御ポイントを投影面の形状に合わせて設定することから始めます。その際、メッシュの密度は最小に設定しておきます。その後、制御点グリッドを段階的に細分化し、各細分化ステップでメッシュの曲線を洗練させながら、目的の歪み補正が達成されるまで作業を進めます。"
    status: draft-needs-review
    basis: Existing alt text, heading and adjacent prose only; no visual inspection or new behavioral claim.
