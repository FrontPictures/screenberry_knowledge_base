  - id: ja-8e2add2309-004
    title: Bezier Warp3
    caption: Bezier Warp3
    show: "Bezier Warp3. Use the adjacent instructions as the content brief: SettingsパネルでInterpolate Inner Pointsモードを選択することでもBezier Warpノードの編集を行うことができます。このモードでは、制御点グリッドの辺にあたる制御点が移動された際に、内部の制御点の座標が自動的に再計算されます。 Bezier Warpノードを使用する場合は、Patchの共通操作についてPatchの編集の章も参照してください。"
