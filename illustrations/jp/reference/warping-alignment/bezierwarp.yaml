  - id: ja-8e2add2309-001
    title: Bezier Warp Node Tree
    caption: Bezier Warp Node Tree
    show: "Bezier Warp Node Tree. Use the adjacent instructions as the content brief: Bezier Warpノードは、ベジエ曲線に基づいた映像の変形を可能にするPatchです。主に曲面や一部が曲がった表面、その他の規則的または自由形状のオブジェクトへの投影マッピングに使用されます。 典型的なセットアップでは、Bezier Warpノードは入力としてソース映像を受け取り、変形された映像をDisplayノードまたはCanvasノードに出力します。 Bezier Warpノードを使用したノードグラフの例"
