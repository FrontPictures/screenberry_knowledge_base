  - id: ja-8e2add2309-003
    title: Bezier Warp2
    caption: Bezier Warp2
    show: "Bezier Warp2. Use the adjacent instructions as the content brief: 通常、Bezier Warpノードを使用して歪み補正をする場合、メッシュの角の制御ポイントを投影面の形状に合わせて設定することから始めます。その際、メッシュの密度は最小に設定しておきます。その後、制御点グリッドを段階的に細分化し、各細分化ステップでメッシュの曲線を洗練させながら、目的の歪み補正が達成されるまで作業を進めます。 SettingsパネルでInterpolate Inner Pointsモードを選択することでもBezier Warpノードの編集を行うことができます。このモードでは、制御点グリッドの辺にあたる制御点が移動された際に、内部の制御点の座標が自動的に再計算されます。"
