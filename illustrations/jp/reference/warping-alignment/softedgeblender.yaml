  - id: ja-24054ded73-003
    title: SoftEdgeBlender
    caption: SoftEdgeBlender
    show: "SoftEdgeBlender. Use the adjacent instructions as the content brief: Build Blend Maps： Build Blend Mapsボタンを押すと、新しいブレンドマップが生成されます。 Disable Blending： ブレンドマップがリセットされます。 メモ： Soft Edge Blender ノードの設定が変更された場合や、Soft Edge Blender ノードに接続されたPatchノードのジオメトリが変更された場合は、ブレンドマップを再生成するために Build Blend Maps ボタンを押してください。"
