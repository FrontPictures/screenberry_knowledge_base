  - id: ja-24054ded73-002
    title: Soft Edge Blender
    caption: Soft Edge Blender
    show: "Soft Edge Blender. Use the adjacent instructions as the content brief: Soft Edge Blenderノードを使用したノードグラフの例 Soft Edge BlenderノードのSettingsパネルでは、次ような設定を使用してソフトエッジブレンドを行います： Generation Method： ブレンドマップの生成方法を設定します。線形距離（Linear Distance） または 重力関数（Gravity Function） のいずれかを選択します"
