    title: Soft Edge Blender Node Tree
    caption: Soft Edge Blender Node Tree
    show: "Soft Edge Blender Node Tree. Use the adjacent instructions as the content brief: Soft Edge Blenderノードは、2つ以上の重なり合う映像を1つのシームレスな映像に組み合わせるためのソフトエッジブレンディングの機能を提供します。 Soft Edge Blenderノードは、Patchによって修正された映像のシームレスな重なり合いを可能にするブレンディングマップを生成するために、これらのPatchノードのSoft Edge Blender入力パラメータに接続する必要があります。 Soft Edge Blenderノードを使用したノードグラフの例"
