  - id: ja-4e96cdacee-001
    title: LedStripesMapper
    caption: LedStripesMapper
    show: "LedStripesMapper. Use the adjacent instructions as the content brief: LED Stripes Mapperノードは、映像メディアコンテンツを直線状にリマップするための Patch です。通常、このノードは信号を LED ストライプコントローラに出力するために使用されます。映像を入力として受け取る照明デバイスの制御にも使用することができます。 典型的なセットアップでは、LED Stripes Mapperノードは入力としてソース映像を受け取り、変形された映像をDisplayノードまたはCanvasノードに出力します。 LED Stripes Mapperノードを使用したノードグラフの例"
    status: draft-needs-review
    basis: Existing alt text, heading and adjacent prose only; no visual inspection or new behavioral claim.
