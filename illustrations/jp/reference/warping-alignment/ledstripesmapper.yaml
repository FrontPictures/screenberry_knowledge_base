  - id: ja-4e96cdacee-004
    title: LedStripesMapper Settings
    caption: LedStripesMapper Settings
    show: "LedStripesMapper Settings. Use the adjacent instructions as the content brief: LED Stripes MapperのSettingsパネルで：Source Line Width欄で、ソース映像の幅をピクセル単位で設定してください。Target Image Size、Offset XおよびY、出力のライン幅（Line Width）、間隔（Spacing） の欄にそれぞれ値を入力してください（LED ストライプまたはライティングコントローラーの仕様を参照してこれらの値を設定してください）。Number of Polylines欄に値を入力し、各ポリラインの 分割数（Segments） と 全長（Total Length、ピクセル単位）** を入力してください（例えば、5つに分割されて、各部分が128ピクセルである場合、全長は 5 x 128 = 640 ピクセルとなります）。 Inputパネルで、右クリックしてドロップダウンメニューからShow Live Imageを選択し、その後、制御点をポリラインの端点上"
