  - id: ja-4e96cdacee-002
    title: LedStripesMapper Playback
    caption: LedStripesMapper Playback
    show: "LedStripesMapper Playback. Use the adjacent instructions as the content brief: 映像メディアコンテンツを直線状にリマップするには、以下の手順を実行してください： Node Graphウィジェットで、Media Player、LED Stripes Mapper、およびCanvas ノードを追加し、それぞれを Ctrl キーを押しながらクリックして接続して、ノードツリーを作成します。Media Player ウィジェットに切り替えて、リマップしたいメディアコンテンツを Media Player のプレイリストに追加し、再生を開始して Patch 作業中に映像を参照できるように準備します。 Patch Editorに切り替え、Patch リストでLED Stripes Mapperを選択します。"
    status: draft-needs-review
    basis: Existing alt text, heading and adjacent prose only; no visual inspection or new behavioral claim.
    placement:
      before_block: 6
      section: LED Stripes Mapper
    source_url: https://help.screenberry.com/images/warping-alignment/animation/LedStripesMapper-playback.gif
