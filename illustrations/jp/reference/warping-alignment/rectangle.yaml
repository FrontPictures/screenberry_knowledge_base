  - id: ja-9bda42aa49-003
    title: Rect Whiteguide
    caption: Rect Whiteguide
    show: "Rect Whiteguide. Use the adjacent instructions as the content brief: Rectangleノードで制御点を編集する際、追加の斜めスマートガイドが表示されます。 Inputパネルでは、Outputパネルで定義された映像のアスペクト比が表示されます。Outputパネルでは、現在のInputパネルで定義されている映像のアスペクト比が表示されます。 Rectangleノードを使用する場合は、Patchの共通操作についてPatchの編集の章も参照してください。"
