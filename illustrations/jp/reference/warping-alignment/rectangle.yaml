  - id: ja-9bda42aa49-002
    title: Rectangle
    caption: Rectangle
    show: "Rectangle. Use the adjacent instructions as the content brief: Patch EditorのRectangleノードを使用して、映像のジオメトリとマッピングを変更するには、次の手順を実行します： Inputパネルで、メッシュの制御点のハンドルをドラッグして、マッピングされるソース映像のスケール、アスペクト比、および範囲を変更します。Outputパネルで、メッシュの制御点のハンドルをドラッグして、映像のスケール、アスペクト比、およびオフセットを調整して、映像をオブジェクトの形状に合わせます。 Rectangleノードで制御点を編集する際、追加の斜めスマートガイドが表示されます。"
