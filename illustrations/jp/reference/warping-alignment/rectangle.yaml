    title: Rectangle
    caption: Rectangle
    show: "Rectangle. Use the adjacent instructions as the content brief: Rectangleノードは、平面の矩形ベースの変更を適用するためのPatchであり、主に LED などの矩形のスクリーン上で映像をスケーリング、整列、配置するために使用されます。また、複数のメディアソースを1つの画面上で組み合わせてピクチャインピクチャ効果を作成するためにも使用されます。典型的なセットアップでは、Rectangleノードは入力としてソース映像を受け取り、変形された映像をDisplayノードまたはCanvasノードに出力します。 Rectangleノードを使用したノードグラフの例"
