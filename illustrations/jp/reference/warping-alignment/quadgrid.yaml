  - id: ja-a6e63ff7a3-001
    title: Quad Grid Node Tree
    caption: Quad Grid Node Tree
    show: "Quad Grid Node Tree. Use the adjacent instructions as the content brief: Quad Gridノードは、ユーザーが定義したメッシュグリッドの個々の面に透視投影変形を適用するPatchノードです。このPatchは、階段状のオブジェクトの表面に投影をマッピングするために開発されました。 典型的なセットアップでは、Quad Gridノードは入力としてソース映像を受け取り、変形された映像をDisplayノードまたはCanvasノードに出力します。 Quad Gridノードを使用したノードグラフの例"
