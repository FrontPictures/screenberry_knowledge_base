  - id: ja-a6e63ff7a3-004
    title: Quad Grid
    caption: Quad Grid
    show: "Quad Grid. Use the adjacent instructions as the content brief: 横長の平面が並んだPatchの例。Grid Size: X=2, Y=10縦長の平面が並んだPatchの例。Grid Size: X=10, Y=2 Outputパネルで、各グリッド平面の制御点のハンドルをドラッグして、映像をオブジェクトの形状に合わせます。メッシュグリッドの変更中に、グリッド平面が台形の形に変換された場合、平面の接合部に歪みが生じる可能性があります。これを避けるためには、SettingsパネルのVertical InterpolationまたはHorizontal InterpolationでLinearを選択し、透視投影変形を水平または垂直のグリッド平面に制限してください。 Quad Gridノードを使用する場合は、Patchの共通操作についてPatchの編集の章も参照してください。"
