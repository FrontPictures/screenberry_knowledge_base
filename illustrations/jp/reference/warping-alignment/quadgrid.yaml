  - id: ja-a6e63ff7a3-002
    title: Stairs1
    caption: Stairs1
    show: "Stairs1. Use the adjacent instructions as the content brief: Patch Editorで Quad Gridノードを使って透視投影変形を適用するには、以下の手順を実行します： SettingsパネルのGrid SizeにXとYの値を入力して、メッシュグリッドを作成します。典型的な設定は、水平な平面（ステップ）を持つ階段状のオブジェクトへの投影です。Xの値は2に設定します。これは1つの列のメッシュグリッドを定義するために必要な最小のキーコントロールポイントの数です。より複雑なオブジェクトへのプロジェクションマッピングの場合、この値は大きくすることもできます。Yの値は、階段の格段の側面と上面の総数に合わせて設定します。階段や屏風のようなオブジェクトへの投影の場合、XとYの値は逆になります。 Outputパネルで、各グリッド平面の制御点のハンドルをドラッグして、映像をオブジェクトの形状に合わせます。メッシュグリッドの変更中に、グリッド平面が台形の形に変換された場合、平面の接合部に歪みが生じる可能"
    status: draft-needs-review
    basis: Existing alt text, heading and adjacent prose only; no visual inspection or new behavioral claim.
