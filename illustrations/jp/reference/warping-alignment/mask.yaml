  - id: ja-d83e9a9ce3-002
    title: Mask
    caption: Mask
    show: "Mask. Use the adjacent instructions as the content brief: Patch EditorのOutputパネルで、次の操作を実行して形状マスクを作成および編集します： 制御点を追加してパスを描画します。 Outputエリア上にカーソルを置き、P キーを押すか、右クリックしてドロップダウンメニューから Add Point を選択して、制御点を作成します。追加される各制御点は、前の制御点と自動的に直線で接続されます。制御点を追加して必要な形状にパスを描画します。形状を完成させます。 Outputパネル内でダブルクリックすると、描画中のパスが閉じられます。直線のパスを曲線に変換します。 制御点にカーソルを重ねたまま、次のいずれかの操作を行います：Ctrl キーを押しながらマウスをドラッグすると、方向線（または接線）ハンドルが延長され、制御点の片側の曲線が調整されます。Ctrl + Shift キーを押しながらマウスをドラッグすると、ペアの方向線ハンドルが延長され、制御点の両側の曲線が同時に調整されま"
