    title: Mask Node Tree
    caption: Mask Node Tree
    show: "Mask Node Tree. Use the adjacent instructions as the content brief: Maskノードは、他の映像の上に自由形状の単色マスクを描くためによく利用されるPatchです。 典型的なセットアップでは、MaskノードはSolid Colorノードから単色の画像を受け取り、結果のマスク形状をDisplayノードまたはCanvasノードに出力します。その際に、別の映像ソースノードから受け取ったの上に映像にマスクを描きます。 Maskノードを使用したノードグラフの例"
