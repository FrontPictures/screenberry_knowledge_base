    title: Dome Transform Node Tree
    caption: Dome Transform Node Tree
    show: "Dome Transform Node Tree. Use the adjacent instructions as the content brief: Dome Transform ノードは、ドームセットアップにおいて自動キャリブレーションの結果に追加のジオメトリ修正を適用するための Patch です。主にキャリブレーションカメラの位置、向き、およびレンズの歪みを補正するために使用されます。 典型的なセットアップでは、Dome Transform ノードは Calibrator ノードと Render Target ノードを介して接続されます。 Dome Transformノードを使用したノードグラフの例"
