    caption: Transform2D
    show: "Transform2D. Use the adjacent instructions as the content brief: Transform 2Dノードは、Patchに対して静的または動的な行列変形を適用することができます。通常、Patchの位置、移動、スケール、回転、さまざまなピクチャーインピクチャー効果を作成するために使用されます。 Transform 2Dノードは、変形対象にするPatchノードのTransform Matrix入力ピンに接続されます。 Transform 2Dノードを使用したノードグラフの例"
