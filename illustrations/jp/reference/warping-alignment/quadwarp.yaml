    show: "QuadWarp. Use the adjacent instructions as the content brief: Quad Warpノードは、主に映像のジオメトリ補正に使用されるPatchノードであり、平面上に斜めから映像を投映した際の歪み（キーストーン歪み とも呼ばれる）を補正します。 典型的なセットアップでは、Quad Warpノードは入力としてソース映像を受け取り、変形された映像をDisplayノードまたはCanvasノードに出力します。 Quad Warpノードを使用したノードグラフの例"
