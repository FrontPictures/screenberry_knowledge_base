  - id: ja-a1c91f9dab-002
    title: Quad Warp
    caption: Quad Warp
    show: "Quad Warp. Use the adjacent instructions as the content brief: Quad Warpノードを使用して、映像のジオメトリとマッピングを変更するには、次の手順をPatch Editorで実行します。 Inputパネルで、メッシュの制御点のハンドルをドラッグして、マップされるソース映像の範囲を調整します。Outputパネルで、メッシュの制御点のハンドルをドラッグして、映像の透視投影変換を調整して、映像をオブジェクトの形状に合わせます。 Quad Warpノードを使用する場合は、Patchの共通操作についてPatchの編集の章も参照してください。"
