    show: "Trimesh Edit 1. Use the adjacent instructions as the content brief: Outputパネルで、メッシュの制御点のハンドルをドラッグして、映像をオブジェクトの形状に合わせます。Inputパネルで、メッシュの制御点のハンドルをドラッグして、個々のメッシュ三角形に対するソース映像のマッピングを定義します。 Triangle Meshノードを使用する場合は、Patchの共通操作についてPatchの編集の章も参照してください。"
