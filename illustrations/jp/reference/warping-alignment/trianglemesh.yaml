    show: "Triangle Mesh Node Tree. Use the adjacent instructions as the content brief: Triangle Meshノードは、主に三角形の形状で構成されたオブジェクトの表面に投影マッピングするために使用されるPatchノードです。 典型的なセットアップでは、セットアップでは、Triangle Meshノードは入力としてソース映像を受け取り、変形された映像をDisplayノードまたはCanvasノードに出力します。 Triangle Meshノードを使用したノードグラフの例"
