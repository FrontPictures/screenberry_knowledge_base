  - id: ja-177642c24c-002
    title: Triangle Mesh
    caption: Triangle Mesh
    show: "Triangle Mesh. Use the adjacent instructions as the content brief: 三角メッシュ変形を適用するためには: 以下の手順に従って、三角メッシュを作成し編集します：制御点の追加。レイアウトエリアにマウスカーソルを置き、P キーを押すか、右クリックしてドロップダウンメニューから Add Point を選択して制御点を作成します。制御点を三角メッシュの面として接続。制御点を選択して T キーを押すか、選択した制御点を右クリックしてドロップダウンメニューから Create Triangles を選択して、選択した制御点を接続します。制御点が選択されていない場合、T キーを押すとすべての既存の制御点が接続されます。制御点の削除。制御点を選択して Del キーを押すか、選択した制御点を右クリックし、ドロップダウンメニューから Delete points を選択して、それらの制御点を削除します。 Outputパネルで、メッシュの制御点のハンドルをドラッグして、映像をオブジェクトの形状に合わせます。Inputパネル"
