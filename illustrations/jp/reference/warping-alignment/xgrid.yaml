    show: "XGrid. Use the adjacent instructions as the content brief: Patch EditorでXGridノードを使用するには、以下の手順を実行してください： SettingsパネルのGrid SizeにXとYの値を入力して、メッシュグリッドを作成します。Inputパネルで、メッシュ制御点のハンドルをドラッグしてソース映像のマッピングを定義します。Outputパネルで、メッシュ制御点のハンドルをドラッグして、映像をオブジェクトの形状に合わせます。 XGridノードを使用する場合は、Patchの共通操作についてPatchの編集の章も参照してください。"
