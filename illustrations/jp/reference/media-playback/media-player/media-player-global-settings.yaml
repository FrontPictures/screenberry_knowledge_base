  - id: ja-6cacbdfb22-001
    title: Global Color Correction
    caption: Global Color Correction
    show: "Global Color Correction. Use the adjacent instructions as the content brief: Media Playerの出力用の色調補正コントロールにアクセスするには、Media Playerウィジェットの右下にあるColor Correctionボタンをクリックします。 メモ： 色調補正は個々のメディアアイテムにも適用することができ、それらはMedia Playerの出力に適用されるものと組み合わされます。"
    status: draft-needs-review
