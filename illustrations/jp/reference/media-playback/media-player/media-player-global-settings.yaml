  - id: ja-6cacbdfb22-002
    title: Global Volume Control
    caption: Global Volume Control
    show: "Global Volume Control. Use the adjacent instructions as the content brief: Media Playerのオーディオ出力の音量を調整するには、Media Playerウィジェットの右下にあるVolumeボタンをクリックし、スライダーをドラッグして音量レベルを設定します。 個々のメディアアイテムのオーディオ音量も調整することができ、これらの変更はMedia Playerのオーディオ出力と音調設定と組み合わされます。"
    status: draft-needs-review
