  - id: ja-8918f141ed-003
    title: Zooming In Or Out Of A Timeline 1
    caption: Zooming In Or Out Of A Timeline 1
    show: "Zooming In Or Out Of A Timeline 1. Use the adjacent instructions as the content brief: タイムラインのズームインまたはズームアウトするには、以下のいずれかの方法を使用します。 マウスカーソルをタイムライン上に置き、マウスのスクロールホイールを使用して、マウスカーソルの位置に基づいてズームインまたはズームアウトします。再生ヘッドの位置に基づいて、プラスキー + を押してズームインし、マイナスキー - を押してズームアウトします。トップツールバーのまたはボタンをクリックして、再生ヘッドの位置に基づいてズームインまたはズームアウトします。トップツールバーのボタンをクリックするか、\\（バックスラッシュ）キーを押して、タイムライン全体を表示するためにズームアウトします。トップツールバーのボタンをクリックするか、Shift + \\（バックスラッシュ）キーを押して、フレーム単位までズームインします。"
    status: draft-needs-review
    basis: Existing alt text, heading and adjacent prose only; no visual inspection or new behavioral claim.
    placement:
      before_block: 9
      section: タイムラインのズームイン/アウト
    source_url: https://help.screenberry.com/images/media-playback/animation/Zooming-in-or-out-of-a-timeline-1.gif
