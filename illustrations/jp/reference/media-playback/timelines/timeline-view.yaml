  - id: ja-8918f141ed-002
    title: Positioning The Playhead On A Timeline
    caption: Positioning The Playhead On A Timeline
    show: "Positioning The Playhead On A Timeline. Use the adjacent instructions as the content brief: 以下のいずれかの方法で、タイムライン上で再生位置を変更します。 再生位置ヘッドを移動したいタイムライン上の時間目盛りをクリックします。タイムライン上の再生ヘッドをドラッグします。再生ヘッドをメディアアイテムの境界やマーカーにスナップさせたい場合は、サイドツールバーのPlayhead Snappingスイッチを有効にします。矢印キーを使用します。右矢印 キーまたは 左矢印 キーを押して、再生ヘッドを次のフレームまたは前のフレームに移動します。上矢印 キーまたは 下矢印 キーを押して、次のメディアアイテムの境界やマーカーに移動します。K キーまたは J キーを押して、再生ヘッドを次のキーフレームまたは前のキーフレームに移動します。Home キーまたは End キーを押して、再生ヘッドをタイムラインの先頭または終端に移動します。"
    status: draft-needs-review
    basis: Existing alt text, heading and adjacent prose only; no visual inspection or new behavioral claim.
    placement:
      before_block: 6
      section: タイムライン上の再生位置の変更
