  - id: ja-8b3cfcf5e8-005
    title: Selecting Nodes by Type
    caption: Selecting Nodes by Type
    show: "Selecting Nodes by Type. Use the adjacent instructions as the content brief: 複数のノードが選択されている場合、Settingsパネルにはすべての選択されたノードに共通するパラメータのみが表示され、編集することができます。さらに、選択範囲内の各タイプのノードの数に関する情報がSettingsパネルの上部に表示されます。このボタンをクリックすると、そのタイプのノードのみを選択することができます。"
    status: draft-needs-review
    basis: Existing alt text, heading and adjacent prose only; no visual inspection or new behavioral claim.
    placement:
      before_block: 12
      section: 複数選択されたノードの設定
    source_url: https://help.screenberry.com/images/working-with-nodes/animation/Selecting-Nodes-by-Type.gif
    source_alt: Selecting Nodes by Type
    text_coverage: not-independently-verified
  - id: ja-8b3cfcf5e8-006
    title: Hiding and Showing Individual Node Parameters
    caption: Hiding and Showing Individual Node Parameters
    show: "Hiding and Showing Individual Node Parameters. Use the adjacent instructions as the content brief: パラメータを非表示にするには、パラメータ名を右クリックし、ドロップダウンメニューからHideを選択します。非表示のパラメータを表示するには、Hidden Parameters欄でShowをクリックします。非表示状態のパラメータはイタリックで表示されます。パラメータを非表示解除するには、パラメータ名を右クリックし、ドロップダウンメニューからShowを選択します。非表示パラメータを表示しないようにするには、Hidden Parameters欄でHideをクリックします。 メモ： 一部のノードのより使用頻度の低い、より高度なパラメータはデフォルトで非表示になっています。"
    status: draft-needs-review
    basis: Existing alt text, heading and adjacent prose only; no visual inspection or new behavioral claim.
    placement:
      before_block: 14
      section: ノードの個々のパラメータの非表示/表示
    source_url: https://help.screenberry.com/images/working-with-nodes/animation/Hiding-Showing-Node-Parameters.gif
    source_alt: Hiding and Showing Individual Node Parameters
    text_coverage: not-independently-verified
  - id: ja-8b3cfcf5e8-007
    title: Hiding Showing Node Pins
    caption: Hiding Showing Node Pins
    show: "Hiding Showing Node Pins. Use the adjacent instructions as the content brief: Settingsパネルでは、パラメータ名の左側にあるドットを左クリックすると、ノード上の対応するパラメータピンの表示と非表示を切り替えることができます。青いドットはパラメータピンが表示されていることを示し、灰色のドットは非表示を示します。 パラメータピンに設定されたリンクが非表示になった場合、このリンクは有効なままで、薄い線で表示されます。"
    status: draft-needs-review
    basis: Existing alt text, heading and adjacent prose only; no visual inspection or new behavioral claim.
    placement:
      before_block: 17
      section: ノードのピンの表示/非表示
    source_url: https://help.screenberry.com/images/working-with-nodes/animation/Hiding-Showing-Node-Pins.gif
    source_alt: Hiding Showing Node Pins
    text_coverage: not-independently-verified
