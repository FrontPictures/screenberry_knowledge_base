  - id: ja-8b3cfcf5e8-002
    title: Node Parameters Example
    caption: Node Parameters Example
    show: "Node Parameters Example. Use the adjacent instructions as the content brief: アクション（オレンジのピン ）は、1つの入力に複数のリンクを作成することができます。その結果として、すべての入力値に対して論理OR（いずれか一つでも有効であれば有効）の結果が入力されます。 メッセージ（ピンク色のピン ）もまた、1 つの入力に対して複数のリンクを作成することができます。こちらは、すべての入力がキューイングされ順番に処理されます。"
    status: draft-needs-review
    basis: Existing alt text, heading and adjacent prose only; no visual inspection or new behavioral claim.
    placement:
      before_block: 7
      section: ノードのパラメータ（ピン）
    source_url: https://help.screenberry.com/images/working-with-nodes/static/Node-Parameters-Example.gif
    source_alt: Node Parameters Example
    text_coverage: not-independently-verified
  - id: ja-8b3cfcf5e8-003
    title: Node Settings
    caption: Node Settings
    show: "Node Settings. Use the adjacent instructions as the content brief: ノードを選択すると、そのノードのパラメータを編集するためのSettingsパネルが表示されます。 Settingsパネルでのノードパラメータ値が変更されると、パラメータ値フィールドの隣にあるボタンによって示されます。このボタンをクリックすると、デフォルトのパラメータ値に戻ります。"
    status: draft-needs-review
    basis: Existing alt text, heading and adjacent prose only; no visual inspection or new behavioral claim.
    placement:
      before_block: 9
      section: ノードの設定
    source_url: https://help.screenberry.com/images/working-with-nodes/animation/Node-Settings.gif
    source_alt: Node Settings
    text_coverage: not-independently-verified
  - id: ja-8b3cfcf5e8-004
    title: Restore Node Settings
    caption: Restore Node Settings
    show: "Restore Node Settings. Use the adjacent instructions as the content brief: Settingsパネルでのノードパラメータ値が変更されると、パラメータ値フィールドの隣にあるボタンによって示されます。このボタンをクリックすると、デフォルトのパラメータ値に戻ります。"
    status: draft-needs-review
    basis: Existing alt text, heading and adjacent prose only; no visual inspection or new behavioral claim.
    placement:
