  - id: ja-8b3cfcf5e8-001
    title: Node Parameters Pins
    caption: Node Parameters Pins
    show: "Node Parameters Pins. Use the adjacent instructions as the content brief: ノードピンは、ノードのパラメータをグラフィカルに表現したものです。 データ（灰色のピン ）パラメータには、単純なデータ（数値、文字列、タイムコード）またはScreenberryの内部リソース（例： 画像）へのポインタが含まれています。"
    status: draft-needs-review
    basis: Existing alt text, heading and adjacent prose only; no visual inspection or new behavioral claim.
