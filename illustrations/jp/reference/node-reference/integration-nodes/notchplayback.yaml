    show: "Notch. Use the adjacent instructions as the content brief: Notch BlockレイヤーがSettingsパネルで選択されると、Notch Playbackノードは以下の動作をします： このレイヤーの再生に切り替わります。各レイヤーオブジェクトごとにSettingsパネルに別のセクションを作成します。このセクションには公開されたパラメータが表示されます。レイヤー内のすべての公開されたパラメータに対してカスタムパラメータを生成します。 また、以下の操作を行うために、ノードグラフには様々なノードがNotch Playbackノードに接続できます："
