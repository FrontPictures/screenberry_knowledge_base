  - id: ja-41a205d6e6-002
    title: TouchEngineExample
    caption: TouchEngineExample
    show: "TouchEngineExample. Use the adjacent instructions as the content brief: TOP は、映像の作成、合成、変更、ファイルおよびネットワークへの静止画および動画の読み書きを行うオペレーター群です。TOP はグラフィックカードの GPU 上で動作します。CHOP は、アニメーション、オーディオ、数学、シミュレーション、ロジック、UI 構築などに使用されるチャンネル（数値の組）に対して操作を行うオペレーター群です。DAT は、テキスト文字列（複数行のテキストまたはテーブル）を操作するオペレーター群です。複数行テキストはコマンドスクリプトであることが多いですが、任意の複数行テキストであることもあります。テーブルは、テキスト文字列を含むセルの行と列で構成されます。 ノードの設定に入力/出力パラメーターが追加されると、ノードに対応するピンが追加されます。これにより、必要に応じて他のノードにこのパラメーターを接続することができます。 TouchEngineノードを使用したノードツリーの例です。これらのサンプルScre"
