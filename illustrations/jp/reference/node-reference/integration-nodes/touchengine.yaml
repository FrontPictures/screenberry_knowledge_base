    title: Adding TouchEngine
    caption: Adding TouchEngine
    show: "Adding TouchEngine. Use the adjacent instructions as the content brief: メモ： 追加した TouchEngine パラメータのFound情報チェックボックスが選択されていることを確認してください。それ以外の場合は、パラメータ名が対応する TouchDesigner オペレータの名前と一致しているかどうかを確認してください。 追加されたパラメータのタイプを選択してください - TOP、CHOP、DAT（テーブル）、またはDAT（文字列）。 現在、TouchEngine API では、TOP、CHOP、および DAT の入力および出力オペレーターがサポートされています。"
