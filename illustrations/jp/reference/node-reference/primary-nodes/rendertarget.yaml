  - id: ja-d209ca76be-002
    title: Render Target node usage
    caption: Render Target node usage
    show: "Render Target node usage. Use the adjacent instructions as the content brief: Render Targetノードは、映像の歪み補正処理の中間結果を扱うためによく使用されます。 Render Targetノードがノードグラフに追加されると、Render Targetノードに接続されたDisplayとPatchを編集するための対応するウィジェットが利用可能になります。このウィジェットは、メインのScreenberry PanelメニューからWindow > [Render Target名] を選択することでワークスペースに追加することができます。DisplayとPatchの編集に関する詳細については、このユーザーガイドのDisplay EditorおよびPatch Editorの章を参照してください。"
    status: draft-needs-review
