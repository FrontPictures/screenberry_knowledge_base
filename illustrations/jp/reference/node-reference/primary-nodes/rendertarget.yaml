  - id: ja-d209ca76be-003
    title: Render Target Editor
    caption: Render Target Editor
    show: "Render Target Editor. Use the adjacent instructions as the content brief: Render Targetノードがノードグラフに追加されると、Render Targetノードに接続されたDisplayとPatchを編集するための対応するウィジェットが利用可能になります。このウィジェットは、メインのScreenberry PanelメニューからWindow > [Render Target名] を選択することでワークスペースに追加することができます。DisplayとPatchの編集に関する詳細については、このユーザーガイドのDisplay EditorおよびPatch Editorの章を参照してください。 ノードをVideo Previewノードに接続することで、Render Targetで生成された映像をプレビューすることができます。Video Previewノードには、ワークスペースに追加することができるウィジェットがあります。"
