  - id: ja-8a927bc5d4-003
    title: Multiple Canvas nodes
    caption: Multiple Canvas nodes
    show: "Multiple Canvas nodes. Use the adjacent instructions as the content brief: 複数のCanvasノードを作成することができますが、メディアサーバーの映像出力には一度に1つだけ有効にすることができます。追加された各Canvasノードには、それぞれ対応するウィジェットがあります。 詳細な情報は、このユーザーガイドのDisplay EditorとPatch Editorの章を参照してください。"
