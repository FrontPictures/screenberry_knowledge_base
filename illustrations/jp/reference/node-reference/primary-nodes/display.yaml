  - id: ja-8737f35385-001
    title: Display Node Graph
    caption: Display Node Graph
    show: "Display Node Graph. Use the adjacent instructions as the content brief: Displayノードは、Screenberry サーバーの映像出力に配置できる個々の表示領域を定義します。複数のDisplayノードをCanvasノードまたは Render Targetノード（オフスクリーンレンダリング用）に接続することができます。 Displayノードは、接続された映像ソースや Patch ノードからメディアコンテンツを受信します。 DisplayノードがCanvas（またはRender Target）ノードに接続されると、このノードは対応するCanvas（またはRender Target）Editorウィジェットで編集可能になります。表示の編集に関する詳細は、Display Editorの章を参照してください。"
