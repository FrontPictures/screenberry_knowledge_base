  - id: ja-fd4b5bab3f-006
    title: Indication Playback
    caption: Indication Playback
    show: "Indication Playback. Use the adjacent instructions as the content brief: マトリックス型プレイリストが再生、一時停止、または停止されている場合、ナビゲーションパネルのプレイリスト名の隣にある対応するアイコンに現在の状態が表示されます。現在アクティブなプレイリストが折りたたまれたフォルダ内にある場合、これらのアイコンはフォルダアイコンを置き換えます。"
    status: draft-needs-review
    basis: Existing alt text, heading and adjacent prose only; no visual inspection or new behavioral claim.
    placement:
      before_block: 27
      section: 状態表示
    source_url: https://help.screenberry.com/images/media-playback/animation/Indication-Playback.gif
    source_alt: Indication Playback
    text_coverage: not-independently-verified
  - id: ja-fd4b5bab3f-007
    title: Playback Prioritization Matrix
    caption: Playback Prioritization Matrix
    show: "Playback Prioritization Matrix. Use the adjacent instructions as the content brief: マトリックス型プレイリストでは、再生に関連するすべての新しいユーザーの操作は、前の操作よりも優先されます。例えば、列の再生が開始され、その後ひとつの行が一時停止される場合、このより新しい操作が優先され、その行の再生が一時停止されます。"
    status: draft-needs-review
    basis: Existing alt text, heading and adjacent prose only; no visual inspection or new behavioral claim.
    placement:
      before_block: 29
      section: 再生の優先度
    source_url: https://help.screenberry.com/images/media-playback/animation/Playback-Prioritization-Matrix.gif
    source_alt: Playback Prioritization Matrix
