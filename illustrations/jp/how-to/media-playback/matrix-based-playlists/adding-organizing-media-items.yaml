  - id: ja-a644a12d4c-006
    title: Adding Data Items Matrix
    caption: Adding Data Items Matrix
    show: "Adding Data Items Matrix. Use the adjacent instructions as the content brief: マトリックスグリッドにデータアイテムを追加するには、以下の手順に従ってください： データアイテムを配置するグリッドセルで右クリックします。ドロップダウンメニューからAdd Data Itemを選択します。表示されるダイアログボックスで、変更するパラメータのNode PathとParameter Nameを入力します。データアイテムの設定で、このデータアイテムを再生中にパラメータが利用する値を定義します。"
    status: draft-needs-review
    basis: Existing alt text, heading and adjacent prose only; no visual inspection or new behavioral claim.
    placement:
      before_block: 19
      section: データアイテムの追加
    source_url: https://help.screenberry.com/images/media-playback/animation/Adding-Data-Items-Matrix.gif
    source_alt: Adding Data Items Matrix
    text_coverage: not-independently-verified
  - id: ja-a644a12d4c-007
    title: Renaming Media Items Matrix
    caption: Renaming Media Items Matrix
    show: "Renaming Media Items Matrix. Use the adjacent instructions as the content brief: プレイリスト内のメディアアイテムの名前を変更するには、次の方法があります： メディアアイテムを右クリックし、ドロップダウンメニューからRenameを選択します（または F2 ショートカットを使用します）。その後、開かれた Set Item Title ダイアログボックスの Title 欄に新しい名前を入力します。または、メディアアイテムを選択して設定を開き、Title 欄に新しいタイトルを入力します。"
    status: draft-needs-review
    basis: Existing alt text, heading and adjacent prose only; no visual inspection or new behavioral claim.
    placement:
      before_block: 22
      section: メディアアイテム名を変更する
    source_url: https://help.screenberry.com/images/media-playback/animation/Renaming-Media-Items-Matrix.gif
    source_alt: Renaming Media Items Matrix
    text_coverage: not-independently-verified
  - id: ja-a644a12d4c-008
    title: Deleting Media Items Matrix
    caption: Deleting Media Items Matrix
    show: "Deleting Media Items Matrix. Use the adjacent instructions as the content brief: グリッドからメディアアイテムまたは複数の選択されたメディアアイテムを削除するには、アイテムを右クリックしてドロップダウンメニューから Delete を選択するか、Del キーを押してください。"
    status: draft-needs-review
    basis: Existing alt text, heading and adjacent prose only; no visual inspection or new behavioral claim.
    placement:
      before_block: 24
      section: メディアアイテムの削除
    source_url: https://help.screenberry.com/images/media-playback/animation/Deleting-Media-Items-Matrix.gif
    source_alt: Deleting Media Items Matrix
    text_coverage: not-independently-verified
  - id: ja-a644a12d4c-009
    title: Selecting Media Items Matrix
    caption: Selecting Media Items Matrix
    show: "Selecting Media Items Matrix. Use the adjacent instructions as the content brief: マトリックスグリッド内のアイテムは、以下の方法で選択できます： アイテムをクリックして選択します。複数のアイテムを選択するには、Ctrl キーを押しながらアイテムをクリックします。一つのアイテムを選択し、Shift キーを押しながら別のアイテムをクリックすると、これらのアイテムを対角線とする四角形領域内のすべてのアイテムが選択されます。列のヘッダをクリックすると、その列のすべてのアイテムが選択されます。行のヘッダをクリックすると、その行のすべてのアイテムが選択されます。"
    status: draft-needs-review
    basis: Existing alt text, heading and adjacent prose only; no visual inspection or new behavioral claim.
    placement:
      before_block: 27
      section: メディアアイテムの選択方法
    source_url: https://help.screenberry.com/images/media-playback/animation/Selecting-Media-Items-Matrix.gif
    source_alt: Selecting Media Items Matrix
    text_coverage: not-independently-verified
  - id: ja-a644a12d4c-010
    title: Arranging Media Items Matrix
    caption: Arranging Media Items Matrix
    show: "Arranging Media Items Matrix. Use the adjacent instructions as the content brief: メディアアイテムを選択し、グリッドの好きな位置にドラッグして配置することができます。 複数のアイテムを同時に移動する場合、それらの相対位置関係が維持されます。これらのアイテムをドラッグすると、グリッド内のターゲットセルがハイライト表示され、マウスボタンを離した時に配置される場所が示されます。これらのセルに既存のメディアアイテムがある場合は、新しく配置されるアイテムによって上書きされることに注意してください。"
    status: draft-needs-review
    basis: Existing alt text, heading and adjacent prose only; no visual inspection or new behavioral claim.
    placement:
      before_block: 30
      section: マトリックスグリッド内のメディアアイテムの配置
    source_url: https://help.screenberry.com/images/media-playback/animation/Arranging-Media-Items-Matrix.gif
    source_alt: Arranging Media Items Matrix
    text_coverage: not-independently-verified
  - id: ja-a644a12d4c-011
    title: Media Item Settings Matrix
    caption: Media Item Settings Matrix
    show: "Media Item Settings Matrix. Use the adjacent instructions as the content brief: メディアアイテムの設定にアクセスして調整するには、次のいずれかの方法を使用します： マトリックスグリッド内のアイテムを右クリックし、ドロップダウンメニューからItem Settingsを選択するか、メディアアイテムを選択した状態で S キーを押して Settings ダイアログボックスを開きます。または、メディアアイテムを選択して表示される Settings パネルを利用します。 マトリックス型プレイリストのメディアアイテムには、シンプルなプレイリストと同じ設定が利用できます。利用可能な設定項目の詳細については、メディアアイテムの設定の章を参照してください。"
    status: draft-needs-review
    basis: Existing alt text, heading and adjacent prose only; no visual inspection or new behavioral claim.
    placement:
      before_block: 34
      section: メディアアイテムの設定
    source_url: https://help.screenberry.com/images/media-playback/animation/Media-Item-Settings-Matrix.gif
    source_alt: Media Item Settings Matrix
    text_coverage: not-independently-verified
  - id: ja-a644a12d4c-012
    title: Customizing Thumbnail Appearance Matrix
    caption: Customizing Thumbnail Appearance Matrix
    show: "Customizing Thumbnail Appearance Matrix. Use the adjacent instructions as the content brief: Show Namesのチェックを外すと、視覚的なコンテンツに焦点を合わせたクリーンな表示になります。Show Namesをチェックしたままにすると、タイトルが表示され、メディアアイテムを見つけて操作しやすくなります。 これらの設定により、プロジェクトの要件に合わせてメディアアイテムのサムネイルを柔軟に設定することができます。"
    status: draft-needs-review
    basis: Existing alt text, heading and adjacent prose only; no visual inspection or new behavioral claim.
    placement:
      before_block: 48
      section: サムネイルの表示方法のカスタマイズ
