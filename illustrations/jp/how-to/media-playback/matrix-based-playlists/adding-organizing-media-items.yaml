  - id: ja-a644a12d4c-001
    title: Adding Rows And Columns
    caption: Adding Rows And Columns
    show: "Adding Rows And Columns. Use the adjacent instructions as the content brief: もし、現在用意されている行や列よりも多くの行や列が必要な場合、現在の端までスクロールしてグリッドを拡張することができます。表示限界に達すると、自動的に追加の行や列が追加されます。逆にメディアアイテムで埋められていない行や列は、スクロールバック時に自動的に縮小され、整然かつ管理しやすいグリッドに整形されます"
    status: draft-needs-review
    basis: Existing alt text, heading and adjacent prose only; no visual inspection or new behavioral claim.
    placement:
      before_block: 3
      section: 行と列の管理
    source_url: https://help.screenberry.com/images/media-playback/animation/Adding-Rows-and-Columns.gif
    source_alt: Adding Rows And Columns
    text_coverage: not-independently-verified
  - id: ja-a644a12d4c-002
    title: Adding Media Items Matrix
    caption: Adding Media Items Matrix
    show: "Adding Media Items Matrix. Use the adjacent instructions as the content brief: マトリックスグリッドにメディアアイテムを追加するには、以下のいずれかの方法を使用します： ドラッグ＆ドロップ：Media Library、別のMedia Playerのプレイリスト、またはタイムラインから、メディアアイテムをグリッドに直接ドラッグします。コピー＆ペースト:Media Library、別のMedia Playerのプレイリスト、またはタイムラインでメディアアイテムを選択します。右クリックしてドロップダウンメニューからCopyを選択するか、Ctrl + C のキーボードショートカットを使用してこれらのアイテムをコピーします。メディアアイテムのシーケンスの開始グリッドセルを選択し、そこにアイテムを貼り付けます。これは、右クリックしてドロップダウンメニューからPasteを選択するか、Ctrl + V のショートカットを使用して行うことができます。 システムフォルダから直接ファイルをインポート：システムフォルダからファイル"
    status: draft-needs-review
    basis: Existing alt text, heading and adjacent prose only; no visual inspection or new behavioral claim.
    placement:
      before_block: 6
      section: メディアアイテムの追加
    source_url: https://help.screenberry.com/images/media-playback/animation/Adding-Media-Items-Matrix.gif
    source_alt: Adding Media Items Matrix
    text_coverage: not-independently-verified
  - id: ja-a644a12d4c-003
    title: Adding Media Items Matrix 2
    caption: Adding Media Items Matrix 2
    show: "Adding Media Items Matrix 2. Use the adjacent instructions as the content brief: システムフォルダから直接ファイルをインポート：システムフォルダからファイルをドラッグアンドドロップしてグリッドに追加するか、Ctrl + C（コピー）および Ctrl + V（貼り付け）のショートカットを使用してグリッドにコピー＆ペーストします。表示される Add Media File(s) ダイアログボックスで、メディアアイテムの変換品質を選択します。利用可能な選択肢は以下の通りです:MPEG-2 Max Quality 4:2:2 は、最高品質でエンコードされたMPEG-2ビデオ形式です。これは、より高い品質の維持を可能にするデフォルトのエンコードオプションです。ほとんどの場合、最適な品質とパフォーマンスを提供します。ただし、特定のメディアアイテムで再生の問題や映像の乱れが発生する場合は、MPEG-2 Good Quality エンコードを使用して再エンコードすることを検討してください。MPEG-2 Good Quality"
    status: draft-needs-review
    basis: Existing alt text, heading and adjacent prose only; no visual inspection or new behavioral claim.
    placement:
      before_block: 7
      section: メディアアイテムの追加
    source_url: https://help.screenberry.com/images/media-playback/animation/Adding-Media-Items-Matrix-2.gif
    source_alt: Adding Media Items Matrix 2
    text_coverage: not-independently-verified
  - id: ja-a644a12d4c-004
    title: Adding AUX Items Matrix
    caption: Adding AUX Items Matrix
    show: "Adding AUX Items Matrix. Use the adjacent instructions as the content brief: Media Playerが複数の映像入力を受け取る必要がある場合は、Media Playerノードの設定でNumber of AUX Inputsを指定してください。 これらの映像を受け取るためにMedia Playerノードを設定した後、マトリック型プレイリストに戻ります。AUXアイテムを追加したいグリッドセルで右クリックし、ドロップダウンメニューからAdd AUXを選択します。これにより、Select AUXダイアログボックスが開き、セルに挿入するAUXメディアソースを選択することができます。 マトリックスグリッド内のAUXアイテムは、アイテムが選択された時に表示される設定パネルを使用してカスタマイズすることができます。すぐに調整すべき設定の1つは、プレイリスト内で挿入された映像の再生時間を決定するDurationの値です。"
    status: draft-needs-review
    basis: Existing alt text, heading and adjacent prose only; no visual inspection or new behavioral claim.
    placement:
      before_block: 14
      section: AUXアイテムの追加
    source_url: https://help.screenberry.com/images/media-playback/animation/Adding-AUX-Items-Matrix.gif
    source_alt: Adding AUX Items Matrix
    text_coverage: not-independently-verified
