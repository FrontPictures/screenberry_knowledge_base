  - id: ja-86d7a43ce1-001
    title: Creating Playlists Matrix
    caption: Creating Playlists Matrix
    show: "Creating Playlists Matrix. Use the adjacent instructions as the content brief: 既存のフォルダ内にプレイリストを作成するには、フォルダを右クリックするか、選択してAddをクリックし、Add Matrix Playlistを選択します。フォルダの内容の表示/非表示を切り替えるには、そのフォルダの隣にある矢印アイコンをクリックします。 作成されたマトリックス型プレイリストは、Matrix1、Matrix2などと順番に名前が付けられます。"
    status: draft-needs-review
    basis: Existing alt text, heading and adjacent prose only; no visual inspection or new behavioral claim.
    placement:
      before_block: 5
      section: プレイリストの作成
    source_url: https://help.screenberry.com/images/media-playback/animation/Creating-Playlists-Matrix.gif
