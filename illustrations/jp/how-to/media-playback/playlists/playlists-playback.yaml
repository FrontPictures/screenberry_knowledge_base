figures:
  - id: ja-82916e424b-001
    title: Mediaplayercontrols280 1
    caption: Mediaplayercontrols280 1
    show: "Mediaplayercontrols280 1. Use the adjacent instructions as the content brief: メモ： Media Playerウィジェットの下部に表示されている再生制御コントロールは、現在アクティブなメディアアイテムに関連しています。同時に、アクティブなプレイリストを再生しながら、他のプレイリストを開いて編集することもできます。アクティブなプレイリストに切り替える必要がある場合は、プレイリストツリーまたはプレイリストエリアを右クリックしてReveal Active Itemを選択するか、A キーを押してください。 シークバーは再生の進行状況を表示し、メディアアイテムに対する追加の再生制御と設定を提供します。 Play Selected Itemボタンは、選択したメディアアイテムの再生を開始します。 Playボタンは、現在の再生位置から再生を開始します。 Pauseボタンは、現在の再生位置で再生を一時停止します。 Stopボタンは、再生を終了します。 Previous Itemボタンはプレイリスト内の前のメディアアイテムに"
    status: draft-needs-review
    basis: Existing alt text, heading and adjacent prose only; no visual inspection or new behavioral claim.
    placement:
      before_block: 4
      section: プレイリストの再生制御コントロール
    source_url: https://help.screenberry.com/images/media-playback/static/mediaplayercontrols280-1.png
    source_alt: Mediaplayercontrols280 1
    text_coverage: not-independently-verified
  - id: ja-82916e424b-002
    title: Two Modes Playlist Playback Controls
    caption: Two Modes Playlist Playback Controls
    show: "Two Modes Playlist Playback Controls. Use the adjacent instructions as the content brief: シークバーは再生の進行状況を表示し、メディアアイテムに対する追加の再生制御と設定を提供します。 Play Selected Itemボタンは、選択したメディアアイテムの再生を開始します。 Playボタンは、現在の再生位置から再生を開始します。 Pauseボタンは、現在の再生位置で再生を一時停止します。 Stopボタンは、再生を終了します。 Previous Itemボタンはプレイリスト内の前のメディアアイテムにジャンプします。 Next Itemボタンはプレイリスト内の次のメディアアイテムにジャンプします。 Lockボタンは、誤った操作を防ぐために再生制御コントロールを操作できなくします。メディアアイテムの全長と現在の再生時間（またはフレーム番号）情報を表示します。Volume ControlボタンはMedia Playerの出力の全体的な音量を調整します（音量制御を参照）。Color CorrectionボタンはMedia P"
    status: draft-needs-review
    basis: Existing alt text, heading and adjacent prose only; no visual inspection or new behavioral claim.
    placement:
