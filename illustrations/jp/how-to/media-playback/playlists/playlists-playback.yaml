    title: Revealing Currently Playing
    caption: Revealing Currently Playing
    show: "Revealing Currently Playing. Use the adjacent instructions as the content brief: 現在再生中のアイテムは、プレイリストツリーやプレイリストエリアを右クリックし、Reveal Active Itemを選択するか、A キーを押すことで素早く見つけることができます。"
    status: draft-needs-review
    basis: Existing alt text, heading and adjacent prose only; no visual inspection or new behavioral claim.
