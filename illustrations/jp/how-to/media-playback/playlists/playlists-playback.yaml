    text_coverage: not-independently-verified
  - id: ja-82916e424b-008
    title: Loop Group
    caption: Loop Group
    show: "Loop Group. Use the adjacent instructions as the content brief: メディアアイテムのグループをループ再生するには、プレイリストで複数のメディアアイテムの選択して右クリックし、ドロップダウンメニューからLoop Through Selected Itemsを選択するか、Shift + L キーを押します。 ループグループが作成されると、ループの開始と終了を示す特別なLoop StartアイテムとLoop Endアイテムが、グループのメディアアイテムの前後に追加されます。これらのアイテムをプレイリスト内で移動して、ループグループに含めるメディアアイテムの数を増減させることができます。"
    status: draft-needs-review
    basis: Existing alt text, heading and adjacent prose only; no visual inspection or new behavioral claim.
    placement:
      before_block: 29
      section: メディアアイテムのループグループ
    source_url: https://help.screenberry.com/images/media-playback/animation/Loop-Group.gif
    source_alt: Loop Group
    text_coverage: not-independently-verified
