  - id: ja-82916e424b-010
    title: Presentation Clicker On
    caption: Presentation Clicker On
    show: "Presentation Clicker On. Use the adjacent instructions as the content brief: プレゼンテーションクリッカーを使用すると、Screenberryを使ってプレゼンテーションを便利に行うことができます。これにより、プレゼンターは遠隔でプレイリストの再生を制御することができます。プレゼンテーションクリッカーのNext（右矢印） またはPrevious（左矢印） ボタンを押すと、プレゼンテーションはそれぞれ次のメディアアイテムに進み、再生が開始されます。 プレゼンテーションクリッカーを使用したScreenberryの再生制御機能を行うには、Preferences > Generalを開き、Presentation Clickerのチェックボックスを選択してください。 また、プレイリストの方でもプレゼンテーションクリッカーによる再生制御を有効化必要があります。プレイリストの設定 - プレゼンテーションクリッカーによる再生制御を参照してください。"
    status: draft-needs-review
    basis: Existing alt text, heading and adjacent prose only; no visual inspection or new behavioral claim.
    placement:
      before_block: 33
      section: プレゼンテーションクリッカーでの再生制御
    source_url: https://help.screenberry.com/images/media-playback/animation/Presentation-Clicker-On.gif
    source_alt: Presentation Clicker On
    text_coverage: not-independently-verified
