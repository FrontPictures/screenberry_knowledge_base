  - id: ja-82916e424b-003
    title: Mediaplayerbar280
    caption: Mediaplayerbar280
    show: "Mediaplayerbar280. Use the adjacent instructions as the content brief: Screenberryでは、シークバーは現在アクティブなメディアアイテムの再生情報を表示します。 再生ヘッドは再生の進行状況を示します。ユーザーは再生ヘッドをドラッグして再生位置を変更することができます。再生はその位置にあるフレームから続行されます。再生時間表示はメディアアイテムの再生時間（またはフレーム番号）情報を表示します。開始点スライダーの位置は再生の最初のフレームを定義します。終了点スライダーの位置は再生の最後のフレームを定義します。時間目盛りは時間のスケールを表示します。オーディオピークはメディアアイテムのアクティブなオーディオトラック（存在する場合）の波形を表示します。"
    status: draft-needs-review
    basis: Existing alt text, heading and adjacent prose only; no visual inspection or new behavioral claim.
    placement:
      before_block: 8
      section: シークバー
    source_url: https://help.screenberry.com/images/media-playback/static/mediaplayerbar280.png
    source_alt: Mediaplayerbar280
    text_coverage: not-independently-verified
  - id: ja-82916e424b-004
    title: Seek Bar Context Menu
    caption: Seek Bar Context Menu
    show: "Seek Bar Context Menu. Use the adjacent instructions as the content brief: 再生ヘッドは再生の進行状況を示します。ユーザーは再生ヘッドをドラッグして再生位置を変更することができます。再生はその位置にあるフレームから続行されます。再生時間表示はメディアアイテムの再生時間（またはフレーム番号）情報を表示します。開始点スライダーの位置は再生の最初のフレームを定義します。終了点スライダーの位置は再生の最後のフレームを定義します。時間目盛りは時間のスケールを表示します。オーディオピークはメディアアイテムのアクティブなオーディオトラック（存在する場合）の波形を表示します。 シークバーを右クリックすると関連するコンテキストメニューが表示されます： Jump to Frameは、再生ヘッドを指定されたフレームの位置に変更します。Set In Pointは、現在のカーソル位置に再生の最初のフレームを設定します。Set Out Pointは、現在のカーソル位置に再生の最後のフレームを設定します。Reset In/Out P"
    status: draft-needs-review
    basis: Existing alt text, heading and adjacent prose only; no visual inspection or new behavioral claim.
    placement:
      before_block: 10
      section: シークバー
    source_url: https://help.screenberry.com/images/media-playback/animation/Seek-Bar-Context-Menu.gif
    source_alt: Seek Bar Context Menu
    text_coverage: not-independently-verified
  - id: ja-82916e424b-005
    title: Duration Display
    caption: Duration Display
    show: "Duration Display. Use the adjacent instructions as the content brief: 再生時間表示を右クリックすると、3つの異なる表示モードの切り替えが可能です。 現在の再生時間/メディアアイテムの全長 (hh:mm:ss)。現在のフレーム数/メディアアイテムの全フレーム数。メディアアイテムの残り再生時間 (hh:mm:ss)。"
    status: draft-needs-review
    basis: Existing alt text, heading and adjacent prose only; no visual inspection or new behavioral claim.
    placement:
      before_block: 14
      section: 再生時間表示の切り替え
    source_url: https://help.screenberry.com/images/media-playback/animation/Duration-Display.gif
    source_alt: Duration Display
    text_coverage: not-independently-verified
  - id: ja-82916e424b-006
    title: Media Items Playback
    caption: Media Items Playback
    show: "Media Items Playback. Use the adjacent instructions as the content brief: 再生ヘッドの現在位置から再生を開始するには、Playボタンを押します。プレイリストでメディアアイテムを選択し、Play Selected Itemボタンを押します。Alt キーを押しながら（マウスポインタはオレンジ色の再生シンボルに変わります）、プレイリスト内のメディアアイテムをクリックします。 最後の2つのオプションは、指定したメディアアイテムに再生を即座に切り替える必要がある場合によく使用されます。 プレイリスト内のメディアアイテムは、左から右へ、上から下へ順番に再生されます。再生ヘッドがプレイリスト内の最後のメディアアイテムの最後のフレームに到達すると、再生位置はプレイリスト内の最初のメディアアイテムの最初のフレームに移動します。"
    status: draft-needs-review
    basis: Existing alt text, heading and adjacent prose only; no visual inspection or new behavioral claim.
    placement:
      before_block: 20
      section: メディアアイテムの再生
    source_url: https://help.screenberry.com/images/media-playback/animation/Media-Items-Playback.gif
    source_alt: Media Items Playback
    text_coverage: not-independently-verified
