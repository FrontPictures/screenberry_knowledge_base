  - id: ja-939fbf3f32-007
    title: Indication Playback
    caption: Indication Playback
    show: "Indication Playback. Use the adjacent instructions as the content brief: プレイリストが現在再生中、一時停止中、または停止中の場合、対応するアイコンがプレイリスト名の横に表示されます。現在アクティブなプレイリストがフォルダの一部であり、フォルダの内容が折りたたまれている場合、これらのアイコンはフォルダアイコンに置き換えられます。"
    status: draft-needs-review
    basis: Existing alt text, heading and adjacent prose only; no visual inspection or new behavioral claim.
    placement:
