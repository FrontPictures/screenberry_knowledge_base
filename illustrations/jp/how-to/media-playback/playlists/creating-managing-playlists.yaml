  - id: ja-939fbf3f32-001
    title: Adding Playlists
    caption: Adding Playlists
    show: "Adding Playlists. Use the adjacent instructions as the content brief: 新しいプレイリストを作成するには、ナビゲーションパネルの空白のエリアで右クリックするか、下部のツールバーのAddボタンをクリックし、ドロップダウンメニューからAdd Playlistを選択します。 既存のフォルダに新しいプレイリストを追加するには、フォルダを選択し、下部ツールバーのAddボタンをクリックするか、フォルダ名を右クリックしてドロップダウンメニューからAdd Playlistを選択してください。"
    status: draft-needs-review
    basis: Existing alt text, heading and adjacent prose only; no visual inspection or new behavioral claim.
    placement:
      before_block: 4
      section: プレイリストの追加
    source_url: https://help.screenberry.com/images/media-playback/animation/Adding-Playlists.gif
    source_alt: Adding Playlists
    text_coverage: not-independently-verified
  - id: ja-939fbf3f32-002
    title: Adding Playlists2
    caption: Adding Playlists2
    show: "Adding Playlists2. Use the adjacent instructions as the content brief: 既存のフォルダに新しいプレイリストを追加するには、フォルダを選択し、下部ツールバーのAddボタンをクリックするか、フォルダ名を右クリックしてドロップダウンメニューからAdd Playlistを選択してください。 フォルダの内容を表示/非表示にするには、フォルダアイコンの隣にある矢印アイコンを押してください。"
    status: draft-needs-review
    basis: Existing alt text, heading and adjacent prose only; no visual inspection or new behavioral claim.
