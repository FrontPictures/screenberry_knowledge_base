  - id: ja-60ba980401-001
    title: Adding Media Items To Playlists
    caption: Adding Media Items To Playlists
    show: "Adding Media Items To Playlists. Use the adjacent instructions as the content brief: Media Libraryからメディアアイテムを追加するには： プレイリストの内容をMedia Playerウィジェットで表示するには、その名前をクリックします。メディアアイテムをMedia Libraryからプレイリストのコンテンツエリアにドラッグアンドドロップするか、Media Libraryでメディアアイテムを選択し、この操作を実行するためにコピー（Ctrl + C）および貼り付け（Ctrl + V）を使用します。 メディアアイテムを直接追加する方法："
    status: draft-needs-review
    basis: Existing alt text, heading and adjacent prose only; no visual inspection or new behavioral claim.
    placement:
      before_block: 6
      section: メディアアイテムをプレイリストに追加
    source_url: https://help.screenberry.com/images/media-playback/animation/Adding-Media-Items-to-Playlists.gif
    source_alt: Adding Media Items To Playlists
    text_coverage: not-independently-verified
  - id: ja-60ba980401-002
    title: Adding Media Items To Playlists2
    caption: Adding Media Items To Playlists2
    show: "Adding Media Items To Playlists2. Use the adjacent instructions as the content brief: メディアアイテムを直接追加する方法： プレイリストの内容を表示するために、Media Playerウィジェットでその名前をクリックしてください。システムフォルダからファイルをドラッグアンドドロップするか、またはコピー（Ctrl + C）および貼り付け（Ctrl + V）操作を使用してください。表示されるAdd Media File(s) ダイアログボックスで、アップロードされるメディアアイテムの品質（Good Quality 4:2:2、Max Quality 4:2:2、Optimal Quality 4:2:0）を選択し、必要に応じてリサイズするかどうか選択してから、Addボタンを押してください。 メモ： プレイリストにメディアアイテムが直接追加されると、Uploaded_on_YYYY-MM-DD という名前のMedia Libraryフォルダに自動的に追加されます。"
    status: draft-needs-review
    basis: Existing alt text, heading and adjacent prose only; no visual inspection or new behavioral claim.
    placement:
