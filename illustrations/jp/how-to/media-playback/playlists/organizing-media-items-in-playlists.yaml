  - id: ja-60ba980401-004
    title: Renaming Media Items
    caption: Renaming Media Items
    show: "Renaming Media Items. Use the adjacent instructions as the content brief: Media Libraryでメディアアイテムの名前を変更する方法には2つあります。メディアアイテムの名前を変更すると、すべての既存のプレイリストでその名前が一斉に変更されます。 特定のプレイリスト内のメディアアイテムの名前を変更するには、右クリックしてドロップダウンメニューからSettingsを選択し、Title欄に新しい名前を入力してください。 メモ： 現在、既存の Media Player ウィジェットのいずれかで再生中のメディアアイテムは、名前を変更することができません。"
    status: draft-needs-review
    basis: Existing alt text, heading and adjacent prose only; no visual inspection or new behavioral claim.
    placement:
      before_block: 16
      section: メディアアイテム名の変更
    source_url: https://help.screenberry.com/images/media-playback/animation/Renaming-Media-Items.gif
    source_alt: Renaming Media Items
    text_coverage: not-independently-verified
  - id: ja-60ba980401-005
    title: Deleting Media Items
    caption: Deleting Media Items
    show: "Deleting Media Items. Use the adjacent instructions as the content brief: プレイリストからメディアアイテムまたは複数のメディアアイテムを削除するには、それらを右クリックしてドロップダウンメニューからDeleteを選択するか、Del キーを押してください。 既存のすべてのプレイリスト方メディアアイテムを削除する場合は、Media Libraryからメディアアイテムを削除します。プレイリスト内のメディアアイテムまたは複数のメディアアイテムを右クリックし、ドロップダウンメニューからRemove Item from Media Libraryを選択するか、Shift + Del キーを押してください。"
    status: draft-needs-review
    basis: Existing alt text, heading and adjacent prose only; no visual inspection or new behavioral claim.
    placement:
      before_block: 19
      section: メディアアイテムの削除
    source_url: https://help.screenberry.com/images/media-playback/animation/Deleting-Media-Items.gif
    source_alt: Deleting Media Items
    text_coverage: not-independently-verified
  - id: ja-60ba980401-006
    title: Deleting Media Items2
    caption: Deleting Media Items2
    show: "Deleting Media Items2. Use the adjacent instructions as the content brief: 既存のすべてのプレイリスト方メディアアイテムを削除する場合は、Media Libraryからメディアアイテムを削除します。プレイリスト内のメディアアイテムまたは複数のメディアアイテムを右クリックし、ドロップダウンメニューからRemove Item from Media Libraryを選択するか、Shift + Del キーを押してください。 メディアアイテムがMedial Libraryから削除され、再生ができなくなったことを示すために、既存のプレイリスト内のすべての該当メディアアイテムのサムネイルに取り消し線が引かれます。同じ名前のメディアアイテムが後でMedia Libraryに追加されると、同名のメディアアイテムのすべてのサムネイルがアクティブな状態に戻り、再びMedia Playerのプレイリストで再生可能になります。"
    status: draft-needs-review
    basis: Existing alt text, heading and adjacent prose only; no visual inspection or new behavioral claim.
    placement:
      before_block: 21
      section: メディアアイテムの削除
    source_url: https://help.screenberry.com/images/media-playback/animation/Deleting-Media-Items2.gif
    source_alt: Deleting Media Items2
    text_coverage: not-independently-verified
  - id: ja-60ba980401-007
    title: Arranging Media Items
    caption: Arranging Media Items
    show: "Arranging Media Items. Use the adjacent instructions as the content brief: メディアアイテムは、ドラッグアンドドロップやコピー（Ctrl + C）、切り取り（Ctrl + X）、貼り付け（Ctrl + V）コマンドを使用して整理することができます。 同じプレイリスト内でメディアアイテムの再生順序を変更することができます。同じMedia Playerウィジェットの異なるプレイリスト間でコピーや移動ができます。異なるMedia Playerウィジェットのプレイリスト間でもコピーや移動ができます。 メディアアイテムがプレイリスト間でコピーまたは移動されると、再生設定が保持されます。"
    status: draft-needs-review
    basis: Existing alt text, heading and adjacent prose only; no visual inspection or new behavioral claim.
    placement:
      before_block: 24
      section: メディアアイテムの整理
    source_url: https://help.screenberry.com/images/media-playback/animation/Arranging-Media-Items.gif
    source_alt: Arranging Media Items
    text_coverage: not-independently-verified
  - id: ja-60ba980401-008
    title: Arranging Media Items2
    caption: Arranging Media Items2
    show: "Arranging Media Items2. Use the adjacent instructions as the content brief: メディアアイテムがプレイリスト間でコピーまたは移動されると、再生設定が保持されます。 さらに、テキストエディタにメディアアイテムのデータと再生設定を コピー（Ctrl + C）および 貼り付け（Ctrl + V）することもできます。 プレイリスト内のメディアアイテムを視覚的に識別しやすくするために、カラータグを割り当てることができます。プレイリスト内の一つまたは複数のメディアアイテムを選択し、右クリックして表示されるドロップダウンメニュー内のSet Color Tagサブメニューから、タグの色を選択してください。"
    status: draft-needs-review
    basis: Existing alt text, heading and adjacent prose only; no visual inspection or new behavioral claim.
    placement:
      before_block: 26
      section: メディアアイテムの整理
    source_url: https://help.screenberry.com/images/media-playback/animation/Arranging-Media-Items2.gif
    source_alt: Arranging Media Items2
    text_coverage: not-independently-verified
