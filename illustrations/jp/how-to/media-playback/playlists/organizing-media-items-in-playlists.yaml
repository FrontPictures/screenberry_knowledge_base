  - id: ja-60ba980401-010
    title: Sorting Media Items
    caption: Sorting Media Items
    show: "Sorting Media Items. Use the adjacent instructions as the content brief: メディアアイテムは、プレイリスト内で選択したアイテムを右クリックし、ドロップダウンメニューからSort Byサブメニューを選択することで並べ替えができます。フレーム数、名前、タイトル、カラータグ、そしてシャッフルなど、いくつかの並べ替え方法があります。"
    status: draft-needs-review
    basis: Existing alt text, heading and adjacent prose only; no visual inspection or new behavioral claim.
    placement:
      before_block: 29
      section: メディアアイテムの並べ替え
    source_url: https://help.screenberry.com/images/media-playback/animation/Sorting-Media-Items.gif
    source_alt: Sorting Media Items
    text_coverage: not-independently-verified
  - id: ja-60ba980401-011
    title: Adjusting Media Item Thumbnails
    caption: Adjusting Media Item Thumbnails
    show: "Adjusting Media Item Thumbnails. Use the adjacent instructions as the content brief: クリックすることでアクセスできるサムネイルメニューは、以下のオプションを提供しています： サムネイルの表示方法には3つの異なるタイプがあります：正方形 、1 x 1（デフォルト）横 、ランドスケープ向けの2 x 1縦 、ポートレート向けの1 x 2サムネイル画像の引き延ばし方法も選択できます。Aspect Fitチェックボックスが選択されている場合（デフォルト）、中央に配置されたサムネイル画像は自動的にクロップされ、短い寸法に合わせてサムネイルの枠が埋められます。Aspect Fitチェックボックスが選択されていない場合、サムネイル画像は長い寸法に合わせて自動的にサムネイルの枠にフィットします。メディアアイテムのタイトル（名前）の表示/非表示は、Hide Titlesチェックボックスで切り替えることができます。"
    status: draft-needs-review
    basis: Existing alt text, heading and adjacent prose only; no visual inspection or new behavioral claim.
    placement:
      before_block: 34
      section: メディアアイテムのサムネイル
    source_url: https://help.screenberry.com/images/media-playback/animation/Adjusting-Media-Item-Thumbnails.gif
