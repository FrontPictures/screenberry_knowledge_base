    caption: Adding Media Items To Playlists3
    show: "Adding Media Items To Playlists3. Use the adjacent instructions as the content brief: メモ： プレイリストにメディアアイテムが直接追加されると、Uploaded_on_YYYY-MM-DD という名前のMedia Libraryフォルダに自動的に追加されます。 同じ名前のメディアアイテムが既に存在する場合、ユーザーは新しいメディアアイテムを追加するか、既存のアイテムを上書きするかの選択肢が表示されます。"
