  - id: ja-f55e2a5fb4-001
    title: Adding Timelines
    caption: Adding Timelines
    show: "Adding Timelines. Use the adjacent instructions as the content brief: 新しいタイムラインを作成するには、Playlist and Timeline Listパネルの空白の領域を右クリックするか、下部のツールバーのAddボタンをクリックして、ドロップダウンメニューからAdd Timelineを選択します。 既存のフォルダ内にタイムラインを作成するには、フォルダを右クリックするか、選択して下部のツールバーのAddボタンをクリックし、ドロップダウンメニューからAdd Timelineを選択します。"
    status: draft-needs-review
    basis: Existing alt text, heading and adjacent prose only; no visual inspection or new behavioral claim.
    placement:
      before_block: 5
      section: タイムラインの追加
    source_url: https://help.screenberry.com/images/media-playback/animation/Adding-Timelines.gif
    source_alt: Adding Timelines
    text_coverage: not-independently-verified
  - id: ja-f55e2a5fb4-002
    title: Adding Timelines 2
    caption: Adding Timelines 2
    show: "Adding Timelines 2. Use the adjacent instructions as the content brief: 既存のフォルダ内にタイムラインを作成するには、フォルダを右クリックするか、選択して下部のツールバーのAddボタンをクリックし、ドロップダウンメニューからAdd Timelineを選択します。 フォルダの内容を表示または非表示にするには、フォルダアイコンの隣にある矢印アイコンをクリックしてください。"
    status: draft-needs-review
