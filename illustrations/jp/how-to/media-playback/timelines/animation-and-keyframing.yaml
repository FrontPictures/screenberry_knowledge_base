  - id: ja-b6ec990dd1-005
    title: Animation And Keyframing 5
    caption: Animation And Keyframing 5
    show: "Animation And Keyframing 5. Use the adjacent instructions as the content brief: タイムラインパネルでキーフレームを選択するには、メディアアイテムのパラメータの展開されたリスト内のアイコンをクリックします。選択されたキーフレームは黄色でハイライト表示され、選択されていないキーフレームはグレーのままです。Ctrl キーを押しながら対応するアイコンをクリックすることで、複数のキーフレームを一度に選択することができます。 選択されたキーフレームの位置（時間）を調整するには、タイムライントラック上の移動先にドラッグします。移動する際に、選択されたキーフレーム同士の相対的な位置関係は変わりません。 キーフレームを1つのメディアアイテムから別のメディアアイテムにコピーするには、以下の手順を実行します："
    status: draft-needs-review
    basis: Existing alt text, heading and adjacent prose only; no visual inspection or new behavioral claim.
    placement:
