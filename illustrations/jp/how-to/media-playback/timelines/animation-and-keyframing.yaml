  - id: ja-b6ec990dd1-003
    title: Animation And Keyframing 3 1
    caption: Animation And Keyframing 3 1
    show: "Animation And Keyframing 3 1. Use the adjacent instructions as the content brief: リアルタイムで再生中に再生ヘッドが動いている間に、キーフレームを設定することもできます。この場合、選択したパラメータの値が変更されると、キーフレームが自動的に再生ヘッドの現在位置に作成されます。 複数のキーフレームがパラメータに追加されると、Settingsパネル内のパラメータ名の隣にある菱形アイコンの両側に、キーフレームのナビゲーション矢印が表示されます。これらの矢印を使用して、既存のキーフレームに移動し、さらなる調整を行うことができます。キーフレームが選択されると、菱形アイコンの色が青に変わります。"
    status: draft-needs-review
    basis: Existing alt text, heading and adjacent prose only; no visual inspection or new behavioral claim.
    placement:
      before_block: 10
      section: アニメーションとキーフレーム
    source_url: https://help.screenberry.com/images/media-playback/animation/Animation-and-Keyframing-3-1.gif
    source_alt: Animation And Keyframing 3 1
    text_coverage: not-independently-verified
  - id: ja-b6ec990dd1-004
    title: Animation And Keyframing 4
    caption: Animation And Keyframing 4
    show: "Animation And Keyframing 4. Use the adjacent instructions as the content brief: 複数のキーフレームがパラメータに追加されると、Settingsパネル内のパラメータ名の隣にある菱形アイコンの両側に、キーフレームのナビゲーション矢印が表示されます。これらの矢印を使用して、既存のキーフレームに移動し、さらなる調整を行うことができます。キーフレームが選択されると、菱形アイコンの色が青に変わります。 また、タイムラインパネルでキーフレーム間を移動する場合は、メディアアイテムのパラメータリストを展開し、再生ヘッドを移動することで行うことができます。再生ヘッドは自動的に既存のキーフレームにスナップされます。さらに、タイムライントラック上の任意の場所で右クリックし、ドロップダウンメニューからJump to… > Next Keyframe（またはPrevious Keyframe）を選択することで、キーフレーム間を移動することもできます。 タイムラインパネルでキーフレームを選択するには、メディアアイテムのパラメータの展開さ"
    status: draft-needs-review
    basis: Existing alt text, heading and adjacent prose only; no visual inspection or new behavioral claim.
    placement:
      before_block: 12
      section: アニメーションとキーフレーム
    source_url: https://help.screenberry.com/images/media-playback/animation/Animation-and-Keyframing-4.gif
