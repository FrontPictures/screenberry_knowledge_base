  - id: ja-b6ec990dd1-006
    title: Animation And Keyframing 6
    caption: Animation And Keyframing 6
    show: "Animation And Keyframing 6. Use the adjacent instructions as the content brief: キーフレームを1つのメディアアイテムから別のメディアアイテムにコピーするには、以下の手順を実行します： キーフレームをコピーしたいメディアアイテムを右クリックし、ドロップダウンメニューからCopyを選択します。または、メディアアイテムを選択し、Ctrl + C のキーボードショートカットを使用することもできます。コピー先のメディアアイテムを右クリックし、ドロップダウンメニューからPaste Propertiesを選択するか、Ctrl + Shift + V のキーボードショートカットを使用します。表示されるダイアログボックスで、Animation Keysチェックボックスが選択されていることを確認します。OKをクリックして、コピーしたキーフレームをターゲットメディアアイテムに適用します。 もしキーフレームが不要になった場合は、メディアアイテムのパラメータの展開リストでそのアイコンを右クリックし、ドロップダウンメニューからDele"
    status: draft-needs-review
    basis: Existing alt text, heading and adjacent prose only; no visual inspection or new behavioral claim.
