figures:
  - id: ja-b6ec990dd1-001
    title: Animation And Keyframing
    caption: Animation And Keyframing
    show: "Animation And Keyframing. Use the adjacent instructions as the content brief: アニメーションを付けたいパラメーターを含むタイムライン上のメディアアイテムを選択します。再生ヘッドをキーフレームを追加したい時点に移動します。Settingsパネルで、パラメーターをアニメーション化するために、その名前の隣にある菱形のアイコンをクリックして指定します。パラメータ入力欄に設定したい値を入力します。 タイムライン上のメディアアイテムにキーフレームを設定すると、菱のアイコンがメディアアイテムの名前の右端に表示されます。このアイコンをクリックすると、設定されたキーフレームを持つメディアアイテムのパラメータのリストが展開または折りたたまれます。 もしキーフレームがメディアアイテムの長さを超える位置に配置されている場合、パラメーターバーの対応する側にあるマークがその存在と位置を示します。"
    status: draft-needs-review
    basis: Existing alt text, heading and adjacent prose only; no visual inspection or new behavioral claim.
    placement:
      before_block: 8
      section: アニメーションとキーフレーム
    source_url: https://help.screenberry.com/images/media-playback/animation/Animation-and-Keyframing.gif
