  - id: ja-b6ec990dd1-008
    title: Keyframing Of Data Items
    caption: Keyframing Of Data Items
    show: "Keyframing Of Data Items. Use the adjacent instructions as the content brief: データアイテムのキーフレームは、他のメディアアイテムと同様の手順で手動で設定することができます。また、レコーディング機能を使用して自動的にキーフレームを設定することもできます。この機能を有効にするには、データアイテムの設定でRecordチェックボックスを選択します。有効にした場合、データアイテムの値パラメータに対するすべての変更は、再生時に自動的にキーフレームとして記録されます。 メモ： レコーディングを終えたら、次にデータアイテムを再生する際に、以前に設定されたキーフレームが消去されないように、Recordチェックボックスを選択解除してレコーディング機能を無効にしてください。"
    status: draft-needs-review
    basis: Existing alt text, heading and adjacent prose only; no visual inspection or new behavioral claim.
    placement:
      before_block: 21
      section: データアイテムのキーフレーム化
    source_url: https://help.screenberry.com/images/media-playback/animation/Keyframing-of-Data-Items.gif
    source_alt: Keyframing Of Data Items
    text_coverage: not-independently-verified
