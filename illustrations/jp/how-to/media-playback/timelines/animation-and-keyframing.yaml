    text_coverage: not-independently-verified
  - id: ja-b6ec990dd1-002
    title: Animation And Keyframing 2
    caption: Animation And Keyframing 2
    show: "Animation And Keyframing 2. Use the adjacent instructions as the content brief: もしキーフレームがメディアアイテムの長さを超える位置に配置されている場合、パラメーターバーの対応する側にあるマークがその存在と位置を示します。 リアルタイムで再生中に再生ヘッドが動いている間に、キーフレームを設定することもできます。この場合、選択したパラメータの値が変更されると、キーフレームが自動的に再生ヘッドの現在位置に作成されます。"
    status: draft-needs-review
    basis: Existing alt text, heading and adjacent prose only; no visual inspection or new behavioral claim.
    placement:
      before_block: 9
      section: アニメーションとキーフレーム
