  - id: ja-b6ec990dd1-007
    title: Animation And Keyframing 7
    caption: Animation And Keyframing 7
    show: "Animation And Keyframing 7. Use the adjacent instructions as the content brief: もしキーフレームが不要になった場合は、メディアアイテムのパラメータの展開リストでそのアイコンを右クリックし、ドロップダウンメニューからDelete Keyframesを選択することで簡単に削除することができます。"
    status: draft-needs-review
