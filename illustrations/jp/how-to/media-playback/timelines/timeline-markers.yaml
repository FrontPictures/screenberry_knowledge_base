  - id: ja-bb08135794-002
    title: Adding And Managing Markers 2 1
    caption: Adding And Managing Markers 2 1
    show: "Adding And Managing Markers 2 1. Use the adjacent instructions as the content brief: マーカーの名前を変更するには、マーカーを右クリックしてドロップダウンメニューからEditを選択します。表示されるダイアログボックスで、Name欄にたらしい名前を入力してください。 マーカーを移動するには、時間目盛り上でマーカーをドラッグするか、より正確な位置調整のために、マーカーを右クリックしてドロップダウンメニューからEditを選択します。表示されるダイアログボックスで、Position欄に目的の値を入力してください。"
    status: draft-needs-review
