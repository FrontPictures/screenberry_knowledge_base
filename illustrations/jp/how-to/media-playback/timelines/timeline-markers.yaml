    show: "Adding And Managing Markers 4 1. Use the adjacent instructions as the content brief: マーカーは有効または無効にできます。マーカーを無効にするには、マーカーを右クリックし、ドロップダウンメニューでEnabledチェックボックスを外してください。 マーカーを削除するには、マーカーを右クリックして、ドロップダウンメニューからDeleteを選択します。"
