  - id: ja-bb08135794-006
    title: Jump Marker
    caption: Jump Marker
    show: "Jump Marker. Use the adjacent instructions as the content brief: ジャンプマーカーは、タイムライン上の特定の位置、特定の時間、または別のマーカーへ再生ヘッドを移動させることができます。ジャンプマーカーを設定するには、以下の手順に従ってください。 マーカーを追加するか、マーカーを右クリックしてドロップダウンメニューからEditを選択して、Marker Propertiesダイアログボックスを開きます。Jump ToドロップダウンでTimeまたはMarkerを選択します。Timeを選択した場合は、Time欄に目的の時間を入力します。Markerを選択した場合は、Markerドロップダウンで目的のマーカー名を選択します。"
    status: draft-needs-review
    basis: Existing alt text, heading and adjacent prose only; no visual inspection or new behavioral claim.
    placement:
      before_block: 17
      section: ジャンプマーカー
    source_url: https://help.screenberry.com/images/media-playback/animation/Jump-Marker.gif
    source_alt: Jump Marker
    text_coverage: not-independently-verified
  - id: ja-bb08135794-007
    title: Timecode Marker
    caption: Timecode Marker
    show: "Timecode Marker. Use the adjacent instructions as the content brief: タイムコードマーカーは、受信したタイムコードの値がマーカーに設定された時間値と一致した時に、タイムラインの再生を開始する位置を設定します。タイムコードマーカーが機能するためには、以下の条件を満たす必要があります： Media Playerノードは、タイムコードを受信する必要があります。Node Graph で、タイムコードリンクをMedia PlayerノードのTimecode In入力ピンに接続します。Media Player は、タイムコードを受信するように設定する必要があります。Media Player の一般的なタイムコード設定で、Accept (Timecode)チェックボックスを選択し、Follow (Timecode)チェックボックスを選択解除します。なお、Follow (Timecode)チェックボックスが選択されている場合、タイムラインはタイムコードに従って自動的に再生されます。タイムラインは、タイムコードを受"
    status: draft-needs-review
    basis: Existing alt text, heading and adjacent prose only; no visual inspection or new behavioral claim.
    placement:
      before_block: 20
      section: タイムコードマーカー
    source_url: https://help.screenberry.com/images/media-playback/animation/Timecode-Marker.gif
    source_alt: Timecode Marker
    text_coverage: not-independently-verified
  - id: ja-bb08135794-008
    title: Timecode Marker 2
    caption: Timecode Marker 2
    show: "Timecode Marker 2. Use the adjacent instructions as the content brief: もしタイムラインの再生がタイムコードマーカーで始まる必要があるが、タイムコードの値とは異なる時間で始める必要がある場合は、Timecode Offset機能を使用してください。タイムライン名を右クリックし、ドロップダウンメニューからPreferencesを選択します。表示されるダイアログボックスで、Timecode Offset欄に希望する値を入力してください。例えば、タイムライン上でタイムコードマーカーが 5 分に設定されているが、再生を開始する時点はタイムコードの値が 15 分に到達した時である場合、Timecode Offsetを 10 分に設定してください。"
    status: draft-needs-review
    basis: Existing alt text, heading and adjacent prose only; no visual inspection or new behavioral claim.
    placement:
      before_block: 21
      section: タイムコードマーカー
    source_url: https://help.screenberry.com/images/media-playback/animation/Timecode-Marker-2.gif
    source_alt: Timecode Marker 2
    text_coverage: not-independently-verified
  - id: ja-bb08135794-009
    title: Using Markers For Automation
    caption: Using Markers For Automation
    show: "Using Markers For Automation. Use the adjacent instructions as the content brief: 例えば、On Item Startedノードは、指定したマーカーに再生ヘッドが到達した時のイベントを監視するように設定することができます。これにより、他の処理を開始するためのトリガーを作成することができます。以下の手順に従ってください。 ノードグラフでOn Item Startedノードを選択します。ノードの設定で：Media Playerに監視したいメディアプレーヤーを選択します。Item Selection CriteriaでTimeline Control Pointを選択します。Control Point Nameにマーカーの名前を入力します。 同様にこのイベントは、タイムラインの再生を他のMedia Playerのプレイリストと同期するために使用することができます。このためには、以下の手順を実行します。"
    status: draft-needs-review
    basis: Existing alt text, heading and adjacent prose only; no visual inspection or new behavioral claim.
    placement:
      before_block: 25
      section: マーカーを使用した自動化
    source_url: https://help.screenberry.com/images/media-playback/animation/Using-Markers-for-Automation.gif
    source_alt: Using Markers For Automation
    text_coverage: not-independently-verified
  - id: ja-bb08135794-010
    title: Using Markers For Automation 2 1
    caption: Using Markers For Automation 2 1
    show: "Using Markers For Automation 2 1. Use the adjacent instructions as the content brief: 同様にこのイベントは、タイムラインの再生を他のMedia Playerのプレイリストと同期するために使用することができます。このためには、以下の手順を実行します。 ノードグラフで、ソースとなるMedia PlayerのOutput EventsピンをターゲットになるMedia PlayerのEventsピンに接続します。ターゲットになるMedia Playerに切り替えて、使用するプレイリストを選択し、イベントにマップするメディアアイテムを右クリックします。ドロップダウンメニューからMap Item to Eventを選択して、メディアアイテムがイベントのマッピングを待っている状態にします。ソースとなるMedia Playerのタイムラインに切り替えて、目的のマーカーの直前に再生ヘッドを位置させ、再生を開始します。再生ヘッドがタイムライン上のマーカーを通過すると、このイベントはターゲットのMedia Playerのプレイリスト内"
    status: draft-needs-review
