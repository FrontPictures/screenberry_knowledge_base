  - id: ja-bb08135794-001
    title: Adding And Managing Markers 1
    caption: Adding And Managing Markers 1
    show: "Adding And Managing Markers 1. Use the adjacent instructions as the content brief: マーカーを追加するには、以下のいずれかの方法を行ってください： 時間目盛りの上で右クリックし、ドロップダウンメニューから追加したいマーカーの種類を選択します。再生ヘッドを追加したい位置に移動し、上部ツールバーにある対応するマーカーアイコンのボタンをクリックします。 マーカーの名前を変更するには、マーカーを右クリックしてドロップダウンメニューからEditを選択します。表示されるダイアログボックスで、Name欄にたらしい名前を入力してください。"
    status: draft-needs-review
    basis: Existing alt text, heading and adjacent prose only; no visual inspection or new behavioral claim.
