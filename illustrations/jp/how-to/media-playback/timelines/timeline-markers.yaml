  - id: ja-bb08135794-003
    title: Adding And Managing Markers 3 1
    caption: Adding And Managing Markers 3 1
    show: "Adding And Managing Markers 3 1. Use the adjacent instructions as the content brief: マーカーを移動するには、時間目盛り上でマーカーをドラッグするか、より正確な位置調整のために、マーカーを右クリックしてドロップダウンメニューからEditを選択します。表示されるダイアログボックスで、Position欄に目的の値を入力してください。 マーカーは有効または無効にできます。マーカーを無効にするには、マーカーを右クリックし、ドロップダウンメニューでEnabledチェックボックスを外してください。"
