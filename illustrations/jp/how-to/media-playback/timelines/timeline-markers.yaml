  - id: ja-bb08135794-005
    title: Adding And Managing Markers 5 1
    caption: Adding And Managing Markers 5 1
    show: "Adding And Managing Markers 5 1. Use the adjacent instructions as the content brief: マーカーを削除するには、マーカーを右クリックして、ドロップダウンメニューからDeleteを選択します。 ラベルマーカーとポーズマーカーは名前の通りに機能します。ここではジャンプマーカーとタイムコードマーカーについて詳しく説明します。"
