  - id: ja-4d26fbfb64-005
    title: Arranging Media Items On Timeline Tracks
    caption: Arranging Media Items On Timeline Tracks
    show: "Arranging Media Items On Timeline Tracks. Use the adjacent instructions as the content brief: Media Library、別のMedia Playerの再生リスト、またはタイムラインからメディアアイテムをドラッグアンドドロップします。Media Library、別のMedia Playerの再生リスト、またはタイムラインでメディアアイテムを選択し、右クリックしてドロップダウンメニューからCopyを選択するか、Ctrl + C のキーボードショートカットを使用してコピーします。次に、タイムライン上のターゲットトラックを選択し、ドロップダウンメニューから 貼り付け（Ctrl + V）を使用してメディアアイテムをタイムライントラックに配置します。メディアアイテムは、選択されたトラックの現在の再生ヘッドがある位置に貼り付けられます。システムフォルダからメディアファイルを直接ドラッグアンドドロップするか、Copy（Ctrl + C）と貼り付け（Ctrl + V）のコマンドを使用します。この操作により、Add Media File("
    status: draft-needs-review
