  - id: ja-4d26fbfb64-001
    title: Adding Tracks
    caption: Adding Tracks
    show: "Adding Tracks. Use the adjacent instructions as the content brief: タイムラインに新しいトラックを追加するには、以下のいずれかの方法を使用してください： 既存のトラックを選択し、トップツールバーにあるAdd Track Above またはAdd Track Below のいずれかのボタンをクリックします。トラックヘッダを右クリックし、ドロップダウンメニューからAdd Track AboveまたはAdd Track Belowを選択します。Media Library、プレイリスト、または別のタイムラインからメディアアイテムをドラッグアンドドロップしてタイムラインのトラックエリアに配置します。タイムライントラックの空白部分にメディアアイテムをドロップすると、自動的に追加のタイムライントラックが作成されます。Media Library、プレイリスト、または別のタイムラインからメディアアイテムをコピーして貼り付けます。タイムラインにメディアアイテムを貼り付ける場合は、トラックヘッダをクリックして対象のト"
