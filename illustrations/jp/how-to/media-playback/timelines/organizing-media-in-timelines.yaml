  - id: ja-4d26fbfb64-006
    title: Adding External Image Sources As AUX Media Items
    caption: Adding External Image Sources As AUX Media Items
    show: "Adding External Image Sources As AUX Media Items. Use the adjacent instructions as the content brief: 外部画像ソースを受け取るためにMedia Playerを設定したら、Timelineパネルに移動し、AUXアイテムを配置する目的のタイムライントラックのヘッダーをクリックします。次に、トラック上で右クリックしてドロップダウンメニューを開き、Add AUXを選択します。ダイアログボックスが表示され、ドロップダウンリストから希望する AUX メディアソースを選択できます。 タイムライントラック上の任意のメディアアイテムに適用可能なすべての設定と変換は、AUXアイテムにも適用されます。通常、AUXメディアアイテムを配置した後は、外部映像ソースの再生時間を指定するためにその長さを調整します。"
    status: draft-needs-review
    basis: Existing alt text, heading and adjacent prose only; no visual inspection or new behavioral claim.
    placement:
      before_block: 21
      section: 外部映像ソースを AUX メディアアイテムとして追加する
    source_url: https://help.screenberry.com/images/media-playback/animation/Adding-External-Image-Sources-as-AUX-Media-Items.gif
    source_alt: Adding External Image Sources As AUX Media Items
    text_coverage: not-independently-verified
  - id: ja-4d26fbfb64-007
    title: Adding Data Item
    caption: Adding Data Item
    show: "Adding Data Item. Use the adjacent instructions as the content brief: データアイテムをタイムライントラックに追加するには、ヘッダをクリックして所望のトラックを選択します。次に、トラック上で右クリックしてドロップダウンメニューを開き、Add Data Itemを選択します。表示されるダイアログボックスには、アニメーション化したい値パラメータのNode PathとParameter Nameを入力します。 データアイテムについての詳細は、キーフレームの操作を説明するセクションを参照してください。キーフレームはこの機能の説明に必要不可欠です。"
    status: draft-needs-review
    basis: Existing alt text, heading and adjacent prose only; no visual inspection or new behavioral claim.
    placement:
      before_block: 25
      section: データアイテムの追加
    source_url: https://help.screenberry.com/images/media-playback/animation/Adding-Data-Item.gif
    source_alt: Adding Data Item
    text_coverage: not-independently-verified
  - id: ja-4d26fbfb64-008
    title: Deleting Media Items Timelines
    caption: Deleting Media Items Timelines
    show: "Deleting Media Items Timelines. Use the adjacent instructions as the content brief: タイムラインからひとつまたは複数のメディアアイテムを削除するには、メディアアイテムまたは選択したメディアアイテムのグループを右クリックし、ドロップダウンメニューからDeleteを選択します。または、メディアアイテムを選択して Del キーを押して削除することもできます。"
    status: draft-needs-review
    basis: Existing alt text, heading and adjacent prose only; no visual inspection or new behavioral claim.
    placement:
      before_block: 27
      section: メディアアイテムの削除
    source_url: https://help.screenberry.com/images/media-playback/animation/Deleting-Media-Items-Timelines.gif
    source_alt: Deleting Media Items Timelines
    text_coverage: not-independently-verified
  - id: ja-4d26fbfb64-009
    title: Arranging Media Items On Timeline Tracks
    caption: Arranging Media Items On Timeline Tracks
    show: "Arranging Media Items On Timeline Tracks. Use the adjacent instructions as the content brief: メディアアイテムのドラッグを垂直移動に制限する場合は、Shift キーを押しながら操作します。 同じタイムライントラック上の特定の時間位置にメディアアイテムを正確に配置したい場合は、メディアアイテムのSettingsパネルのPosition欄に希望する時間値を入力します。 Note:メモ：メディアアイテムの設定には 2 つの異なる方法があります：タイムラインパネルの右上隅にあるトグルをクリックして表示または非表示にできる、Settingsパネルです。メディアアイテムを右クリックし、ドロップダウンメニューからItem Settingsを選択することでアクセスできる、独立したSettingsダイアログボックスです。"
    status: draft-needs-review
    basis: Existing alt text, heading and adjacent prose only; no visual inspection or new behavioral claim.
    placement:
      before_block: 33
      section: タイムライントラック上にメディアアイテムを配置する
    source_url: https://help.screenberry.com/images/media-playback/animation/Arranging-Media-Items-on-Timeline-Tracks.gif
    source_alt: Arranging Media Items On Timeline Tracks
    text_coverage: not-independently-verified
  - id: ja-4d26fbfb64-010
    title: Splitting Media Items 1
    caption: Splitting Media Items 1
    show: "Splitting Media Items 1. Use the adjacent instructions as the content brief: 必要な場合は、カミソリツールを使用してメディアアイテムを 2 つのパートに分割することができます。この操作により、元のメディアアイテムとは異なる開始点と終了点を持つ、2 つの別々のインスタンスが作成されます。メディアアイテムを分割するには、サイドツールバーからカミソリツールを選択します（または C キーボードショートカットを使用します）。その後、メディアアイテム内の分割したいポイントをクリックします。ドラッグによる編集を再開するには、サイドツールバーから移動ツールを選択するか、V または Esc キーボードショートカットを使用します。"
    status: draft-needs-review
    basis: Existing alt text, heading and adjacent prose only; no visual inspection or new behavioral claim.
    placement:
      before_block: 36
      section: メディアアイテムの分割
    source_url: https://help.screenberry.com/images/media-playback/animation/Splitting-Media-Items-1.gif
    source_alt: Splitting Media Items 1
    text_coverage: not-independently-verified
  - id: ja-4d26fbfb64-011
    title: Changing Duration Of Media Items
    caption: Changing Duration Of Media Items
    show: "Changing Duration Of Media Items. Use the adjacent instructions as the content brief: メディアアイテムの再生時間と開始時間を調整するには、メディアアイテムのサムネイルの両側にある白い四角形のハンドルをドラッグしてトリミングまたは引き延ばしをすることができます。左側のハンドルは開始時間を変更し、右側のハンドルは再生時間を調整します。また、メディアアイテムを右クリックし、ドロップダウンメニューからItem Settingsを選択し、その後Start fromとDurationの欄に値を入力することもできます。メディアアイテムがトリミングまたは引き延ばしをされたことを示すために、四角形のハンドルは三角形のハンドルに変わります。"
    status: draft-needs-review
    basis: Existing alt text, heading and adjacent prose only; no visual inspection or new behavioral claim.
    placement:
      before_block: 38
      section: メディアアイテムの再生時間の変更
    source_url: https://help.screenberry.com/images/media-playback/animation/Changing-Duration-of-Media-Items.gif
    source_alt: Changing Duration Of Media Items
    text_coverage: not-independently-verified
  - id: ja-4d26fbfb64-012
    title: Fading Media Items In And Out
    caption: Fading Media Items In And Out
    show: "Fading Media Items In And Out. Use the adjacent instructions as the content brief: メディアアイテムのフェードインとフェードアウトを設定するには、メディアアイテムサムネイルの上隅にある白い三角形のハンドルをドラッグするか、メディアアイテムを右クリックしてドロップダウンメニューからItem Settingsを選択し、Fade InとFade Outの欄に必要な値を入力します。"
    status: draft-needs-review
    basis: Existing alt text, heading and adjacent prose only; no visual inspection or new behavioral claim.
    placement:
      before_block: 40
      section: メディアアイテムのフェードインとフェードアウト
    source_url: https://help.screenberry.com/images/media-playback/animation/Fading-Media-Items-In-and-Out.gif
    source_alt: Fading Media Items In And Out
    text_coverage: not-independently-verified
  - id: ja-4d26fbfb64-013
    title: Freezing A Frame Of A Media Item
    caption: Freezing A Frame Of A Media Item
    show: "Freezing A Frame Of A Media Item. Use the adjacent instructions as the content brief: メディアアイテムの任意の静止画フレームを連続再生するには、メディアアイテムを右クリックし、ドロップダウンメニューからItem Settingsを選択し、表示されるダイアログボックスでEnable Freeze Frameチェックボックスを選択します。次に、保持したいメディアアイテムの特定のフレームをFreeze Frameフィールドに入力してください。静止画フレームの再生時間を指定するには、Duration欄に値を入力します。"
    status: draft-needs-review
    basis: Existing alt text, heading and adjacent prose only; no visual inspection or new behavioral claim.
    placement:
      before_block: 42
      section: メディアアイテムのフレームを固定する
    source_url: https://help.screenberry.com/images/media-playback/animation/Freezing-a-Frame-of-a-Media-Item.gif
