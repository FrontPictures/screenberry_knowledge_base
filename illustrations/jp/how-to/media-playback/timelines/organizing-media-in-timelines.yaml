  - id: ja-4d26fbfb64-004
    title: Tracks Color Coding
    caption: Tracks Color Coding
    show: "Tracks Color Coding. Use the adjacent instructions as the content brief: タイムラインのトラックに色のラベルを適用するには、そのヘッダーを右クリックし、ドロップダウンメニューからColor Tagを選択し、表示されるカラーピッカーダイアログボックスから色を選んでください。選択した色は、トラックのヘッダーにある色のラベルラインに適用されます。"
    status: draft-needs-review
    basis: Existing alt text, heading and adjacent prose only; no visual inspection or new behavioral claim.
