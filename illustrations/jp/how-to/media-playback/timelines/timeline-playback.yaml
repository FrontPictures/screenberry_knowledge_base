    title: Timeline Playback
    caption: Timeline Playback
    show: "Timeline Playback. Use the adjacent instructions as the content brief: タイムラインの再生状態を誤って操作してしまうのを防ぐには、Lock/Unlock Playback Controlsトグルボタンを使用します。タイムラインがロックされている場合、すべての Play、Pause、Stop ボタンは無効になります。再びアンロックするには、Lock/Unlock Playback Controlsトグルボタンを再度クリックしてください。 現在再生中のメディアアイテムを検索するには、Reveal Active Itemボタンをクリックしてください。これにより表示がアクティブなタイムラインに切り替わり、現在再生中のアイテムの位置に自動的にスクロールされ、アイテムが目立つようにハイライトされます。"
