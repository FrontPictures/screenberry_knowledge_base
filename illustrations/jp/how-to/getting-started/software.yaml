  - id: ja-a1ab59b8a2-011
    title: Connect
    caption: Connect
    show: "Connect. Use the adjacent instructions as the content brief: ウェルカムウィンドウ内で、利用可能なメディアサーバーを選択しConnectボタンをクリックします。 Screenberry Serverを初めて実行する際には、Windowsのセキュリティ警告ダイアログが表示され、アプリの一部の機能がWindowsのファイヤーウォール機能によってブロックされる可能性があることが通知されます。このネットワーク上でScreenberry Serverが通信するために、プライベート ネットワークとパブリック ネットワークの両方のチェックボックスをオンにしてください。"
    status: draft-needs-review
    basis: Existing alt text, heading and adjacent prose only; no visual inspection or new behavioral claim.
    placement:
      before_block: 13
      section: Screenberryの起動
    source_url: https://help.screenberry.com/images/getting-started/static/connect.png
    source_alt: Connect
    text_coverage: not-independently-verified
