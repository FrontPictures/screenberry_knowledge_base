    show: "Lens Focus Manual. Use the adjacent instructions as the content brief: カメラのモードダイアルをManual(M)に切り替えます。 レンズフォーカスをマニュアル（M）に切り替え、Calibration WizardのFocus Gridテストパターンを参考にして、レンズのフォーカスを手動で合わせてください。"
