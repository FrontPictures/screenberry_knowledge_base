  - id: ja-b5639269ed-003
    title: Camera Position Side View
    caption: Camera Position Side View
    show: "Camera Position Side View. Use the adjacent instructions as the content brief: カメラの位置合わせのガイドライン： カメラをしっかりと三脚に取り付け、投影範囲（スクリーン）全体を捉えるように設置します。カメラの三脚をドームの床面に配置し、カメラのレンズがドームの天頂を向くようにします。カメラの傾きがドームの傾きと一致していることを確認してください。 カメラがプロジェクターのレンズよりも下になるよう設置し、カメラがドームスクリーンに影を落とさないようにします。撮影した写真の下部がドームの前方に、上部がドームの後方に対応するように向きを合わせます。"
    status: draft-needs-review
    basis: Existing alt text, heading and adjacent prose only; no visual inspection or new behavioral claim.
