  - id: ja-5abad223d4-002
    title: Camera Positioning
    caption: Camera Positioning
    show: "Camera Positioning. Use the adjacent instructions as the content brief: キャリブレーションプリセットが選択されると、Screenberryが自動的にテスト写真を撮影します。 カメラが接続されていないか正常に動作していない場合は、エラーメッセージが表示されます。"
