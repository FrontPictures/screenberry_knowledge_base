  - id: ja-5abad223d4-001
    title: Automatic Calibration Presets
    caption: Automatic Calibration Presets
    show: "Automatic Calibration Presets. Use the adjacent instructions as the content brief: Calibrator Wizardウィジェット（Window > Calibrator Wizard）には、3つのキャリブレーションのプリセットがあります： Geometryキャリブレーションは、歪み補正 および エッジブレンド を行います。通常、プロジェクターごとに約30秒かかり、Mask、Geometry、Blendのキャリブレーション段階が含まれます。Geometry+Intensityキャリブレーションは、歪み補正、エッジブレンド、および 黒と白のレベル補正 を提供します。通常、プロジェクターごとに約1.5分かかり、Mask、Geometry、Blend、Intensityのキャリブレーション段階が含まれます。Geometry+Intensity+Gammaキャリブレーションは、すべての標準キャリブレーション機能に加えて、ブレンド内の画像の色の均一性を確保するための ガンマ補正 を行います。通常、約15〜30分かかり、M"
