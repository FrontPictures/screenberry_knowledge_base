    title: Projections Overlapping
    caption: Projections Overlapping
    show: "Projections Overlapping. Use the adjacent instructions as the content brief: 以下の手順に従って、プロジェクターを正しく設置します： プロジェクターのランプ寿命がほぼ同程度であることを確認します。必要な場合はランプを交換します。レーザー光源を持つプロジェクターの場合は、同じ明るさのモードを選択します。プロジェクターが確実に固定され、キャリブレーション作業中に動かないことを確認します。映像信号ケーブルで各プロジェクターをScreenberry Serverのビデオカードの出力に接続します。すべてのプロジェクターの電源を入れます。プロジェクターのメニューを使用して、テストパターンを表示し、投影される映像が目標の投影エリア（スクリーン）全体をカバーし、十分に重なっていることを確認します。推奨される重なり領域は、隣接する映像の両側に5〜15％の重なりがある状態です。必要に応じて、プロジェクターのズーム、レンズシフト、フォーカス、および位置を調整します。* プロジェクター４台でドームスクリーンを覆う設置の例"
