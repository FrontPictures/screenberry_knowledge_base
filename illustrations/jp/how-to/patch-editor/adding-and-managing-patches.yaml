  - id: ja-7bbf5fe852-002
    title: Deleting Patches
    caption: Deleting Patches
    show: "Deleting Patches. Use the adjacent instructions as the content brief: InputパネルまたはOutputパネルのいずれかの制御点を右クリックし、ドロップダウンメニューからDelete Patchesを選択します。ナビゲーションツリーのPatchをクリックし、ドロップダウンメニューからDelete Patchを選択します。 または、ノードグラフ で関連するPatchノードを削除することもできます。"
