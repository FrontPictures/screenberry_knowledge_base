    title: Node Tree Example
    caption: Node Tree Example
    show: "Node Tree Example. Use the adjacent instructions as the content brief: Patchノードはノードグラフに追加されます（詳細はノードの追加を参照）。 通常のセットアップでは、Patchノードの入力はソース映像となるノードに接続され、その出力はDisplayノードまたはCanvasノードに接続されます。 Bezier WarpノードはMedia Playerノードから映像入力を受け取り、Canvasノードに映像出力を送ります。"
