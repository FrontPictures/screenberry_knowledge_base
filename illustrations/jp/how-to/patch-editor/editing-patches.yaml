  - id: ja-5dcf73e919-007
    title: Modifying Output Image Geometry 1
    caption: Modifying Output Image Geometry 1
    show: "Modifying Output Image Geometry 1. Use the adjacent instructions as the content brief: 映像出力のジオメトリを変更するには、Outputパネルのメッシュ制御点（頂点）の円形ハンドルを選択し、ドラッグしてください。これによって、出力映像の形状や表示される場所が変更されます。 複数の制御点は、Shift キーを押しながら一つずつクリックするか、マウスの左ボタンを押しながらドラッグして箱型に囲むことで選択できます。"
    status: draft-needs-review
    basis: Existing alt text, heading and adjacent prose only; no visual inspection or new behavioral claim.
    placement:
      before_block: 16
      section: 映像出力のジオメトリの変更
    source_url: https://help.screenberry.com/images/patch-editor/animation/Modifying-Output-Image-Geometry-1.gif
    source_alt: Modifying Output Image Geometry 1
    text_coverage: not-independently-verified
  - id: ja-5dcf73e919-008
    title: Modifying Output Image Geometry 2
    caption: Modifying Output Image Geometry 2
    show: "Modifying Output Image Geometry 2. Use the adjacent instructions as the content brief: 複数の制御点は、Shift キーを押しながら一つずつクリックするか、マウスの左ボタンを押しながらドラッグして箱型に囲むことで選択できます。 メモ： 映像のジオメトリ調整を行う際には、Screenberryの画面出力を実際に見ながら作業することをおすすめします。"
    status: draft-needs-review
    basis: Existing alt text, heading and adjacent prose only; no visual inspection or new behavioral claim.
