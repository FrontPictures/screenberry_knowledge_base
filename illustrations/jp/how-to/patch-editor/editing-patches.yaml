  - id: ja-5dcf73e919-001
    title: Selecting Patches 1
    caption: Selecting Patches 1
    show: "Selecting Patches 1. Use the adjacent instructions as the content brief: Patch Editor内で： ナビゲーションツリーパネルでPatchをクリックします。連続していない複数のPatchを選択するには、ナビゲーションツリー内でそれらを Ctrl キーを押しながらクリックします。連続した複数のPatchを選択するには、最初のPatchをクリックし、ナビゲーションツリーパネルで最後のPatchを Shift キーを押しながらクリックします。すべてのPatchを選択するには、ナビゲーションツリーパネルをクリックしてから Ctrl + A を押します。 ノードグラフ 内では："
    status: draft-needs-review
