  - id: ja-5dcf73e919-021
    title: Reference Image
    caption: Reference Image
    show: "Reference Image. Use the adjacent instructions as the content brief: View Optionsパネルの Reference Image > Show を選択/選択解除します。パネル内で右クリックし、ドロップダウンメニューで Show Reference Image を選択/選択解除します。 これらの操作では、以前に参照画像が読み込まれていない場合、画像の読み込みダイアログボックスが表示されます。"
    status: draft-needs-review
