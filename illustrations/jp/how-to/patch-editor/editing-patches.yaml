  - id: ja-5dcf73e919-009
    title: Adjusting UV Map
    caption: Adjusting UV Map
    show: "Adjusting UV Map. Use the adjacent instructions as the content brief: Screenberryでは、Patchノードによって受け取られたソース映像は、Patchで定義されたジオメトリにUVマップされます。入力映像のUVマッピングを調整するには、Inputパネルでメッシュ制御点（UVマップの頂点）の円形ハンドルを選択してドラッグします。これによって、出力映像が参照する入力映像との対応関係が変更されます。"
    status: draft-needs-review
    basis: Existing alt text, heading and adjacent prose only; no visual inspection or new behavioral claim.
    placement:
      before_block: 20
      section: UVマップの調整
    source_url: https://help.screenberry.com/images/patch-editor/animation/Adjusting-UV-Map.gif
    source_alt: Adjusting UV Map
    text_coverage: not-independently-verified
  - id: ja-5dcf73e919-010
    title: Setting Control Points Coordinates
    caption: Setting Control Points Coordinates
    show: "Setting Control Points Coordinates. Use the adjacent instructions as the content brief: 制御点座標を表示するには、次のいずれかの方法を使用します： スペースバー を押します。Inputパネルまたは Outputパネルで右クリックし、ドロップダウンメニューから Show Coordinatesを選択します。View OptionsパネルでShow Coordinatesを選択します。 制御点の座標を手動で変更するには、制御点を選択して Enter キーを押すか、制御点を右クリックしてドロップダウンメニューから Set Position を選択します。ダイアログボックスに X 座標と Y 座標を入力してください。"
    status: draft-needs-review
    basis: Existing alt text, heading and adjacent prose only; no visual inspection or new behavioral claim.
    placement:
      before_block: 23
      section: 制御点座標
    source_url: https://help.screenberry.com/images/patch-editor/animation/Setting-Control-Points-Coordinates.gif
    source_alt: Setting Control Points Coordinates
    text_coverage: not-independently-verified
  - id: ja-5dcf73e919-011
    title: Setting Control Points Coordinates 2
    caption: Setting Control Points Coordinates 2
    show: "Setting Control Points Coordinates 2. Use the adjacent instructions as the content brief: 制御点の座標を手動で変更するには、制御点を選択して Enter キーを押すか、制御点を右クリックしてドロップダウンメニューから Set Position を選択します。ダイアログボックスに X 座標と Y 座標を入力してください。 メモ： 座標の原点(0,0)は左上隅にあります。"
    status: draft-needs-review
    basis: Existing alt text, heading and adjacent prose only; no visual inspection or new behavioral claim.
    placement:
      before_block: 24
      section: 制御点座標
    source_url: https://help.screenberry.com/images/patch-editor/animation/Setting-Control-Points-Coordinates-2.gif
    source_alt: Setting Control Points Coordinates 2
    text_coverage: not-independently-verified
  - id: ja-5dcf73e919-012
    title: Flipping And Rotating
    caption: Flipping And Rotating
    show: "Flipping And Rotating. Use the adjacent instructions as the content brief: Patch EditorのInputパネルまたはOutputパネルにおいて、垂直反転や時計回りに90度回転 を適用することができます。制御点を反転するには、Patchの制御点を選択し、F キーを押すか、制御点を右クリックしてドロップダウンメニューから Transform > Flip を選択します。回転するには、Patchの制御点を選択し、R キーを押すか、コントロールポイントを右クリックしてドロップダウンメニューから Transform > Rotate Indexes を選択します。 メモ： メッシュを反転または回転する際に制御点を選択すると、どのような幾何学的な変換やUVレイアウトの変換が適用されているかを理解するのに役立ちます。"
    status: draft-needs-review
    basis: Existing alt text, heading and adjacent prose only; no visual inspection or new behavioral claim.
    placement:
      before_block: 27
      section: Patchの反転と回転
    source_url: https://help.screenberry.com/images/patch-editor/animation/Flipping-and-Rotating.gif
    source_alt: Flipping And Rotating
    text_coverage: not-independently-verified
  - id: ja-5dcf73e919-013
    title: Modifying Density
    caption: Modifying Density
    show: "Modifying Density. Use the adjacent instructions as the content brief: 映像のジオメトリ修正に対してより細かな編集を行うために、制御点の密度を変更することができます。制御点の密度を変更するには、対応するキーボードショートカットを使用するか、Patch Editorの作業エリアで右クリックしてドロップダウンメニューから Subdivide/Merge/[機能名] を選択します。以下の機能とキーボードショートカットが利用可能です： Increase Subdivision（Ctrl + X）は、ポリゴンを半分に割って新しい頂点を追加することでポリゴンを分割します。Decrease Subdivision（Ctrl + Shift + X）は、隣接するポリゴンを共有する境界を削除することでポリゴンを結合します。Subdivide Columns（Ctrl + Shift + Right）は、すべての列のポリゴンを半分に割って新しい頂点を追加します。Merge Columns（Ctrl + Shift + "
    status: draft-needs-review
    basis: Existing alt text, heading and adjacent prose only; no visual inspection or new behavioral claim.
    placement:
      before_block: 31
      section: 制御点の密度の変更
    source_url: https://help.screenberry.com/images/patch-editor/animation/Modifying-Density.gif
    source_alt: Modifying Density
    text_coverage: not-independently-verified
  - id: ja-5dcf73e919-014
    title: Guidelines 1
    caption: Guidelines 1
    show: "Guidelines 1. Use the adjacent instructions as the content brief: 制御点の位置が編集されると、灰色の点線の水平および垂直のスマートガイドが表示されます。これらは、制御点の以前の座標を視覚的表示することで、以前の軸に沿って整列しやすくします。 また、Rectangle Patchを編集する際には、ソース映像のアスペクト比を示す追加の対角線状の灰色点線のスマートガイドが表示されます。"
    status: draft-needs-review
    basis: Existing alt text, heading and adjacent prose only; no visual inspection or new behavioral claim.
    placement:
      before_block: 33
      section: スマートガイドとガイドラインの使用
    source_url: https://help.screenberry.com/images/patch-editor/animation/Guidelines-1.gif
    source_alt: Guidelines 1
    text_coverage: not-independently-verified
  - id: ja-5dcf73e919-015
    title: Guidelines 2
    caption: Guidelines 2
    show: "Guidelines 2. Use the adjacent instructions as the content brief: また、Rectangle Patchを編集する際には、ソース映像のアスペクト比を示す追加の対角線状の灰色点線のスマートガイドが表示されます。 独自にガイドラインを追加するには、空白の領域で右クリックし、ドロップダウンメニューからGuideline Editorを選択します。表示されたダイアログボックスで、次のいずれかを行います："
    status: draft-needs-review
    basis: Existing alt text, heading and adjacent prose only; no visual inspection or new behavioral claim.
    placement:
      before_block: 34
      section: スマートガイドとガイドラインの使用
    source_url: https://help.screenberry.com/images/patch-editor/animation/Guidelines-2.gif
    source_alt: Guidelines 2
    text_coverage: not-independently-verified
  - id: ja-5dcf73e919-016
    title: Guidelines 3
    caption: Guidelines 3
    show: "Guidelines 3. Use the adjacent instructions as the content brief: 列（Columns）と 行（Rows）の値を入力し、Add Gridボタンを押してガイドライングリッドを作成します。座標を入力し、Add Horizontal GuidelineまたはAdd Vertical Guidelineボタンを押して個々のガイドラインを追加します。 すべてのガイドラインを削除する場合は、Clear Allボタンを押します。ガイドラインの設定が完了したら、OKボタンを押してガイドラインを追加します。"
    status: draft-needs-review
    basis: Existing alt text, heading and adjacent prose only; no visual inspection or new behavioral claim.
    placement:
      before_block: 37
      section: スマートガイドとガイドラインの使用
    source_url: https://help.screenberry.com/images/patch-editor/animation/Guidelines-3.gif
    source_alt: Guidelines 3
    text_coverage: not-independently-verified
  - id: ja-5dcf73e919-017
    title: Snapping
    caption: Snapping
    show: "Snapping. Use the adjacent instructions as the content brief: デフォルトでは、自動スナッピング機能が有効になっています。制御点の位置を変更すると、ガイドライン、スマートガイド、出力Canvasの端、および近くに配置された他の制御点にスナップします。制御点をドラッグする際に一時的にスナップを無効にするには、Shift キーを押し続けます。"
    status: draft-needs-review
    basis: Existing alt text, heading and adjacent prose only; no visual inspection or new behavioral claim.
    placement:
      before_block: 39
      section: スナッピング
    source_url: https://help.screenberry.com/images/patch-editor/animation/Snapping.gif
    source_alt: Snapping
    text_coverage: not-independently-verified
  - id: ja-5dcf73e919-018
    title: Alignment Of The Control Points 1
    caption: Alignment Of The Control Points 1
    show: "Alignment Of The Control Points 1. Use the adjacent instructions as the content brief: 選択した制御点を水平方向に整列するには、Shift + H を押すか、選択した制御点を右クリックし、ドロップダウンメニューから Align Horizontally を選択します。 選択した制御点を垂直方向に整列するには、Shift + V を押すか、選択した制御点を右クリックし、ドロップダウンメニューから Align Vertically を選択します。 制御点の編集中に移動制限をかけることもできます："
    status: draft-needs-review
    basis: Existing alt text, heading and adjacent prose only; no visual inspection or new behavioral claim.
    placement:
      before_block: 41
      section: 制御点の垂直および水平方向の整列
    source_url: https://help.screenberry.com/images/patch-editor/animation/Alignment-of-the-Control-Points-1.gif
    source_alt: Alignment Of The Control Points 1
    text_coverage: not-independently-verified
  - id: ja-5dcf73e919-019
    title: Alignment Of The Control Points 2
    caption: Alignment Of The Control Points 2
    show: "Alignment Of The Control Points 2. Use the adjacent instructions as the content brief: 制御点の編集中に移動制限をかけることもできます： 水平軸に移動制限をかけるには、H キーを押すか、制御点を右クリックしてドロップダウンメニューからConstrain Horizontallyを選択します。垂直軸に移動制限をかけるには、V キーを押すか、制御点を右クリックしてドロップダウンメニューからConstrain Verticallyを選択します。"
    status: draft-needs-review
    basis: Existing alt text, heading and adjacent prose only; no visual inspection or new behavioral claim.
