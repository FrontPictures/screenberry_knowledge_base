  - id: ja-5dcf73e919-022
    title: Viewmode1
    caption: Viewmode1
    show: "Viewmode1. Use the adjacent instructions as the content brief: PatchのSettingsパネルで、View Modeから3つの利用可能な表示モードのうち1つを選択できます。 Texturedは、出力映像のみを表示します。Textured + Cageは、出力映像と制御点グリッド（赤い線）を表示します。Textured + Wireframeは、出力映像、制御点グリッド（赤い線）、および細分化されたメッシュポリゴンのワイヤーフレーム（灰色の線）を表示します。"
    status: draft-needs-review
