  - id: ja-5dcf73e919-005
    title: Selecting Patches 5
    caption: Selecting Patches 5
    show: "Selecting Patches 5. Use the adjacent instructions as the content brief: 連続したPatchの編集に切り替えるには、次のいずれかの方法を行ってください： Z キーを押して次のPatchを選択するか、Shift + Z を押して前のPatchを選択します。InputパネルまたはOutputパネルで右クリックし、ドロップダウンメニューから Select Next PatchまたはSelect Previous Patchを選択します。 Patchが選択されると、そのPatchに対応したSettingsパネルが表示され、設定の確認や変更ができるようになります。"
    status: draft-needs-review
    basis: Existing alt text, heading and adjacent prose only; no visual inspection or new behavioral claim.
