  - id: ja-5dcf73e919-020
    title: Previewing Patch Output
    caption: Previewing Patch Output
    show: "Previewing Patch Output. Use the adjacent instructions as the content brief: プレビュー表示を手動で更新する必要がある場合、次のいずれかの方法を使用します： F5 を押します。View Optionsパネルで、Live Image > Image [ Refresh ] ボタンを押します。パネル内で右クリックし、ドロップダウンメニューでGet Live Image from Serverを選択します。"
    status: draft-needs-review
    basis: Existing alt text, heading and adjacent prose only; no visual inspection or new behavioral claim.
