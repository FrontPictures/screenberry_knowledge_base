      section: Display の選択
    source_url: https://help.screenberry.com/images/display-editor/animation/Selecting-Displays-2.gif
    source_alt: Selecting Displays 2
    text_coverage: not-independently-verified
  - id: ja-3db46e4341-008
    title: Selecting Displays 3
    caption: Selecting Displays 3
    show: "Selecting Displays 3. Use the adjacent instructions as the content brief: 複数の Display は、Display Editorの空白領域をマウスで左ドラッグすることで一度に選択することもできます。 右から左にドラッグすると、矩形の選択範囲に接触するすべての Display が選択されます。 左から右へのドラッグ操作の場合、長方形の範囲内にある表示物のみが選択されます。"
    status: draft-needs-review
    basis: Existing alt text, heading and adjacent prose only; no visual inspection or new behavioral claim.
    placement:
      before_block: 27
      section: Display の選択
    source_url: https://help.screenberry.com/images/display-editor/animation/Selecting-Displays-3.gif
