  - id: ja-3db46e4341-010
    title: Display Position And Dimensions
    caption: Display Position And Dimensions
    show: "Display Position And Dimensions. Use the adjacent instructions as the content brief: Display の位置を変更する別の方法は、Display Editorで Display を選択するか、ナビゲーションツリーで Display 名を選択し、SettingsパネルのPositionパラメータのXとYの値を変更することです。 また、Settingsパネルで表示のサイズも調整できます。SizeパラメータのWとHの値を変更してください。"
    status: draft-needs-review
    basis: Existing alt text, heading and adjacent prose only; no visual inspection or new behavioral claim.
    placement:
      before_block: 33
      section: Display の表示位置とサイズ
    source_url: https://help.screenberry.com/images/display-editor/animation/Display-Position-and-Dimensions.gif
    source_alt: Display Position And Dimensions
    text_coverage: not-independently-verified
  - id: ja-3db46e4341-011
    title: Copying And Pasting Displays
    caption: Copying And Pasting Displays
    show: "Copying And Pasting Displays. Use the adjacent instructions as the content brief: Display Editorで Display をコピーして貼り付けするには、次のいずれかの方法を使用します： Display（または選択した複数の Display）を右クリックし、ドロップダウンメニューからCopyまたはCutを選択し、その後Pasteを選択します。キーボードショートカットを使用します： Ctrl + C でコピー、Ctrl + X で切り取り、Ctrl + V で貼り付けします。"
    status: draft-needs-review
    basis: Existing alt text, heading and adjacent prose only; no visual inspection or new behavioral claim.
    placement:
      before_block: 36
      section: Display のコピーと貼り付け
    source_url: https://help.screenberry.com/images/display-editor/animation/Copying-and-Pasting-Displays.gif
    source_alt: Copying And Pasting Displays
    text_coverage: not-independently-verified
  - id: ja-3db46e4341-012
    title: Deleting A Display
    caption: Deleting A Display
    show: "Deleting A Display. Use the adjacent instructions as the content brief: Display を削除するには、次のいずれかの方法を使用します。 Display を右クリックし、ドロップダウンメニューからDeleteを選択します（または Del キーを押します）。ノードグラフ内の対応するDisplayノードを削除します。"
    status: draft-needs-review
    basis: Existing alt text, heading and adjacent prose only; no visual inspection or new behavioral claim.
    placement:
      before_block: 39
      section: Display の削除
    source_url: https://help.screenberry.com/images/display-editor/animation/Deleting-a-Display.gif
    source_alt: Deleting A Display
    text_coverage: not-independently-verified
  - id: ja-3db46e4341-013
    title: Disabling A Display
    caption: Disabling A Display
    show: "Disabling A Display. Use the adjacent instructions as the content brief: ノードグラフ（詳細はノードの状態を参照）でDisplayノードを無効化すると、Display Editor内の対応する Display も無効化されます。ノードが無効化されていることを示すため、Display には取り消し線が描かれます。"
    status: draft-needs-review
    basis: Existing alt text, heading and adjacent prose only; no visual inspection or new behavioral claim.
    placement:
      before_block: 41
      section: Display の無効化
    source_url: https://help.screenberry.com/images/display-editor/animation/Disabling-a-Display.gif
    source_alt: Disabling A Display
    text_coverage: not-independently-verified
  - id: ja-3db46e4341-014
    title: Swapping Displays
    caption: Swapping Displays
    show: "Swapping Displays. Use the adjacent instructions as the content brief: Display を入れ替えるには、左上のツールバーにあるSwap Displaysタブをクリックするか、Displays表示の空白の領域を右クリックし、ドロップダウンメニューからSwap Displaysを選択します。次に、以下の手順を実行します。 Swap欄のドロップダウンメニューから Display を選択します。リスト内の次の Display に移動するには、Skipボタンまたは Enter キーを押します。選択した Display が表示されたら、With欄に入れ替える Display の名前を入力し、Applyボタンを押します。 メモ： この手順はセットアップ中に特に役立ちます。サーバーに映像表示デバイスを接続する際に、順序を気にする必要はありません。後でSwap Displays機能を使用して簡単に並びを変更できます。"
    status: draft-needs-review
    basis: Existing alt text, heading and adjacent prose only; no visual inspection or new behavioral claim.
    placement:
      before_block: 44
      section: Display の入れ替え
    source_url: https://help.screenberry.com/images/display-editor/animation/Swapping-Displays.gif
    source_alt: Swapping Displays
    text_coverage: not-independently-verified
  - id: ja-3db46e4341-015
    title: Changing Stack Order Of Displays
    caption: Changing Stack Order Of Displays
    show: "Changing Stack Order Of Displays. Use the adjacent instructions as the content brief: また、Display の重ね順序は、ノードグラフ内のDisplayノードとCanvasノードを接続するリンクの並べ替えによっても変更できます（詳細はノードリンクの並べ替えを参照してください）。 Display は、DisplayノードがCanvasノードにリンクされる順序に基づいて上から下に積み重ねられます。つまり、後続のノードリンクを持つ Display がそれらの Display の上に重なって表示されます。"
    status: draft-needs-review
    basis: Existing alt text, heading and adjacent prose only; no visual inspection or new behavioral claim.
    placement:
      before_block: 50
      section: Display の重ね順序を変更する
    source_url: https://help.screenberry.com/images/display-editor/animation/Changing-Stack-Order-of-Displays.gif
    source_alt: Changing Stack Order Of Displays
    text_coverage: not-independently-verified
  - id: ja-3db46e4341-016
    title: Turning On Display Test Pattern
    caption: Turning On Display Test Pattern
    show: "Turning On Display Test Pattern. Use the adjacent instructions as the content brief: Display にテストパターンを表示するには、Settingsパネルで、Test Patternドロップダウンから次のいずれかを選択します： Display 名、数字、グリッド、カラーバー、またはグラデーション。"
    status: draft-needs-review
    basis: Existing alt text, heading and adjacent prose only; no visual inspection or new behavioral claim.
    placement:
      before_block: 52
      section: Display のテストパターンを表示する
    source_url: https://help.screenberry.com/images/display-editor/animation/Turning-on-Display-Test-Pattern.gif
    source_alt: Turning On Display Test Pattern
    text_coverage: not-independently-verified
  - id: ja-3db46e4341-017
    title: Rotating Display Output Image
    caption: Rotating Display Output Image
    show: "Rotating Display Output Image. Use the adjacent instructions as the content brief: 1 つ以上のプロジェクターやディスプレイパネルが縦向きや上下逆さまに配置されている場合、該当する Display 出力映像の向きが変更できると便利です。これにより、デバイスを物理的に動かすことなく、画面上の操作で修正を行うことができます。 Display の出力映像を回転させるには、Settingsパネルにアクセスして、Rotate Degreeドロップダウンの中から次のいずれかを選択してください： 0°、90° 時計回り、90° 反時計回り、または180°。"
    status: draft-needs-review
    basis: Existing alt text, heading and adjacent prose only; no visual inspection or new behavioral claim.
    placement:
      before_block: 55
      section: Display 出力映像の回転
    source_url: https://help.screenberry.com/images/display-editor/animation/Rotating-Display-Output-Image.gif
    source_alt: Rotating Display Output Image
    text_coverage: not-independently-verified
  - id: ja-3db46e4341-018
    title: Zooming And Panning
    caption: Zooming And Panning
    show: "Zooming And Panning. Use the adjacent instructions as the content brief: Display Editorで特定のエリアをズームインおよびズームアウトするには、マウスカーソルをそのエリアに重ね、マウスのスクロールホイールを使用します。または、右上隅にあるズームボタンをクリックしてマウスを移動させることで拡大率を変更することもできます。 ビューをパンするには、マウスの左ボタンを押しながらドラッグするか、右上隅にあるパンボタンをクリックし、マウスを移動させてください。"
    status: draft-needs-review
    basis: Existing alt text, heading and adjacent prose only; no visual inspection or new behavioral claim.
    placement:
      before_block: 58
      section: Display Editor でのズームとパン
    source_url: https://help.screenberry.com/images/display-editor/animation/Zooming-and-Panning.gif
    source_alt: Zooming And Panning
    text_coverage: not-independently-verified
