figures:
  - id: ja-3db46e4341-001
    title: Display Editor View
    caption: Display Editor View
    show: "Display Editor View. Use the adjacent instructions as the content brief: ユーザーはDisplay Editorを利用して、新しい Display の追加や Display のサイズ、位置、重ね順序の設定、Display 配列の作成、Display の入れ替えのほか、Display に関する様々な設定を行うことができます。Display EditorはCanvas（またはRender Target）ウィジェット内でアクセスできます。 基本的な映像再生のノードグラフの例と、それをDisplay Editorで表示した例： Media Playerノード (1) は、解像度が 1240 x 768 ピクセルで、Canvasノード (3) の(0,0)座標に配置された Displayノード (2) に映像を送信します。Canvasノードは、解像度が 1960 x 1280 ピクセルのサーバー出力画面を定義しています。"
    status: draft-needs-review
    basis: Existing alt text, heading and adjacent prose only; no visual inspection or new behavioral claim.
    placement:
      before_block: 5
      section: 概要
    source_url: https://help.screenberry.com/images/display-editor/static/Display-Editor-View.png
    source_alt: Display Editor View
    text_coverage: not-independently-verified
  - id: ja-3db46e4341-002
    title: Accessing Display Editor
    caption: Accessing Display Editor
    show: "Accessing Display Editor. Use the adjacent instructions as the content brief: Media Playerノード (1) は、解像度が 1240 x 768 ピクセルで、Canvasノード (3) の(0,0)座標に配置された Displayノード (2) に映像を送信します。Canvasノードは、解像度が 1960 x 1280 ピクセルのサーバー出力画面を定義しています。 Display Editorにアクセスするには、ワークスペースにCanvas（またはRender Target）ウィジェットを追加し、ウィジェットの左上にあるDisplaysタブをクリックしてDisplays表示に切り替えてください。"
    status: draft-needs-review
    basis: Existing alt text, heading and adjacent prose only; no visual inspection or new behavioral claim.
    placement:
      before_block: 7
      section: 概要
    source_url: https://help.screenberry.com/images/display-editor/animation/Accessing-Display-Editor.gif
    source_alt: Accessing Display Editor
    text_coverage: not-independently-verified
  - id: ja-3db46e4341-003
    title: Adding A Display
    caption: Adding A Display
    show: "Adding A Display. Use the adjacent instructions as the content brief: デフォルトでは、追加された Display はCanvasと同じ解像度になります。 関連するCanvas（またはRender Target）ノードに自動的にリンクされ、ノードグラフに対応するDisplayノードが作成されます。 逆に、ノードグラフに新しいDisplayノードを追加し、それをCanvas（またはRenderTarget）ノードにリンクすることでもDisplayを構築できます。"
    status: draft-needs-review
    basis: Existing alt text, heading and adjacent prose only; no visual inspection or new behavioral claim.
    placement:
      before_block: 12
      section: Display の追加
    source_url: https://help.screenberry.com/images/display-editor/animation/Adding-a-Display.gif
    source_alt: Adding A Display
    text_coverage: not-independently-verified
  - id: ja-3db46e4341-004
    title: Creating A Display Array
    caption: Creating A Display Array
    show: "Creating A Display Array. Use the adjacent instructions as the content brief: Canvas（またはRenderTarget）ウィジェットを開きます。ウィジェットの左上にあるDisplaysタブをクリックして、Displays表示に切り替えます。ツールバーの左上にあるCreate Display Arrayボタンをクリックするか、Displays表示内の空白の領域を右クリックして、ドロップダウンメニューからCreate Display Arrayを選択します。表示されたダイアログボックスで、Display 配列の行（Rows）と列（Columns）の数を入力し、Displayに接続する Patch のタイプを選択してOKをクリックします。 その結果、Canvasが等しい領域に分割された Display の配列が作成されます。Display は、左から右、上から下に向かってDisplay 1、Display 2、Display 3などと名前が付けられます。同時に、関連するDisplayノードと関連するPatc"
    status: draft-needs-review
    basis: Existing alt text, heading and adjacent prose only; no visual inspection or new behavioral claim.
    placement:
      before_block: 18
      section: Display 配列の作成
    source_url: https://help.screenberry.com/images/display-editor/animation/Creating-a-Display-Array.gif
    source_alt: Creating A Display Array
    text_coverage: not-independently-verified
  - id: ja-3db46e4341-005
    title: Renaming A Display
    caption: Renaming A Display
    show: "Renaming A Display. Use the adjacent instructions as the content brief: Display の名前を変更するには、次のいずれかの方法を使用します： Display を右クリックし、ドロップダウンメニューからRenameを選択し、表示されたダイアログボックスに新しい Display の名前を入力し、OKをクリックします。Display を選択し、Display のSettingsパネルのヘッダーで Display 名を変更します。"
    status: draft-needs-review
    basis: Existing alt text, heading and adjacent prose only; no visual inspection or new behavioral claim.
    placement:
      before_block: 22
      section: Display 名の変更
    source_url: https://help.screenberry.com/images/display-editor/animation/Renaming-a-Display.gif
    source_alt: Renaming A Display
    text_coverage: not-independently-verified
  - id: ja-3db46e4341-006
    title: Selecting Displays 1
    caption: Selecting Displays 1
    show: "Selecting Displays 1. Use the adjacent instructions as the content brief: Display を選択するには、Display Editor内の Display を左クリックするか、ナビゲーションツリー内の Display 名をクリックします。 Display Editor内の Display またはナビゲーションツリー内の Display 名を**Shift**キーを押しながらクリックすることで、複数の Display を選択することができます"
    status: draft-needs-review
    basis: Existing alt text, heading and adjacent prose only; no visual inspection or new behavioral claim.
    placement:
      before_block: 24
      section: Display の選択
    source_url: https://help.screenberry.com/images/display-editor/animation/Selecting-Displays-1.gif
    source_alt: Selecting Displays 1
    text_coverage: not-independently-verified
  - id: ja-3db46e4341-007
    title: Selecting Displays 2
    caption: Selecting Displays 2
    show: "Selecting Displays 2. Use the adjacent instructions as the content brief: Display Editor内の Display またはナビゲーションツリー内の Display 名を**Shift**キーを押しながらクリックすることで、複数の Display を選択することができます 複数の Display は、Display Editorの空白領域をマウスで左ドラッグすることで一度に選択することもできます。"
    status: draft-needs-review
    basis: Existing alt text, heading and adjacent prose only; no visual inspection or new behavioral claim.
    placement:
