  - id: ja-36bd81b2f0-002
    title: Deleting Media Items
    caption: Deleting Media Items
    show: "Deleting Media Items. Use the adjacent instructions as the content brief: メディアアイテムを削除するには、フォルダコンテンツエリアでメディアアイテム（複数のメディアアイテムの選択）を右クリックし、Remove Item from Media Libraryを選択するか、Shift + Del を押します。"
    status: draft-needs-review
