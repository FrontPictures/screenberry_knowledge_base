  - id: ja-36bd81b2f0-004
    title: Searching Media Items 1
    caption: Searching Media Items 1
    show: "Searching Media Items 1. Use the adjacent instructions as the content brief: 特定のメディアアイテムを検索するには、Media Libraryの検索ボックスに名前の一部を入力してください。その結果、検索条件に一致する名前やユーザー定義のラベルを持つメディアアイテムのみがコンテンツエリアに表示されます。Mediaフォルダが選択されている場合、検索はすべてのフォルダで実行されます。"
