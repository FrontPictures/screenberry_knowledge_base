  - id: ja-36bd81b2f0-001
    title: Adding Media Files
    caption: Adding Media Files
    show: "Adding Media Files. Use the adjacent instructions as the content brief: サーバーにメディアファイルを追加するには、次のいずれかの方法を実行します。 Media Libraryフォルダを選択し、フォルダツリーエリアの下部にあるAdd Mediaボタンを押します。ファイルを既存のMedia Libraryフォルダにドラッグアンドドロップします。ファイルを既存のMedia Playerウィジェットのプレイリストにドラッグアンドドロップします。 表示されたAdd Media File(s) ダイアログボックスで、必要に応じてメディアアイテムの解像度を変更したり品質を変更したりしてから、Addボタンを押してください。"
    status: draft-needs-review
    basis: Existing alt text, heading and adjacent prose only; no visual inspection or new behavioral claim.
    placement:
      before_block: 4
      section: メディアファイルの追加
