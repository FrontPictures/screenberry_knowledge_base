    caption: Adding Media Files
    show: "Adding Media Files. Use the adjacent instructions as the content brief: もし、Media LibraryでMediaフォルダが選択されている場合、すべてのフォルダの内容が表示され、メディアアイテムをフォルダ間でドラッグアンドドロップすることができます。"
