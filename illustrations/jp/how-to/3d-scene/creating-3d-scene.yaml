    title: Creating 3D Scene
    caption: Creating 3D Scene
    show: "Creating 3D Scene. Use the adjacent instructions as the content brief: 3D Sceneノードが追加されると、対応するウィジェットが自動的に作成されます。3D Sceneノードをダブルクリックするか、メインの Screenberry パネルメニューで Window > [3D Scene] を選択してアクセスできます。 3D シーンに追加されたすべてのオブジェクト（ノードグラフで関連ノードを3D Sceneノードに接続することで追加されます）は 3D 環境に追加されます。これらのオブジェクトのリストはウィジェットの右上ペインで確認でき、リストから選択されたオブジェクトの設定パネルはこのペインのすぐ下にあります。"
