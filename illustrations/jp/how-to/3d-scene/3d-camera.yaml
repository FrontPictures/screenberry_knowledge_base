    title: 3D Camera
    caption: 3D Camera
    show: "3D Camera. Use the adjacent instructions as the content brief: Node Graph ウィジェットに移動します。ノードグラフに 3D Camera ノードを追加します。3D Camera ノードの Camera 出力パラメータを 3D Scene ノードの Camera 入力パラメータに接続します。これによりカメラがシーンに統合されます。3D Scene ウィジェットに切り替えて、3D シーンツールを使用するか、3D Camera の設定で直接カメラの位置と向きをさらに調整します。 3D Camera ノードが 3D Scene ノードに接続されると、3D Scene ノードに 3D Camera 出力パラメータが追加されます。このパラメータはカメラビュー映像を出力し、Canvas や Display ノードなどの映像表示用ノードにルーティングできます。 カメラ設定では、シーン内の 3D カメラ ビューのパラメータを設定できます。"
