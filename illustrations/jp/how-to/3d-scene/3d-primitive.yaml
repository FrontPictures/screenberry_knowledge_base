    show: "3D Primitive. Use the adjacent instructions as the content brief: 3D プリミティブを追加するには、以下の手順に従ってください： Node Graph ウィジェットに移動します。ノードグラフに 3D Primitive ノードを追加します。3D Primitive ノードの Object 出力パラメータを 3D Scene ノードの Object 入力パラメータに接続します。必要であれば（この手順は後で 3D シーン内で直接実行することもできます）、3D Primitive ノードの設定で追加したい幾何学的形状の種類を選択します。選択肢には球体、ボックス、円柱、平面、ドームが含まれます。3D Scene ウィジェットに切り替えて、3D シーン ツールを使用するか、3D Primitive の設定内でプリミティブの位置と寸法をさらに調整します。 3D プリミティブ の設定には以下が含まれます："
