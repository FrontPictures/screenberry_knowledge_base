  - id: ja-6773de5d66-001
    title: 3D Model File
    caption: 3D Model File
    show: "3D Model File. Use the adjacent instructions as the content brief: 3D モデルを追加するには、以下の手順に従ってください： Node Graph ウィジェットに移動します。3D Model File ノードをノードグラフに追加します。3D Model File ノードの設定で、Filename パラメータを使用して目的の 3D モデルファイルを選択します。3D Model File ノードの Object 出力パラメータを 3D Scene ノードの Object 入力パラメータに接続します。3D Scene ウィジェットに切り替えて、3D シーンツールを使用するか 3D Model File の設定内で 3D モデルの位置とサイズをさらに調整します。 3D Model File の設定には以下が含まれます："
