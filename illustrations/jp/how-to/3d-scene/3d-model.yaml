  - id: ja-6773de5d66-002
    title: 3D Model Export
    caption: 3D Model Export
    show: "3D Model Export. Use the adjacent instructions as the content brief: 3D モデルを書き出すには、以下の手順に従ってください： Node Graph ウィジェットに移動します。3D Model Export ノードをノードグラフに追加します。3D Model File ノードおよび/または 3D Primitive ノードの Object 出力パラメータを、3D Model Export ノードの Source Object 入力パラメータに接続します。3D Model Export ノードの設定で、Filename パラメータに 3D モデルファイルのパスと名前を入力し、Save File ボタンをクリックします。"
