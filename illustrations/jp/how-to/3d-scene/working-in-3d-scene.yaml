  - id: ja-2d33a4f6c0-007
    title: Rotating Objects
    caption: Rotating Objects
    show: "Rotating Objects. Use the adjacent instructions as the content brief: オブジェクトが選択されている状態で、ビューポート内の任意の場所をドラッグすると、視点平面に平行な面上で回転します。 さらに、オブジェクトの 設定 パネルで 回転 パラメータの X、Y、Z 座標の角度を変更することでもオブジェクトを回転させることができます。"
    status: draft-needs-review
