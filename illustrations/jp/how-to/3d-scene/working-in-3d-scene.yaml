  - id: ja-2d33a4f6c0-008
    title: Scaling Objects
    caption: Scaling Objects
    show: "Scaling Objects. Use the adjacent instructions as the content brief: オブジェクトが選択されている状態で、ビューポート内の任意の場所をドラッグすると、比率を維持しながらサイズが変更されます。 さらに、オブジェクトの 設定 パネルで 拡大・縮小 パラメータの X、Y、Z 座標の値を変更することでもオブジェクトを拡大・縮小できます。"
    status: draft-needs-review
    basis: Existing alt text, heading and adjacent prose only; no visual inspection or new behavioral claim.
    placement:
