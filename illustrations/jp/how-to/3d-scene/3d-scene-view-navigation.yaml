    caption: 3Dシーンの表示と操作画面
    show: "3Dシーンの表示と操作画面. Use the adjacent instructions as the content brief: ビューセレクター：このツールバーには、3D Viewport / UV Viewer セレクターとカメラビューセレクターが含まれています。3D Viewport / UV Viewer セレクター3D Viewportは、3D環境がレンダリングされるインタラクティブな作業エリアです。3Dシーン内のオブジェクトの操作、選択、修正に使用されます。UV Viewerは、選択した3DオブジェクトのUVマップ（UVマップがある場合）を確認および編集するための特殊なビューモードです。カメラビューセレクターこのドロップダウンメニューでは、事前に用意された様々な表示方法（ビュー）やカスタムカメラアングルから選択することができます：Free Cameraは、ユーザーが視点を自由に移動、回転、ズームできるデフォルトのナビゲーションツールで、3D環境の制限のない探索を可能にします。3D Cameraは、ユーザーがカスタマイズした視点から3Dシーンを捉"
