  - id: ja-c4acaf7f87-012
    title: Groups
    caption: Groups
    show: "Groups. Use the adjacent instructions as the content brief: ! 異なるGroupノードの内容とメインのノードツリーを切り替えるには、Node Graphウィジェットのナビゲーションバーにあるグループ名のボタンをクリックします（ここでRootはメインのノードツリーを示しています）。 Groupノードにまとめられたノードを解体するには、Groupノードを右クリックし、ドロップダウンメニューからUngroupを選択します（または U キーを押します）。"
    status: draft-needs-review
    basis: Existing alt text, heading and adjacent prose only; no visual inspection or new behavioral claim.
    placement:
      before_block: 32
      section: ノードのグループ化
    source_url: https://help.screenberry.com/images/working-with-nodes/static/groups.png
    source_alt: Groups
    text_coverage: not-independently-verified
