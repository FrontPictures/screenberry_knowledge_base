  - id: ja-fee823657f-010
    title: Searching the Nodes
    caption: Searching the Nodes
    show: "Searching the Nodes. Use the adjacent instructions as the content brief: プロジェクトに追加された特定のノードを検索するには、虫眼鏡ボタン（Node Graphウィジェットの左上隅にあります）をクリックしてください。または Ctrl + F を押し、開いた検索フィールドにノード名の一部を入力してください。一致するノードがリストに表示されます。リスト内のノード名をクリックしてノードグラフで選択します。 もし検索条件に一致するノードが複数ある場合、F3 を押すと、選択が結果リストの次のノードに切り替わります。"
    status: draft-needs-review
    basis: Existing alt text, heading and adjacent prose only; no visual inspection or new behavioral claim.
    placement:
      before_block: 28
      section: ノードの検索
    source_url: https://help.screenberry.com/images/working-with-nodes/animation/Searching-the-Nodes1.gif
    source_alt: Searching the Nodes
    text_coverage: not-independently-verified
