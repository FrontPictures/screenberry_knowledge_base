    text_coverage: not-independently-verified
  - id: ja-fee823657f-004
    title: Zooming and Panning
    caption: Zooming and Panning
    show: "Zooming and Panning. Use the adjacent instructions as the content brief: ビューをパンするには、次のいずれかを行います： マウスのスクロールホイールボタンを押したままにするか、マウスを移動する際に Alt キーを押します。右上隅の十字矢印ボタンをクリックし、マウスを移動します。"
    status: draft-needs-review
    basis: Existing alt text, heading and adjacent prose only; no visual inspection or new behavioral claim.
    placement:
      before_block: 11
      section: ノードグラフのズームとパン
    source_url: https://help.screenberry.com/images/working-with-nodes/animation/Zooming-and-Panning-in-the-Node-Graph.gif
    source_alt: Zooming and Panning
    text_coverage: not-independently-verified
  - id: ja-fee823657f-005
    title: Navigator Panel
    caption: Navigator Panel
    show: "Navigator Panel. Use the adjacent instructions as the content brief: ナビゲーターパネルを右クリックすると、標準モードと拡大モードの表示モードを切り替えることができます。 Node Graphウィジェットの空白の領域を右クリックし、Minimapチェックボックスを有効/無効にして（または Ctrl + M を押す）、ナビゲーターパネルの表示/非表示を切り替えることができます。"
    status: draft-needs-review
    basis: Existing alt text, heading and adjacent prose only; no visual inspection or new behavioral claim.
    placement:
      before_block: 17
      section: ナビゲーターパネルの使用方法
    source_url: https://help.screenberry.com/images/working-with-nodes/animation/Navigator-Panel-1.gif
    source_alt: Navigator Panel
    text_coverage: not-independently-verified
  - id: ja-fee823657f-006
    title: Nodes Color Coding
    caption: Nodes Color Coding
    show: "Nodes Color Coding. Use the adjacent instructions as the content brief: 色分けは、さまざまなタイプのノードを示すために使用されます。 以下の色の組み合わせはデフォルトで設定されており、Preferences > Nodes Color Settings で変更することができます。"
    status: draft-needs-review
    basis: Existing alt text, heading and adjacent prose only; no visual inspection or new behavioral claim.
    placement:
      before_block: 19
      section: ノードの色分け
    source_url: https://help.screenberry.com/images/working-with-nodes/static/ColorCoding.png
    source_alt: Nodes Color Coding
    text_coverage: not-independently-verified
  - id: ja-fee823657f-007
    title: Nodes Color Settings
    caption: Nodes Color Settings
    show: "Nodes Color Settings. Use the adjacent instructions as the content brief: 以下の色の組み合わせはデフォルトで設定されており、Preferences > Nodes Color Settings で変更することができます。 コピー＆ペーストの方法：Media Library、別のMedia Playerのプレイリスト、またはタイムラインで選択したメディアアイテムを選択します。右クリックしてドロップダウンメニューからCopyを選択するか、Ctrl + C のキーボードショートカットを使用してこれらのアイテムをコピーします。コピーしたメディアアイテムのシーケンスの開始グリッドセルを選択し、そこにアイテムを貼り付けます。これは右クリックしてドロップダウンメニューからPasteを選択するか、Ctrl + V のショートカットを使用して行うこともできます。 色分けは、Node Type、Category、およびTagに基づいています。"
    status: draft-needs-review
    basis: Existing alt text, heading and adjacent prose only; no visual inspection or new behavioral claim.
    placement:
      before_block: 21
      section: ノードの色分け
    source_url: https://help.screenberry.com/images/working-with-nodes/static/NodesColorSettings-1.png
    source_alt: Nodes Color Settings
    text_coverage: not-independently-verified
  - id: ja-fee823657f-008
    title: Nodes Color Settings
    caption: Nodes Color Settings
    show: "Nodes Color Settings. Use the adjacent instructions as the content brief: 新しいカスタムカラーテーマを作成するには、ボタンを押して、異なる16 進数カラー値を各 Type、Category、および Tag に割り当てます。 Typeの色設定はCategoryの色設定よりも優先され、Categoryの色設定はTagの色設定よりも優先されます。ノードの色が割り当てられる際に、これらのグループのいずれにも色が設定されていない場合、ノードの色はグレーのままです。 ノードのカラースキームを切り替えるには、Color Themeのドロップダウンリストでプロファイルを選択してください。"
    status: draft-needs-review
    basis: Existing alt text, heading and adjacent prose only; no visual inspection or new behavioral claim.
    placement:
      before_block: 24
      section: ノードの色分け
    source_url: https://help.screenberry.com/images/working-with-nodes/static/NodesColorSettings2-1.png
    source_alt: Nodes Color Settings
    text_coverage: not-independently-verified
