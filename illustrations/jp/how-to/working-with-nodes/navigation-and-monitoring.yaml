  - id: ja-fee823657f-001
    title: Auto-Layout Nodes
    caption: Auto-Layout Nodes
    show: "Auto-Layout Nodes. Use the adjacent instructions as the content brief: ノードグラフ内のノードを整列するには、ノードを右クリックしてドロップダウンメニューからAuto-Layout Nodesを選択します（または L キーを押します）。ノードが選択されていない場合、Auto-Layout Nodesを使用すると、ノードツリー全体が整列されます。"
    status: draft-needs-review
    basis: Existing alt text, heading and adjacent prose only; no visual inspection or new behavioral claim.
    placement:
      before_block: 3
      section: ノードの自動配置
    source_url: https://help.screenberry.com/images/working-with-nodes/animation/Auto-Layout-Nodes.gif
    source_alt: Auto-Layout Nodes
    text_coverage: not-independently-verified
  - id: ja-fee823657f-002
    title: Fit to View
    caption: Fit to View
    show: "Fit to View. Use the adjacent instructions as the content brief: ノードグラフ内で 1 つまたは複数の選択されたノードを中心に最適に表示するには、ノードを右クリックしてドロップダウンメニューからFit to Viewを選択します（または A キーを押します）。ノードが選択されていない場合は、Fit to View機能を使用するとノードツリー全体が表示されます。"
    status: draft-needs-review
    basis: Existing alt text, heading and adjacent prose only; no visual inspection or new behavioral claim.
    placement:
      before_block: 5
      section: ノードの表示に合わせる
    source_url: https://help.screenberry.com/images/working-with-nodes/animation/Fit-To-View-For-Nodes.gif
    source_alt: Fit to View
    text_coverage: not-independently-verified
  - id: ja-fee823657f-003
    title: Changing Node Size
    caption: Changing Node Size
    show: "Changing Node Size. Use the adjacent instructions as the content brief: ノードのサイズを変更するには、ノードを選択し、マウスオーバー時に表示される四隅のコーナーハンドルのいずれかをドラッグしてください。"
    status: draft-needs-review
    basis: Existing alt text, heading and adjacent prose only; no visual inspection or new behavioral claim.
