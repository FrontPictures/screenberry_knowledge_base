  - id: ja-fee823657f-012
    title: Using Tooltips
    caption: Using Tooltips
    show: "Using Tooltips. Use the adjacent instructions as the content brief: ノードパラメータ名（またはピン）の上にマウスを移動すると、リンクに流れるデータを含むパラメータのプロパティが表示される情報ツールチップが開きます（表示可能な場合）。この機能は、デバッグ中に特に便利であり、ノードのSettingsパネルを参照する必要なく、関連する情報に素早くアクセスできます。"
    status: draft-needs-review
    basis: Existing alt text, heading and adjacent prose only; no visual inspection or new behavioral claim.
