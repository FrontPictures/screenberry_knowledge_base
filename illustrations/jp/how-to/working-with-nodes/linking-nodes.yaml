  - id: ja-f3dbb99d85-005
    title: Rearranging Links Between Nodes
    caption: Rearranging Links Between Nodes
    show: "Rearranging Links Between Nodes. Use the adjacent instructions as the content brief: リンク（または複数のリンク）を1つのピンから別のピンに移動するには、ピンを Shift キーを押しながらクリックし、リンク（複数のリンク）を新しいピンまたはノードにドラッグします。"
    status: draft-needs-review
    basis: Existing alt text, heading and adjacent prose only; no visual inspection or new behavioral claim.
    placement:
      before_block: 13
      section: ノード間のリンクの並べ替え
    source_url: https://help.screenberry.com/images/working-with-nodes/animation/Rearranging-Links-Between-Nodes.gif
    source_alt: Rearranging Links Between Nodes
    text_coverage: not-independently-verified
  - id: ja-f3dbb99d85-006
    title: Reestablishing Links Automatically
    caption: Reestablishing Links Automatically
    show: "Reestablishing Links Automatically. Use the adjacent instructions as the content brief: Node Graphウィジェットの空いた領域を左クリックして、すべてのノードの選択を解除します。Ctrl キーを押しながら、接続したいノードを順番に選択します。選択したノード間に適切なリンクが自動的に作成され、新しいリンクと競合する既存のリンクは削除されます。"
    status: draft-needs-review
    basis: Existing alt text, heading and adjacent prose only; no visual inspection or new behavioral claim.
    placement:
      before_block: 15
      section: ノード間のリンクを自動的に作成する
    source_url: https://help.screenberry.com/images/working-with-nodes/animation/Reestablishing-Links-Automatically.gif
    source_alt: Reestablishing Links Automatically
    text_coverage: not-independently-verified
  - id: ja-f3dbb99d85-007
    title: Reordering Node Links
    caption: Reordering Node Links
    show: "Reordering Node Links. Use the adjacent instructions as the content brief: 複数のリンクがノードの同じ入力ピンに接続されている場合、リンクが作成された順序で処理が実行されます。入力の処理順序を変更するには、入力パラメータのピンまたは名前を右クリックし、Reorder Links for [パラメータ名] を選択します。表示されるダイアログボックスで、リンクの名前をドラッグしたり、名前を選択して矢印ボタンを使用して入力を並び替えてください。"
    status: draft-needs-review
    basis: Existing alt text, heading and adjacent prose only; no visual inspection or new behavioral claim.
    placement:
      before_block: 17
      section: ノードリンクの並び替え
    source_url: https://help.screenberry.com/images/working-with-nodes/animation/Reordering-Node-Links.gif
    source_alt: Reordering Node Links
    text_coverage: not-independently-verified
  - id: ja-f3dbb99d85-008
    title: Route Pin
    caption: Route Pin
    show: "Route Pin. Use the adjacent instructions as the content brief: Reroute Pinを追加するには、ノード間のリンク上で右クリックし、ドロップダウンメニューからReroute Pinを選択します。 Reroute Pinを削除するには、これを右クリックし、ドロップダウンメニューから Delete を選択します（または Del キーを押します）。"
    status: draft-needs-review
