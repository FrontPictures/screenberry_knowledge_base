  - id: ja-f3dbb99d85-001
    title: Links Nodes Automatically
    caption: Links Nodes Automatically
    show: "Links Nodes Automatically. Use the adjacent instructions as the content brief: ノード間のリンクを自動的に作成するには、1つ以上のノードを選択し、Ctrl キーを押しながら対象のノードを左クリックします。Screenberryは同じタイプのパラメータを識別してリンクを確立します。これはノードを接続する最速の方法です。"
    status: draft-needs-review
    basis: Existing alt text, heading and adjacent prose only; no visual inspection or new behavioral claim.
    placement:
      before_block: 3
      section: 自動的にノード間のリンクを作成する
    source_url: https://help.screenberry.com/images/working-with-nodes/animation/Links-Nodes-Automatically.gif
    source_alt: Links Nodes Automatically
    text_coverage: not-independently-verified
  - id: ja-f3dbb99d85-002
    title: Links Nodes With Ctrl
    caption: Links Nodes With Ctrl
    show: "Links Nodes With Ctrl. Use the adjacent instructions as the content brief: メモ： リンクは同じタイプのピン間でのみ可能です。 メモ： 1つのリンクに対して複数のピンが利用可能な場合があります。ターゲットノードの側にリンクをドラッグすると、すべての有効な接続を表示できます。 メモ： 一つのピンへの複数のリンクを作成する場合、パラメータのタイプによって、新しいリンクが既存のリンクを置き換えるか、既存のリンクに追加されるかが異なります。"
    status: draft-needs-review
    basis: Existing alt text, heading and adjacent prose only; no visual inspection or new behavioral claim.
    placement:
      before_block: 7
      section: ノード間のリンクを手動で作成する
    source_url: https://help.screenberry.com/images/working-with-nodes/animation/Links-Nodes-with-Ctrl.gif
    source_alt: Links Nodes With Ctrl
    text_coverage: not-independently-verified
  - id: ja-f3dbb99d85-003
    title: Removing Node Links1
    caption: Removing Node Links1
    show: "Removing Node Links1. Use the adjacent instructions as the content brief: リンクまたはノードピン（またはそのパラメータ名）を右クリックし、Unlink [パラメータ名] を選択すると、リンクが削除されます。 または、ピンを Shift キーを押しながらクリックし、リンクをノードグラフの空白の領域にドラッグすることでもリンクを削除することができます。"
    status: draft-needs-review
    basis: Existing alt text, heading and adjacent prose only; no visual inspection or new behavioral claim.
    placement:
      before_block: 10
      section: ノード間のリンクの削除
    source_url: https://help.screenberry.com/images/working-with-nodes/animation/Removing-Node-Links1.gif
    source_alt: Removing Node Links1
    text_coverage: not-independently-verified
