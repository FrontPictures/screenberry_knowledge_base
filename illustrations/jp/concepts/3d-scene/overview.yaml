    show: "3D Scene Illustration. Use the adjacent instructions as the content brief: 3Dマッピング：3DオブジェクトやモデルへのUVマッピングやプロジェクションマッピングの適用。コンテンツの再マッピング：球体や円柱などの基本的な3D形状に画像やテクスチャを簡単に再マッピングすること。環境シミュレーション：投影設計時の実世界のプロジェクション設定のシミュレーション。 3D Sceneウィジェット内では、オブジェクトの操作、カメラやプロジェクションマッパー（プロジェクター）の管理、テクスチャの適用とブレンドを行うことができます。"
