    title: Adding Widget
    caption: Adding Widget
    show: "Adding Widget. Use the adjacent instructions as the content brief: * 「映像」という用語は、静的または動的なメディア（つまり動画）を指します。 ** Patch Editorにアクセスするには、ワークスペースにCanvas（またはRender Target）ウィジェットを追加し、次にウィジェットの左上にあるPatchタブをクリックしてPatch表示に切り替えます。"
