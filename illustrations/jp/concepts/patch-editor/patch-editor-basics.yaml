  - id: ja-1003918201-002
    title: Patch Editor View
    caption: Patch Editor View
    show: "Patch Editor View. Use the adjacent instructions as the content brief: Patch Editorの画面構成：（1）表示モードバー、（2）2つのパートに分割された作業エリア：（A）Inputパネルと（B）Outputパネル、（3）ナビゲーションツリー、（4）Settingsパネル。"
