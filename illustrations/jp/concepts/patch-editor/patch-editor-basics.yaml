  - id: ja-1003918201-004
    title: View Options
    caption: View Options
    show: "View Options. Use the adjacent instructions as the content brief: View Optionsパネルでは、以下の要素の表示または非表示を設定することができます： Rulers： PatchやDisplayの位置やサイズを正確に配置するための目印です。Labels： PatchやDisplayの名前を表示します。Coordinates： Patchの制御点の位置座標を表示します。Live Image： 現在の映像出力のプレビューがリアルタイムに更新されます。Reference Image： 制御点のより正確な位置決めのための背景として使用される参照イメージです。"
    status: draft-needs-review
    basis: Existing alt text, heading and adjacent prose only; no visual inspection or new behavioral claim.
    placement:
      before_block: 17
      section: 表示オプション
    source_url: https://help.screenberry.com/images/patch-editor/animation/View-Options.gif
    source_alt: View Options
    text_coverage: not-independently-verified
  - id: ja-1003918201-005
    title: Zoom And Pan
    caption: Zoom And Pan
    show: "Zoom And Pan. Use the adjacent instructions as the content brief: Patch EditorのInputまたはOutputパネルの特定のエリアをズームインおよびズームアウトするには、マウスカーソルをその領域に置き、マウスのスクロールホイールを使用します。または、パネルの右上隅にあるズームボタンをクリックし、マウスを移動して拡大率を変更します。 表示エリアをパンするには、左マウスボタンを押したままマウスを移動するか、パネルの右上隅にあるパンボタンをクリックし、マウスを移動します。"
    status: draft-needs-review
    basis: Existing alt text, heading and adjacent prose only; no visual inspection or new behavioral claim.
    placement:
