  - id: ja-6c23905d4f-002
    title: Example
    caption: Example
    show: "Example. Use the adjacent instructions as the content brief: ノードグラフは、ノードを追加してリンクさせることで作成されます。データは、ノードの右側の出力ピンと左側の入力ピンの間のリンクを通じて左から右へと流れます。ノードグラフは、レンダリングされたビデオ、画像、およびオーディオの結果を示すデータフローとプロセスを視覚的に表現しています。 ノードグラフの例"
    status: draft-needs-review
