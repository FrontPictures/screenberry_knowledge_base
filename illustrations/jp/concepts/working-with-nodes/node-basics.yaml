  - id: ja-6c23905d4f-005
    title: Node Status
    caption: Node Status
    show: "Node Status. Use the adjacent instructions as the content brief: ノードは、インジケータで表示される次の3つの状態のいずれかになることがあります： 有効化されている状態（緑） 無効化されている状態（灰色） 有効化されているが、アクティブではない状態（赤） ノードを無効化または有効化するには、ノードを右クリックし、ドロップダウンメニューでEnabledのチェックボックスを選択/非選択してください。"
    status: draft-needs-review
