  - id: ja-6c23905d4f-003
    title: Links
    caption: Links
    show: "Links. Use the adjacent instructions as the content brief: ノードグラフの例 ノード間のリンクはグレーの線で表示されます。選択されたノードへのリンクは緑でハイライトされます。データが送信されている場合（例えば、タイムコードが送信されている場合）、リンクはアニメーション表示されます。"
