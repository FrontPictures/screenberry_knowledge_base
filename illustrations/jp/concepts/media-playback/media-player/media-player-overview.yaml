  - id: ja-1f0377fdba-002
    title: Media Player Widget
    caption: Media Player Widget
    show: "Media Player Widget. Use the adjacent instructions as the content brief: Media PlayerノードがNode Graphに追加されると、対応するMedia Playerウィジェットがアクセス可能になります。このウィジェットをワークスペースに追加するには、Screenberry Panel のメインメニューから Window > [Media Player名] を選択してください。 メモ： 複数のMedia Playerノードを作成することができます。追加された各MediaPlayerノードには、独自のMedia Playerウィジェットが用意されます。"
    status: draft-needs-review
    basis: Existing alt text, heading and adjacent prose only; no visual inspection or new behavioral claim.
