  - id: ja-1f0377fdba-001
    title: Mediaplayerview
    caption: Mediaplayerview
    show: "Mediaplayerview. Use the adjacent instructions as the content brief: DisplayとPatchを使うことで、メディアプレーヤーは出力画面上で異なるサイズ、位置、形状で映像を重ねることができます。 メディアプレーヤーの再生は自動化することができます。そのためにメディアプレーヤー自体だけでなく、それぞれのプレイリスト、タイムライン、メディアアイテムなども、MIDI / キーボード / IPイベント、スクリプト、DMXコマンドなどによって手動または自動的にトリガーを受信することができます。 Media Playerの画面構成： 1 – ナビゲーションパネル、2 – 現在のプレイリストまたはタイムラインのコンテンツエリア、3 – 再生制御と設定のためのコントロールバー。"
    status: draft-needs-review
