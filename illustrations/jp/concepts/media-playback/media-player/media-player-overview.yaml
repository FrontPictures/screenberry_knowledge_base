  - id: ja-1f0377fdba-003
    title: PlaylistsTimelinesFolders
    caption: PlaylistsTimelinesFolders
    show: "PlaylistsTimelinesFolders. Use the adjacent instructions as the content brief: メディア再生のために、メディアアイテムはプレイリストに追加することも、タイムライン内に配置することもできます。 さらに、複数のプレイリストとタイムラインはフォルダで整理することもできます。新しいフォルダを作成するには、ナビゲーションパネルの空白のエリアを右クリックし、ドロップダウンメニューからAdd Folderを選択するか、ナビゲーションパネルの下部ツールバーのAdd Folderボタンをクリックしてください。 メモ： デフォルトでは、新しいMedia Playerウィジェットには空のPlaylistが1つ作成されます。このプレイリストには、メディアアイテムをMedia Libraryからドラッグ＆ドロップするか、直接システムフォルダから追加することができます。プレイリストへのメディアアイテムの追加については、メディアアイテムをプレイリストに追加の章を参照してください。"
    status: draft-needs-review
