  - id: ja-16c0efcdab-001
    title: Media Library View
    caption: Media Library View
    show: "Media Library View. Use the adjacent instructions as the content brief: Media Library（メディアライブラリー）ウィジェットでは、ユーザーがサーバーに保存されているメディアコンテンツをアップロード、表示、管理することができます。Screenberry Panelのメインメニューから、Window > Media Library を選択して追加することができます。 Media libraryの画面構成： 1 - フォルダツリー、2 - コンテンツエリア、3 - メディアライブラリ情報とコントロールバー。"
