  - id: ja-16c0efcdab-002
    title: Media Library Controls
    caption: Media Library Controls
    show: "Media Library Controls. Use the adjacent instructions as the content brief: Mediaフォルダはデフォルトのルートフォルダであり、削除することはできません。新しいフォルダはすべてMediaフォルダ内に作成されます。 Interruptボタンは、アップロード/変換処理を停止します。Uploadingの進捗バーは、サーバーにアップロードされたメディアアイテムの割合と、既にアップロードされたファイルの数/アップロード中の総ファイル数を表示します。Convertingの進捗バーは、各メディアファイルの変換の進捗率を表示します。メディアアイテムのSearchボックス。Disk Space Usage Informationは、使用済みスペース/サーバー内蔵ドライブの総容量を表示します。Thumbnail Size Slidersは、メディアファイルのサムネイルのスケールと幅を調整します。Refreshボタンは、メディアライブラリに表示されるコンテンツを更新します。"
